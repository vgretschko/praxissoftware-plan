Walk-ins have no history offline."},{"key":"c","label":"Rolling window (Kunden with a Sprechtag from −30 to +14 days plus Probanden opened in the last 90 days)","pros":"Some history for walk-ins.","cons":"Larger exposure; more sync."},{"key":"d","label":"Full replica","pros":"Everything everywhere.","cons":"All Art. 9 data of 5,000–15,000 Probanden on every laptop."}],"recommended":"b","why":"Covers walk-ins with minimal health data; scans opt-in per Proband only if the physician needs them.","blocks":"M7 package builder, DPIA"},{"id":"D-56","title":"Offline unlock and the second factor","question":"How does Zweiter Faktor bei jeder Anmeldung (twoFactor J3) work on a laptop without network?","owner":"both","context":"The server cannot check a TOTP code offline. Checkout of a package needs a full online login with second factor and a step-up. The DPO confirms the result.","options":[{"key":"a","label":"Offline passphrase (at least 12 characters, PBKDF2 600,000 iterations) plus a non-extractable device key; commands signed with a per-package authoring key; lock after 60 minutes idle; package valid until Sprechtag + 72 hours; wipe after 10 wrong attempts","pros":"Works in every current browser; two factors (device and knowledge).","cons":"A weak passphrase can be brute-forced from a stolen profile; full-disk encryption is the base layer."},{"key":"b","label":"Platform authenticator or passkey with the WebAuthn PRF extension","pros":"Strong, no passphrase.","cons":"PRF support uneven in 2026; losing the passkey loses unsynced data unless escrowed."},{"key":"c","label":"PIN within a 72-hour lease renewed by each online TOTP login","pros":"Simple for users.","cons":"Weaker than the passphrase."},{"key":"d","label":"No offline unlock; the session opened online stays unlocked all day","pros":"Simplest.","cons":"Conflicts with the 60-minute logout; a closed tab locks the physician out."}],"recommended":"a","why":"Works today in every browser; b becomes an option once browser support is uniform; usability is tested on the practice's laptops in the M7 field test.","blocks":"GL2 (REQ-OFF-03, SEC-57, SEC-58)"},{"id":"D-57","title":"Offline devices and tablet support","question":"Which devices may hold offline health data, and is the iPad (devices I1) a supported V1 device, online and offline?","owner":"practice","context":"Safari deletes script-writable storage after 7 days without interaction unless the app runs from the Home Screen (WebKit); modules.tablet (H1) is Später; inputPref (K4) names mouse and keyboard.","options":[{"key":"a","label":"Practice-owned laptops with full-disk encryption, Chrome or Edge as installed PWA for offline; iPad online in V1, offline as Home Screen app in V1.3 after its own field test","pros":"Controllable, defensible in the DPIA; no doubled UI work.","cons":"An iPad is online-only until V1.3."},{"key":"b","label":"Laptops and iPads offline from GL2","pros":"Matches I1.","cons":"Storage eviction risk; more testing at the riskiest milestone."},{"key":"c","label":"Any physician's device with disk encryption confirmed","pros":"No purchase.","cons":"Private devices are hard to control and revoke."}],"recommended":"a","why":"One reference platform at the riskiest milestone; the iPad follows after its own field test.","blocks":"M7 device enrolment, M9 iPad offline"},{"id":"D-58","title":"Order of offline and lab after the certificates","question":"After M5, do findings and offline come before lab and Immunstatus, or the other way round?","owner":"practice","context":"Lab is item 3 of top3 (M1) and the lab can switch to digital delivery at once (note_I); lab sign-off needs the findings context of M6.","options":[{"key":"a","label":"Findings and offline (M6, M7), then lab (M8)","pros":"Retires the largest technical risk while capacity is fresh; offline is V1 in H1.","cons":"Digital lab intake arrives in summer 2028."},{"key":"b","label":"Lab and Immunstatus first","pros":"Lab merging about four months earlier.","cons":"Lab sign-off lacks the findings context; offline slips while documentation stays on paper."}],"recommended":"a","why":"Risk first, and lab builds on the findings model.","blocks":"Order of M7 and M8"},{"id":"D-59","title":"Lab result import path","question":"How do lab results enter the system once the lab delivers digitally (note_I)?","owner":"both","context":"LDT 3 is the KBV lab data format; whether the lab offers it to a practice outside the KV system is unknown.","options":[{"key":"a","label":"PDF upload (portal download or e-mail) plus manual entry of key values and an assignment screen","pros":"Works with any lab at once; about one dev-week.","cons":"Values typed by hand."},{"key":"b","label":"LDT 3 import with an own parser and auto-matching","pros":"Structured values flow in.","cons":"About one more dev-week; needs a synthetic sample file from the lab."},{"key":"c","label":"Automated channel (encrypted mail polled by the worker, or SFTP push)","pros":"No manual step.","cons":"Lab cooperation and setup."}],"recommended":"a","why":"a in M8, then b once the practice names the lab and provides a synthetic sample (P-6, by 2028-05-01).","blocks":"M8 (REQ-LAB-01 to -04)"},{"id":"D-60","title":"Immunstatus scope in V1","question":"Is Immunstatus tracking (status per disease, evidence, titers, booster and titer deadlines, Masern-Nachweis) in V1 although Impfmanagement is Später in H1?","owner":"practice","context":"vaccRecall (D14) wants boosters and titers as deadlines, docs (F1) includes an Impfbescheinigung, and lab work concerns mainly Impfschutz (C1); the practice does not vaccinate (D12).","options":[{"key":"a","label":"Immunstatus light: status per disease, evidence, titer values, booster and titer deadlines; no Impfbuch or Chargen","pros":"Fits D11, D14, F1 and C1; small.","cons":"Beyond the H1 answer."},{"key":"b","label":"Later, as H1 says","pros":"Smaller V1.","cons":"Titer deadlines and the lab merge lose their purpose."},{"key":"c","label":"Full Impfmanagement with Impfbuch","pros":"Complete.","cons":"The practice does not vaccinate."}],"recommended":"a","why":"What the lab flow and the recall wish need, without vaccination management.","blocks":"M8 (REQ-IMM-01 to -03)"},{"id":"D-61","title":"Immunity and Biostoff recall","question":"Does documented immunity stop or suppress the Biostoff Pflicht- or Angebotsvorsorge cycle?","owner":"practice","context":"ArbMedVV makes immunity relevant only for the Impfangebot (§ 6 Abs. 2 Satz 4); TRBA 250 has no waiver; a TRBA 100 rule for laboratories is unverified.","options":[{"key":"a","label":"The cycle continues; the physician may set n. n. per Anlass","pros":"Backed by the current texts.","cons":"More Vorsorgen for immune staff."},{"key":"b","label":"The software proposes n. n. when every Erreger of the Anlass is covered","pros":"Fewer appointments.","cons":"Relies on an unverified rule; legal risk."},{"key":"c","label":"No Biostoff recall once immune","pros":"Least effort.","cons":"Likely non-compliant with § 4 ArbMedVV."}],"recommended":"a","why":"The only option backed by the verified texts; the physician keeps the per-case decision.","blocks":"M8 engine rules for Biostoff Anlässe"},{"id":"D-62","title":"Assistant visibility of Impf-Fristen","question":"The assistant sees Fristen but no findings (J2). How much of an Impf or titer recall does the assistant see?","owner":"practice","context":"A label such as Kontrolle nach Zusatzdosis reveals a finding (low responder); the assistant still needs to invite.","options":[{"key":"a","label":"A neutral Impfstatus-Termin with the month; label, reason and values physician-only","pros":"The assistant can invite; no finding leaks.","cons":"The physician explains the purpose at the visit."},{"key":"b","label":"Full label","pros":"Transparent.","cons":"Labels reveal findings."},{"key":"c","label":"Not visible; physicians invite","pros":"Maximum confidentiality.","cons":"Contradicts the division of labour (tasks B3)."}],"recommended":"a","why":"Keeps the invitation workflow without disclosing findings.","blocks":"M8 roles and invitation templates"},{"id":"D-63","title":"Calendar scope in V1","question":"How much calendar does V1 need, given Wäre gut, aber nicht zwingend (calendarV1 C10) but Version 1 (modules.calendar H1)?","owner":"both","context":"Sprechtag planning with slots is what C1 describes; a two-way calendar sync is large and fragile.","options":[{"key":"a","label":"Sprechtag and slot planning in M5; a read-only ICS feed without Proband names in M9","pros":"Covers C1 and C9; no two-way sync.","cons":"Private appointments stay in the existing calendar."},{"key":"b","label":"Two-way sync with Google or Proton","pros":"One calendar.","cons":"Proton has limited APIs; fragile; another data-protection review."},{"key":"c","label":"Sprechtag planning only, no feed","pros":"Least effort.","cons":"Appointments copied by hand."}],"recommended":"a","why":"Delivers what the practice describes without a fragile sync.","blocks":"M9 (REQ-TER-07)"},{"id":"D-64","title":"Annual report content and format","question":"What does the annual report per Kunde contain and in which format, given that § 5 DGUV Vorschrift 2 prescribes no format?","owner":"practice","context":"The first report on system data covers 2028 and is due in early 2029; counting is one of the named time sinks (painNow B15).","options":[{"key":"a","label":"Generated statistics (counts per Anlass and Art, declines, no-shows, overdue) plus physician text sections, exported as editable .docx modelled on a previous report's layout","pros":"Removes the counting work; the physician edits before sending.","cons":"Edits outside the system are not stored back."},{"key":"b","label":"Fixed PDF only","pros":"Uniform; archived as issued.","cons":"No room for the physician's narrative."},{"key":"c","label":"Replicate last year's report exactly","pros":"Familiar.","cons":"May need content the system lacks (Begehungen, Einsatzzeiten)."}],"recommended":"a","why":"Automates the counting and leaves the narrative to the physician.","blocks":"M9 (REQ-AUS-01, -02)"}],"openQuestions":[{"id":"Q-01","question":"Which weekday and time suit the fixed 30-minute test slot every second week, and who tests for the assistant and for the physicians?","why":"The biweekly session is the acceptance gate of every release; agreed at the M0 demo (07 OQ-07-2, R-14).","owner":"practice"},{"id":"Q-02","question":"Can the practice send by 2027-03-15 the column headers (no content) of its Excel/Numbers deadline list and of two typical HR lists, plus a photo of an empty Karteikarte?","why":"The migration tool and the matching tests in M3 are built against these structures; real data never enter the repository before RD (07 P-1, P-2, OQ-07-3).","owner":"practice"},{"id":"Q-03","question":"Which Kunde should be the pilot (sends xlsx, 200–800 Probanden, keeps its own Kartei, Sprechtag in November 2027), and which Kunden follow in wave 1?","why":"Sets the cutover plan of M4 and the first real import in the week of 2027-10-04 (07 OQ-07-4, D-29).","owner":"practice"},{"id":"Q-04","question":"Are the Excel/Numbers deadline lists complete for all Kunden, or are some next dates only on the Karteikarten?","why":"Decides per Kunde whether Karteikarten must be entered before cutover, 60–200 hours of the assistant's time in total (07 OQ-07-5, D-26).","owner":"practice"},{"id":"Q-05","question":"What was the practice's 2026 turnover, split into Vorsorge, Eignungsuntersuchungen, ASiG Pauschale and Einsatzzeit, and Fahrtkosten, and how does the Steuerberater classify each for VAT?","why":"Whether e-invoices are required for services from 2027-01-01 depends on the 2026 Gesamtumsatz under § 19 Abs. 2 UStG; needed by 2026-12-15 (07 OQ-07-11, L-15, D-08).","owner":"practice"},{"id":"Q-06","question":"Does the practice already have a mail provider with an AVV that may send system mail and invitations (for example a paid mailbox.org Business account)? Otherwise a practice domain with mailbox is ordered by 2027-06-30.","why":"System mail is needed from GL1; the sender is a processor under Art. 28 GDPR (07 OQ-07-9, 06 Q7, D-28).","owner":"practice"},{"id":"Q-07","question":"Who in the practice receives system notices (failed backup, emergency access, second-factor reset), and who downloads the weekly archive?","why":"Owner notifications and the archive routine are GL1 checklist items (07 OQ-07-7, 02 OQ-5, D-37).","owner":"practice"},{"id":"Q-08","question":"How many hours a week can the assistant spend on the cutover between October 2027 and February 2028?","why":"Paces the waves of 07 §8.4 (07 OQ-07-8).","owner":"practice"},{"id":"Q-09","question":"Which laptops will the physicians take to Sprechtage (number, Windows or Mac, practice-owned, full-disk encryption), is there a printer in the Sprechzimmer, and is a phone hotspot usually possible on site?","why":"Device baseline, offline spike on the real model, on-site printing and daytime sync for M7 (02 OQ-1 to OQ-3, D-57).","owner":"practice"},{"id":"Q-10","question":"Which weekday evening suits a monthly maintenance window of about two hours, and is it acceptable that after an unplanned server restart the system stays locked until the operator unlocks it, usually within one working day?","why":"Maintenance window and the consequence of the encrypted vault (02 OQ-4, D-34).","owner":"practice"},{"id":"Q-11","question":"In which federal state is the practice registered?","why":"Determines the Berufsordnung of the Landesärztekammer and the supervisory authority for breach notifications (06 Q1).","owner":"practice"},{"id":"Q-12","question":"Is a physician of the practice ermächtigter Arzt for Strahlenschutz?","why":"Only then the Strahlenschutz certificate and the Gesundheitsakte retention rules apply; otherwise REQ-BES-07 is dropped (01 Q-25, 04 Q3, 06 Q2).","owner":"practice"},{"id":"Q-13","question":"For which Kunden does the practice keep the Vorsorgekartei today, and how often do Kunden want a Kartei export (monthly, quarterly, on audit)?","why":"Per-Kunde setting, contracts and the migration order (01 Q-09, Q-20, 06 Q3, D-47).","owner":"practice"},{"id":"Q-14","question":"What does owncloud in the remark on the technical frame refer to: an existing instance, a wish, or a synonym for cloud?","why":"Decides whether the practice copy can be pushed automatically (01 Q-08, 06 Q5, D-37).","owner":"practice"},{"id":"Q-15","question":"Who is the deputy physician, is there a written Vertretungsvereinbarung, who may open the emergency envelope, and is there a lockable cabinet or safe for it?","why":"Deputy access and the sealed envelope are RD and GL1 items (06 Q9, Q10, L-09, L-10, D-36).","owner":"practice"},{"id":"Q-16","question":"Dictation: which app on which phone, does it transcribe on the phone or send audio to a cloud service, and where are recordings kept?","why":"Findings must not reach an outside provider without an AVV and § 203 undertaking; RD item (06 Q15, SEC-90, L-19).","owner":"practice"},{"id":"Q-17","question":"What is used for scanning (consents, Altakten, signature), and should the upload accept phone photos?","why":"Consent scans gate the Eignung employer copy; no scanner is listed in the answers (01 Q-18).","owner":"practice"},{"id":"Q-18","question":"Should Wunschvorsorge, Mutterschutz-Beratung, BEM and declined Angebotsvorsorge appear on the Fälligkeitslisten for the employer?","why":"Such labels can reveal health information to HR (06 Q6, D-23).","owner":"practice"},{"id":"Q-19","question":"Do any Kunden's Gefährdungsbeurteilungen set shorter intervals than AMR 2.1 (D5 was left empty)?","why":"Priority of per-Kunde interval rules and the seed data (01 Q-23, 04 Q10).","owner":"practice"},{"id":"Q-20","question":"Does the practice perform JArbSchG examinations for Auszubildende under 18, and which Fahr-, Steuer- und Überwachungstätigkeiten occur at which Kunden on which legal basis?","why":"Seed rows and certificates for JArbSchG and FSÜ (04 Q6, Q7, 03 §9 Q6, D-21).","owner":"practice"},{"id":"Q-21","question":"Which lab is used, and what will it deliver after the switch to digital: LDT 3 file, PDF by e-mail, or portal download?","why":"Sets the M8 import path; a synthetic sample is needed by 2028-05-01 (01 Q-26, P-6, D-59).","owner":"practice"},{"id":"Q-22","question":"May the software record the events Angebotsvorsorge abgelehnt and Tätigkeit oder Exposition beendet, which were not ticked in C11?","why":"Needed for re-offering declined Angebote and for nachgehende Vorsorge (04 Q1, 01 Q-14).","owner":"practice"},{"id":"Q-23","question":"Is Hauspost via Station and Kunde always enough for letters, or are home addresses needed?","why":"Letter templates need an address; the Vorsorgebescheinigung also asks for the Privatanschrift under AMR 6.3 (01 Q-15).","owner":"practice"},{"id":"Q-24","question":"Is the 50 EUR monthly budget gross or net, and does it include domain and e-mail?","why":"The plan fits either way at about 39–40 EUR gross, but headroom differs (01 Q-21).","owner":"practice"},{"id":"Q-25","question":"Does the external DPO already keep a VVT for the practice, and can the DPO review the DPIA before the first real data (book during M2)?","why":"The DPO's written statement is an RD gate (06 Q13, L-07, D-39).","owner":"practice"},{"id":"Q-26","question":"How many focused hours a week are realistic until GL1 and after it?","why":"All dates assume 20; the hours log answers this after M1, when dates are recomputed (07 OQ-07-1, A-8).","owner":"developer"},{"id":"Q-27","question":"Who is the second technician who could follow the runbooks in an emergency, sign the § 203 undertaking and hold own access before RD?","why":"Without a named technician RD does not pass; needed by 2027-08-27 (07 OQ-07-6, L-18).","owner":"developer"}],"risks":[{"id":"R-01","title":"Developer capacity: fewer part-time hours than assumed push GL1 towards Christmas 2027","level":"high","mitigation":"Hours logged from week 1 and dates recomputed after M1; the practice sees the late dates until then; 10 % feedback allowance and non-feature stories budgeted; 15 % programme buffer for technical risk; a cut list per milestone."},{"id":"R-02","title":"Name-only HR lists: a wrong match plus automatic ausgeschieden ends the wrong person's Beschäftigung and stops a Pflichtvorsorge","level":"high","mitigation":"Tiered matching with confirmation, Gesamtliste scope, 30-day undo, automatic ausgeschieden off on a Kunde's first import, birth-date column requested from every Kunde (D-24, D-25)."},{"id":"R-03","title":"Migration quality: Excel lists and Karteikarten disagree, and current AMR 2.1 intervals flood the first lists with überfällig office staff","level":"high","mitigation":"Karteikarten entered where lists are incomplete (D-26), legacy positions flagged, reconciliation of 20 Probanden per Kunde, the physician reviews each first Fälligkeitsliste, parallel run until two clean Sprechtage (D-31)."},{"id":"R-04","title":"Legal track late: AVVs, developer agreement, DPIA or the DPO's statement not ready at RD","level":"medium","mitigation":"Track starts in M1; the developer drafts the technical parts; the DPO is booked during M2; RD is a hard gate, so lateness costs time, not compliance."},{"id":"R-05","title":"Engine interpretation wrong: a Pflichtvorsorge proposed too late","level":"medium","mitigation":"Case files signed off by the physician in M2; property test that no proposal exceeds the AMR 2.1 maximum; rule changes need approval with the number of Fristen that move."},{"id":"R-06","title":"Offline sync defect or lost laptop on site","level":"medium","mitigation":"One capture path in daily use from M2; idempotent commands; conflicts become tasks; two-laptop scenario in CI; field test with paper backup; packages encrypted per Sprechtag with passphrase and device key, revocable."},{"id":"R-07","title":"Findings leak to the assistant or an employer through a new route, export or template","level":"medium","mitigation":"Four enforcement layers including database roles; sentinel scans as a release gate; mail-template linter; each acceptance session includes a check from the assistant's account."},{"id":"R-08","title":"Single operator unavailable when the vault is locked after a reboot or a P1 occurs","level":"medium","mitigation":"Named second technician with own access before RD; runbooks and sealed envelope; reboots only in the window; paper and offline packages bridge a day (outage J10)."},{"id":"R-09","title":"E-invoicing duty arrives before a tool is chosen","level":"medium","mitigation":"Steuerberater by 2026-12-15; external tool by 2026-12-31 or 2027-10-31 depending on the answer; Leistungsnachweis export defined against its import and shipped before 2028-01-01 (D-08)."},{"id":"R-10","title":"Scope creep from urgent wishes (e-invoicing, Vorab-Anamnese, tablet) into running milestones","level":"medium","mitigation":"Decision register and Later list; any new item costs a named cut elsewhere."},{"id":"R-11","title":"Test sessions skipped or materials late (templates, signatures, Anamnese forms, lab sample)","level":"medium","mitigation":"Fixed biweekly slot; 30-minute scripted sessions; dated material list with documented fallbacks; templates are data, so late material changes a template, not code."},{"id":"R-12","title":"Real data reach development tools (a support case, a screenshot, a forwarded HR list)","level":"low","mitigation":"Synthetic data only outside production; support by synthetic reproduction or a physician's time-limited grant; HR lists only through the import, never by e-mail to the developer."},{"id":"R-13","title":"pdfmake cannot reproduce the practice's certificate closely enough","level":"low","mitigation":"Spike in M0 with the AMR 6.3 layout and again with the practice's templates in M5; letterhead stamping with pdf-lib as fallback."},{"id":"R-14","title":"Hosting market: price rises or a plan is withdrawn","level":"low","mitigation":"Provider-neutral bootstrap; the quarterly drill on a fresh server rehearses a move; about 10 EUR monthly headroom from GL1."}]}};

const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const fmt = (s, o) => String(s).replace(/\{(\w+)\}/g, (m, k) => (k in o ? o[k] : m));
const arr = a => (Array.isArray(a) ? a : []);
const ownerOf = o => (o === 'practice' || o === 'developer' ? o : 'both');
const levelOf = l => (l === 'high' || l === 'low' ? l : 'medium');
const nonEmpty = s => typeof s === 'string' && s.trim().length > 0;

const fresh = () => ({ v: 1, plan: PLAN_DATA.de.asOf, meta: { name: '', lang: null }, general: '', sections: {}, milestones: {}, decisions: {}, questions: {}, risks: '', updated: null });
let state = fresh();
let storageOK = true;
let lang = 'de';
let filter = 'all';

function normalize(o) {
  const s = fresh();
  if (o && typeof o === 'object') {
    ['sections', 'milestones', 'decisions', 'questions'].forEach(k => { if (o[k] && typeof o[k] === 'object' && !Array.isArray(o[k])) s[k] = o[k]; });
    if (typeof o.general === 'string') s.general = o.general;
    if (typeof o.risks === 'string') s.risks = o.risks;
    if (o.meta && typeof o.meta === 'object') s.meta = Object.assign(s.meta, o.meta);
    if (o.plan) s.plan = String(o.plan);
    if (o.updated) s.updated = o.updated;
  }
  return s;
}
function load() {
  try {
    const raw = localStorage.getItem(STORE_KEY);
    if (raw) state = normalize(JSON.parse(raw));
  } catch (e) { storageOK = false; }
}
let saveTimer = null;
function scheduleSave() { clearTimeout(saveTimer); saveTimer = setTimeout(save, 250); }
function save() {
  state.updated = new Date().toISOString();
  try { localStorage.setItem(STORE_KEY, JSON.stringify(state)); storageOK = true; }
  catch (e) { storageOK = false; }
  setSaveStatus();
}
function pickLang() {
  let q = null;
  try { q = new URLSearchParams(location.search).get('lang'); } catch (e) { q = null; }
  if (q === 'de' || q === 'en') return q;
  if (state.meta.lang === 'de' || state.meta.lang === 'en') return state.meta.lang;
  return 'de';
}

const D = () => PLAN_DATA[lang];
const T = () => UI[lang];

function decided(id) { const v = state.decisions[id]; return !!(v && v.choice); }
function feedbackCount() {
  let n = 0;
  if (nonEmpty(state.general)) n++;
  if (nonEmpty(state.risks)) n++;
  Object.values(state.sections).forEach(v => { if (v && (v.rating || nonEmpty(v.note))) n++; });
  Object.values(state.milestones).forEach(v => { if (nonEmpty(v)) n++; });
  Object.values(state.decisions).forEach(v => { if (v && nonEmpty(v.note)) n++; });
  Object.values(state.questions).forEach(v => { if (nonEmpty(v)) n++; });
  return n;
}
function hasAnyInput() { return feedbackCount() > 0 || Object.keys(state.decisions).some(decided) || nonEmpty(state.meta.name); }
function dateLabel(iso) {
  const d = new Date(String(iso) + 'T12:00:00');
  if (isNaN(d)) return String(iso);
  return d.toLocaleDateString(lang === 'de' ? 'de-DE' : 'en-GB', { day: 'numeric', month: 'long', year: 'numeric' });
}
function setSaveStatus() {
  const el = document.getElementById('saveStatus');
  if (!el) return;
  const t = T();
  if (!storageOK) { el.className = 'save bad'; el.textContent = t.storageBad; return; }
  if (!state.updated) { el.className = 'save'; el.textContent = t.nothingYet; return; }
  const d = new Date(state.updated);
  el.className = 'save ok';
  el.textContent = fmt(t.saved, { time: d.toLocaleString(lang === 'de' ? 'de-DE' : 'en-GB', { day: '2-digit', month: '2-digit', hour: '2-digit', minute: '2-digit' }) });
}

function observe() {
  if (!('IntersectionObserver' in window)) return;
  if (observer) observer.disconnect();
  observer = new IntersectionObserver(entries => {
    entries.forEach(en => {
      if (!en.isIntersecting) return;
      const id = en.target.dataset.sec;
      document.querySelectorAll('.toc-list a').forEach(a => a.classList.toggle('active', a.dataset.sec === id));
    });
  }, { rootMargin: '-25% 0px -65% 0px' });
  document.querySelectorAll('.sec').forEach(s => observer.observe(s));
}

function applyState() {
  document.querySelectorAll('[data-kind]').forEach(el => {
    const id = el.dataset.id;
    switch (el.dataset.kind) {
      case 'general': el.value = state.general || ''; break;
      case 'risks': el.value = state.risks || ''; break;
      case 'rating': el.checked = !!(state.sections[id] && state.sections[id].rating === el.value); break;
      case 'secnote': el.value = (state.sections[id] && state.sections[id].note) || ''; break;
      case 'msnote': el.value = state.milestones[id] || ''; break;
      case 'decision': el.checked = !!(state.decisions[id] && state.decisions[id].choice === el.value); break;
      case 'decnote': el.value = (state.decisions[id] && state.decisions[id].note) || ''; break;
      case 'answer': el.value = state.questions[id] || ''; break;
    }
  });
  const r = document.getElementById('respondent');
  if (r) r.value = state.meta.name || '';
  setSaveStatus();
  applyFilter();
  refresh();
}

    c.all++;
    if (o !== 'developer') c.practice++;
    if (o !== 'practice') c.developer++;
    if (decided(x.id)) c.done++; else c.open++;
  });
  return c;
}

function applyFilter() {
  const d = D();
  let shown = 0;
  arr(d.decisions).forEach(x => {
    const el = document.getElementById('dec-' + x.id);
    if (!el) return;
    const o = ownerOf(x.owner);
    const vis = filter === 'all' ? true
      : filter === 'open' ? !decided(x.id)
      : filter === 'practice' ? o !== 'developer'
      : o !== 'practice';
    el.hidden = !vis;
    if (vis) shown++;
  });
  document.querySelectorAll('.fbtn').forEach(b => {
    const on = b.dataset.filter === filter;
    b.classList.toggle('on', on);
    b.setAttribute('aria-pressed', on ? 'true' : 'false');
  });
  const em = document.getElementById('decEmpty');
  if (em) em.hidden = shown > 0;
}

function refresh() {
  const d = D(), t = T();
  const c = counts();
  arr(d.decisions).forEach(x => {
    const el = document.getElementById('dec-' + x.id);
    if (!el) return;
    const isD = decided(x.id);
    el.classList.toggle('decided', isD);
    const st = el.querySelector('[data-state]');
    if (st) { st.textContent = isD ? t.stateDone : t.stateOpen; st.className = 'chip' + (isD ? ' st-done' : ''); }
  });
  arr(d.openQuestions).forEach(q => {
    const el = document.getElementById('oq-' + q.id);
    if (el) el.classList.toggle('answered', nonEmpty(state.questions[q.id]));
  });
  document.querySelectorAll('[data-fc]').forEach(e => { e.textContent = c[e.dataset.fc]; });
  const pct = c.all ? Math.round(c.done / c.all * 100) : 0;
  document.querySelectorAll('.bar i').forEach(i => { i.style.width = pct + '%'; });
  document.querySelectorAll('.pct').forEach(e => { e.textContent = pct + ' %'; });
  const cnt = fmt(t.progressCount, { d: c.done, t: c.all });
  const fb = fmt(t.feedbackCount, { n: feedbackCount() });
  document.querySelectorAll('.prog .count').forEach(e => { e.textContent = cnt; });
  document.querySelectorAll('.prog .fb').forEach(e => { e.textContent = fb; });
  const fc = document.getElementById('finalCount');
  if (fc) fc.textContent = cnt + ' · ' + fb;
  const nav = {};
  arr(d.sections).forEach(s => { const v = state.sections[s.id]; nav['s-' + s.id] = v && (v.rating || nonEmpty(v.note)) ? '✓' : ''; });
  nav.decisions = c.all ? c.done + '/' + c.all : '';
  const qa = arr(d.openQuestions).filter(q => nonEmpty(state.questions[q.id])).length;
  nav.questions = arr(d.openQuestions).length ? qa + '/' + arr(d.openQuestions).length : '';
  document.querySelectorAll('.toc-list a').forEach(a => {
    const id = a.dataset.sec;
    const cEl = a.querySelector('.cnt');
    if (cEl) cEl.textContent = nav[id] || '';
    const done = id === 'decisions' ? (c.all > 0 && c.done === c.all)
      : id === 'questions' ? (arr(d.openQuestions).length > 0 && qa === arr(d.openQuestions).length)
      : nav[id] === '✓';
    a.classList.toggle('done', done);
  });
}

function onEdit(el) {
  const kind = el.dataset && el.dataset.kind;
  if (!kind) return;
  const id = el.dataset.id;
  switch (kind) {
    case 'general': state.general = el.value; break;
    case 'risks': state.risks = el.value; break;
    case 'rating': if (el.checked) state.sections[id] = Object.assign({}, state.sections[id], { rating: el.value }); break;
    case 'secnote': state.sections[id] = Object.assign({}, state.sections[id], { note: el.value }); break;
    case 'msnote': state.milestones[id] = el.value; break;
    case 'decision': if (el.checked) state.decisions[id] = Object.assign({}, state.decisions[id], { choice: el.value }); break;
    case 'decnote': state.decisions[id] = Object.assign({}, state.decisions[id], { note: el.value }); break;
    case 'answer': state.questions[id] = el.value; break;
    default: return;
  }
  scheduleSave();
  refresh();
}

/* Ein zweiter Klick auf eine gewählte Option hebt die Auswahl wieder auf */
let pressedChecked = null;
function onPointerDown(e) {
  const lab = e.target.closest && e.target.closest('label');
  const inp = lab && lab.querySelector('input[type=radio][data-kind]');
  pressedChecked = inp && inp.checked ? inp : null;
}
function onRadioClick(inp) {
  if (pressedChecked === inp) {
    inp.checked = false;
    const id = inp.dataset.id;
    if (inp.dataset.kind === 'decision') { const v = Object.assign({}, state.decisions[id]); delete v.choice; state.decisions[id] = v; }
    else if (inp.dataset.kind === 'rating') { const v = Object.assign({}, state.sections[id]); delete v.rating; state.sections[id] = v; }
    scheduleSave();
    refresh();
  }
  pressedChecked = null;
}

/* ------------------------------------------------------------------ */
/* Export, Import                                                      */
/* ------------------------------------------------------------------ */
function buildText() {
  const d = D(), t = T(), x = t.ex;
  const c = counts();
  const fence = '`'.repeat(3);
  let s = '# ' + x.title + '\n\n';
  s += '- ' + x.from + ': ' + ((state.meta.name || '').trim() || '–') + '\n';
  s += '- ' + x.version + ': ' + d.asOf + '\n';
  s += '- ' + x.exported + ': ' + new Date().toLocaleString(lang === 'de' ? 'de-DE' : 'en-GB', { dateStyle: 'long', timeStyle: 'short' }) + '\n';
  s += '- ' + fmt(t.progressCount, { d: c.done, t: c.all }) + ' · ' + fmt(t.feedbackCount, { n: feedbackCount() }) + '\n\n';
  if (nonEmpty(state.general)) s += '## ' + t.generalNote + '\n\n' + state.general.trim() + '\n\n';
  s += '## ' + x.sections + '\n\n';
  arr(d.sections).forEach(sc => {
    const v = state.sections[sc.id] || {};
    const L = [];
    if (v.rating && t.rate[v.rating]) L.push(x.rating + ': ' + t.rate[v.rating]);
    if (nonEmpty(v.note)) L.push(x.note + ': ' + v.note.trim());
    s += '**' + sc.title + '** (' + sc.id + ')\n\n' + (L.length ? L.join('\n') : '_' + x.none + '_') + '\n\n';
  });
  const ms = arr(d.milestones).filter(m => nonEmpty(state.milestones[m.id]));
  if (ms.length) {
    s += '## ' + t.nav.roadmap + '\n\n';
    ms.forEach(m => { s += '**' + m.id + ' · ' + m.title + '**\n\n' + state.milestones[m.id].trim() + '\n\n'; });
  }
  if (arr(d.decisions).length) {
    s += '## ' + t.nav.decisions + '\n\n';
    arr(d.decisions).forEach(dec => {
      const v = state.decisions[dec.id] || {};
      const opt = arr(dec.options).find(o => o.key === v.choice);
      s += '**' + dec.id + ' · ' + dec.title + '**\n\n';
      s += x.choice + ': ' + (opt ? opt.label + ' [' + opt.key + ']' + (opt.key === dec.recommended ? ' (' + x.asRecommended + ')' : '') : x.open) + '\n';
      if (nonEmpty(v.note)) s += x.note + ': ' + v.note.trim() + '\n';
      s += '\n';
    });
  }
  const qs = arr(d.openQuestions).filter(q => nonEmpty(state.questions[q.id]));
  if (qs.length) {
    s += '## ' + t.nav.questions + '\n\n';
    qs.forEach(q => { s += '**' + q.id + ' · ' + q.question + '**\n\n' + x.answer + ': ' + state.questions[q.id].trim() + '\n\n'; });
  }
  if (nonEmpty(state.risks)) s += '## ' + t.nav.risks + '\n\n' + state.risks.trim() + '\n\n';
  s += '---\n\n' + x.machine + '\n\n' + fence + 'json\n' + JSON.stringify(state) + '\n' + fence + '\n';
  return s;
}
function fileName() {
  const d = new Date();
  const z = n => String(n).padStart(2, '0');
  return FILE_PREFIX + d.getFullYear() + '-' + z(d.getMonth() + 1) + '-' + z(d.getDate()) + '.txt';
}
function download() {
  save();
  const blob = new Blob(['\ufeff' + buildText()], { type: 'text/plain;charset=utf-8' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url; a.download = fileName();
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(url), 4000);
  toast(T().toast.downloaded);
}
async function copyText() {
  const txt = buildText();
  const t = T();
  try {
    await navigator.clipboard.writeText(txt);
    toast(t.toast.copied);
  } catch (e) {
    const ta = document.createElement('textarea');
    ta.value = txt; ta.setAttribute('readonly', ''); ta.style.position = 'fixed'; ta.style.opacity = '0';
    document.body.appendChild(ta); ta.select();
    let ok = false;
    try { ok = document.execCommand('copy'); } catch (err) { ok = false; }
    ta.remove();
    toast(ok ? t.toast.copied : t.toast.copyFail);
  }
}
function parseImport(text) {
  const clean = text.replace(/^\ufeff/, '').trim();
  try { return JSON.parse(clean); } catch (e) { /* weiter */ }
  const blocks = clean.match(/```json\s*([\s\S]*?)```/g);
  if (!blocks) return null;
  const last = blocks[blocks.length - 1].replace(/^```json\s*/, '').replace(/```$/, '');
  try { return JSON.parse(last); } catch (e) { return null; }
}
async function importFile(input) {
  const f = input.files && input.files[0];
  input.value = '';
  if (!f) return;
  const t = T();
  let obj = null;
  try { obj = parseImport(await f.text()); } catch (err) { obj = null; }
  if (!obj || typeof obj !== 'object' || (typeof obj.decisions !== 'object' && typeof obj.sections !== 'object')) { toast(t.toast.badFile); return; }
  if (hasAnyInput() && !confirm(t.confirmReplace)) return;
  const keepLang = lang;
  state = normalize(obj);
  state.meta.lang = keepLang;
  save();
  applyState();
  toast(t.toast.loaded);
}
function resetAll() {
  const t = T();
  if (!confirm(t.confirmReset)) return;
  state = fresh();
  state.meta.lang = lang;
  try { localStorage.removeItem(STORE_KEY); } catch (e) { /* ignorieren */ }
  applyState();
  window.scrollTo(0, 0);
  toast(t.toast.reset);
}
let toastTimer = null;
function toast(msg) {
  const el = document.getElementById('toast');
  el.textContent = msg; el.classList.add('show');
  clearTimeout(toastTimer); toastTimer = setTimeout(() => el.classList.remove('show'), 3800);
}

function setLang(l) {
  if (l === lang || !UI[l]) return;
  lang = l;
  state.meta.lang = l;
  scheduleSave();
  renderAll();
  applyState();
}

/* ------------------------------------------------------------------ */
/* Start                                                               */
/* ------------------------------------------------------------------ */
function init() {
  load();
  lang = pickLang();
  renderAll();
  applyState();
  document.addEventListener('input', e => {
    const el = e.target;
    if (el.id === 'respondent') { state.meta.name = el.value; scheduleSave(); return; }
    if (el.matches && el.matches('textarea[data-kind]')) onEdit(el);
  });
  document.addEventListener('change', e => {
    const el = e.target;
    if (el.dataset && el.dataset.ui === 'lang') { if (el.checked) setLang(el.value); return; }
    if (el.id === 'importFile') { importFile(el); return; }
    if (el.matches && el.matches('input[type=radio][data-kind]')) onEdit(el);
  });
  document.addEventListener('pointerdown', onPointerDown);
  document.addEventListener('click', e => {
    const el = e.target;
    if (el instanceof HTMLInputElement && el.type === 'radio' && el.dataset.kind) { onRadioClick(el); return; }
    const fb = el.closest && el.closest('.fbtn');
    if (fb) { filter = fb.dataset.filter; applyFilter(); return; }
    const act = el.closest && el.closest('[data-action]');
    if (act) {
      const a = act.dataset.action;
      if (a === 'download') download();
      else if (a === 'copy') copyText();
      else if (a === 'print') window.print();
      else if (a === 'reset') resetAll();
      return;
    }
    const mnav = document.querySelector('.mnav');
    if (mnav && mnav.open) {
      if (el.closest && el.closest('.mnav a')) mnav.removeAttribute('open');
      else if (!mnav.contains(el)) mnav.removeAttribute('open');
    }
  });
  window.addEventListener('beforeunload', e => {
    if (!storageOK && hasAnyInput()) { e.preventDefault(); e.returnValue = ''; }
  });
}
init();
})();
</script>
