Liste","pros":"Wie gewohnt.","cons":"Verzögert die Vorbelegung."}],"recommended":"a","why":"Eindeutig, und die gewohnten Nummern finden den Eintrag weiterhin; Umbenennen ist in einer Testsitzung möglich.","blocks":"M2, M5"},{"id":"D-23","title":"Aufbau der Fälligkeitsliste","question":"Ihre gewählten Spalten sind Name, Vorname, Geburtsdatum, Abteilung/Station, Pflicht/Angebot, Status (ohne Anlass und ohne Datum). Eine Zeile je Proband oder je Anlass, und welche Statuswerte?","owner":"both","context":"Die Liste geht an die Personalabteilung; eine Anlass-Spalte könnte heikle Anlässe offenlegen.","options":[{"key":"a","label":"Eine Zeile je Proband und Beschäftigung, auf den frühesten Monat gebündelt; „Pflicht“, „Angebot“ oder „Pflicht + Angebot“; Status überfällig / fällig / bald fällig","pros":"Entspricht Ihrer Wahl; kurze Listen.","cons":"Die Personalabteilung sieht nicht, welcher Anlass fällig ist."},{"key":"b","label":"Eine Zeile je Anlass","pros":"Detaillierter.","cons":"Ohne Anlass-Spalte sehen die Zeilen gleich aus."},{"key":"c","label":"Wie a, Anlass und Fälligkeitsdatum je Kunde zuschaltbar","pros":"Für Kunden, die mehr wissen wollen.","cons":"Mehr Aufwand; kann heikle Anlässe offenlegen."}],"recommended":"a","why":"Setzt Ihre Spaltenwahl mit der geringsten Offenlegung um.","blocks":"M2 Fälligkeitsliste"},{"id":"D-24","title":"Abgleich bei Listen ohne Geburtsdatum und Personalnummer","question":"Wie werden Listenzeilen vorhandenen Probanden zugeordnet, wenn die üblichen Listen nur Name, Station und Tätigkeit enthalten, Sie aber über Personalnummer sowie Name und Geburtsdatum abgleichen möchten?","owner":"both","context":"Ihre Kunden nehmen keine Vorlage an. Eine falsche Zuordnung überträgt Daten auf die falsche Person und kann zusammen mit dem automatischen „ausgeschieden“ die Beschäftigung der falschen Person beenden.","options":[{"key":"a","label":"Abgleich in Stufen (Personalnummer und Kunde; Name und Geburtsdatum; Name, Kunde und Station nur als „unsicher“ mit Bestätigung) und Bitte an größere Kunden um eine Spalte Geburtsdatum","pros":"Sicher mit den heutigen Listen; wird besser, je mehr Kunden mitmachen.","cons":"Die Verwaltung bestätigt bei jedem Import unsichere Zeilen."},{"key":"b","label":"Kunden müssen Geburtsdatum oder Personalnummer liefern","pros":"Zuverlässig.","cons":"Hängt von den Kunden ab."},{"key":"c","label":"Automatische Zuordnung nach Name, Kunde und Station","pros":"Keine Mehrarbeit.","cons":"Namensgleiche in großen Kliniken; Fristen und Ausscheiden treffen die falsche Person."}],"recommended":"a","why":"Heute sicher und mit der Zeit bequemer; Sammelbestätigung nur bei eindeutigen Namen.","blocks":"M3"},{"id":"D-25","title":"Schutz beim automatischen „ausgeschieden“","question":"Wie wird verhindert, dass das automatische „ausgeschieden“ bei unvollständigen Listen oder unsicherer Zuordnung die Falschen trifft?","owner":"practice","context":"Listen kommen mal vollständig, mal nur als Änderungen, und die Meldungen der Personalabteilungen sind bisher nicht zuverlässig.","options":[{"key":"a","label":"Automatisch nur bei Listen, die als Gesamtliste für einen bestimmten Bereich gekennzeichnet sind; mit Bericht und 30 Tage rückgängig machbar; Warnung, wenn unter 80 % sicher erkannt; beim ersten Import eines Kunden ausgeschaltet","pros":"Wie gewünscht automatisch; Teillisten lösen nichts aus; umkehrbar.","cons":"Verlässt sich auf die Kennzeichnung als Gesamtliste."},{"key":"b","label":"Nur vorschlagen, Sie bestätigen","pros":"Keine falschen Austritte.","cons":"Nicht automatisch; mehr Klicks."},{"key":"c","label":"Automatisch nur ab 80 % sicherer Erkennung","pros":"Schützt sich selbst.","cons":"Willkürliche Grenze; schwer zu erklären."}],"recommended":"a","why":"Behält die gewünschte Automatik, begrenzt durch Bereich, Warnung und Rückgängig.","blocks":"M3, erster Import je Kunde"},{"id":"D-26","title":"Woher die Anfangsfristen kommen","question":"Die nächsten Termine stehen auf den Karteikarten und zusätzlich in Excel-/Numbers-Listen. Welche Quelle ist vollständig genug für die Übernahme?","owner":"practice","context":"Wer ohne bekannten Termin übernommen wird, gilt als „jetzt fällig“; eine lückenhafte Quelle überschwemmt also die ersten Fälligkeitslisten. Das Nachtragen kostet etwa 30 Sekunden je Karteikarte.","options":[{"key":"a","label":"Nur die Excel-Listen","pros":"Kein Nachtragen.","cons":"Probanden ohne Zeile erscheinen als „jetzt fällig“; die ersten Listen sind überfüllt."},{"key":"b","label":"Excel-Listen, vor der Umstellung je Kunde aus den Karteikarten ergänzt","pros":"Richtige Listen vom ersten Tag an.","cons":"Insgesamt 60–200 Stunden Verwaltungszeit über die Einführung verteilt."},{"key":"c","label":"Karteikarten erst nachtragen, wenn der Proband wiederkommt","pros":"Kein Aufwand vorab.","cons":"Listen bis zu drei Jahre ungenau."}],"recommended":"b","why":"b für Kunden mit lückenhafter Excel-Liste, a dort, wo Sie die Liste als vollständig bestätigen.","blocks":"M3, Aufwand je Kunde"},{"id":"D-27","title":"Aufbewahrung importierter Personen ohne Vorsorge","question":"Wie lange werden Stammdaten von Personen aus Personallisten aufbewahrt, die nie bei Ihnen zur Vorsorge waren?","owner":"practice","context":"Es gibt keine Aufbewahrungspflicht, wohl aber das Gebot der Datensparsamkeit (Art. 5 DSGVO). Bitte mit Ihrem Datenschutzbeauftragten abstimmen.","options":[{"key":"a","label":"Löschvorschlag 12 Monate nach „ausgeschieden“, wenn keine Vorsorge, kein Dokument und keine Bescheinigung existiert; Bestätigung durch die Inhaber","pros":"Datensparsam über die vorhandenen Löschvorschläge.","cons":"Wer zurückkommt, wird neu importiert."},{"key":"b","label":"Solange der Vertrag mit dem Kunden läuft","pros":"Keine Neuimporte.","cons":"Tausende Datensätze von Personen, die Sie nie gesehen haben."},{"key":"c","label":"Sofort bei „ausgeschieden“ löschen","pros":"Minimal.","cons":"Ein Importfehler löscht Daten, bevor es jemand merkt."}],"recommended":"a","why":"Datensparsam und mit einem Jahr Zeit, Importfehler zu bemerken.","blocks":"M3, Löschvorschläge"},{"id":"D-28","title":"Einladungen und Erinnerungen: Weg und Absender","question":"Auf welchem Weg und von welchem Absender gehen Einladungen und Erinnerungen hinaus, da die Praxis keine eigene Domain hat und die Listen kaum E-Mail-Adressen enthalten?","owner":"both","context":"Der E-Mail-Anbieter ist Auftragsverarbeiter, und keine Nachricht darf einen Anlass nennen. Systemnachrichten (Status, Notfallzugang, Zurücksetzen des zweiten Faktors) werden ab dem ersten Echtbetrieb gebraucht. mailbox.org Business kostet zusätzlich mindestens 25 EUR netto im Monat und sprengt damit das Budget.","options":[{"key":"a","label":"Briefe und Hauspost ab Januar 2028; E-Mail ab Herbst 2028 von einer neuen .de-Praxisdomain mit Postfach bei netcup (2,69 EUR brutto im Monat); SMS später, falls nötig","pros":"Zuverlässig, günstig, eigener Absender mit korrekter Absenderkennung.","cons":"Domain einrichten; E-Mail-Adressen müssen gesammelt werden; Vertragsumfang bei Bestellung prüfen."},{"key":"b","label":"Ein vorhandenes Postfach bei Google, IONOS oder Proton","pros":"Kein neues Konto.","cons":"Versandgrenzen; teils US-Anbieter oder kein passender Vertrag."},{"key":"c","label":"E-Mail und SMS","pros":"Erreicht auch Personen ohne E-Mail.","cons":"Kosten je Nachricht; Handynummern selten in den Listen."}],"recommended":"a","why":"Günstigster rechtssicherer Weg; mailbox.org nur, falls Sie dort schon ein Business-Konto haben.","blocks":"Domain bis 30.06.2027, M5 Briefe, M9 E-Mail"},{"id":"D-29","title":"Einführung mit einem Pilotkunden","question":"Wie wird die erste Version eingeführt (Ihre Antwort war „weiß nicht“)?","owner":"practice","context":"Übernahmeaufwand und Risiko hängen davon ab, ob zuerst ein Kunde allein umstellt; das Team besteht aus zwei Personen.","options":[{"key":"a","label":"Ein Pilotkunde, danach die übrigen in Wellen; je Kunde läuft Papier eine Zeit lang mit","pros":"Begrenzt Fehler auf einen Kunden; echte Rückmeldung; Aufwand verteilt.","cons":"Während des Pilots zwei Arbeitsweisen."},{"key":"b","label":"Alle Kunden auf einmal","pros":"Eine Umstellung.","cons":"Alle Risiken gleichzeitig; große Übernahme vorab."},{"key":"c","label":"Alle Kunden parallel auf Papier und im System, dann umschalten","pros":"Sicher.","cons":"Doppelte Arbeit für zwei Personen."}],"recommended":"a","why":"Pilot möglichst eine mittelgroße Klinik, die Excel-Listen schickt, 200–800 Probanden hat, ihre Kartei selbst führt und im November 2027 einen Sprechtag hat.","blocks":"M4"},{"id":"D-30","title":"Umfang des ersten Echtbetriebs","question":"Was muss fertig sein, bevor die echten Daten des ersten Kunden ins System kommen?","owner":"both","context":"Davon hängen der Starttermin und die Fristen für Ihre Verträge und Datenschutzunterlagen ab. Termine bei 20 Entwicklungsstunden pro Woche.","options":[{"key":"a","label":"Kartei, Fristen, Import, Fälligkeitslisten und Nachtrag (erster Import ab 04.10.2027, erster Sprechtag des Pilotkunden im System im November 2027)","pros":"Frühste Entlastung bei den Fristen; Erfahrung mit den Listen zuerst bei einem Kunden.","cons":"Bescheinigungen und Teilnehmerlisten bis Januar 2028 weiter in Word und Excel."},{"key":"b","label":"Erst mit Sprechtag und Bescheinigungen (erster Import etwa Januar 2028)","pros":"Ein Start mit allen Bürofunktionen.","cons":"Etwa drei Monate später."},{"key":"c","label":"Zusätzlich mit Befunddokumentation am Bildschirm (erster Import etwa März 2028)","pros":"Wie ursprünglich beschrieben.","cons":"Etwa fünf Monate später; Befunde nur dort nutzbar, wo das Netz hält."}],"recommended":"a","why":"Schnellster Weg zum täglichen Nutzen, und der heikelste Datenschritt geschieht mit einem Kunden, bevor Bescheinigungen davon abhängen.","blocks":"M4, Termine der Verträge"},{"id":"D-31","title":"Parallelbetrieb je Kunde","question":"Wie lange werden die Karteikarten je Kunde neben dem System weitergeführt?","owner":"practice","context":"Papier sichert gegen Fehler in Berechnung oder Übernahme ab, kostet aber doppelte Arbeit.","options":[{"key":"a","label":"Bis zwei aufeinanderfolgende Sprechtage des Kunden ohne ungeklärte Abweichung im System liefen; höchstens sechs Monate, dann entscheiden Sie","pros":"Endet, wenn die Daten stimmen.","cons":"Bei seltenen Sprechtagen bleibt Papier monatelang."},{"key":"b","label":"Fest drei Monate nach der Umstellung","pros":"Einfach.","cons":"Sagt nichts über die Richtigkeit."},{"key":"c","label":"Kein Parallelbetrieb","pros":"Keine Doppelarbeit.","cons":"Kein Sicherheitsnetz."}],"recommended":"a","why":"Das Papier endet, wenn nachgewiesen ist, dass das System stimmt, mit Obergrenze.","blocks":"M4 Umstellung"},{"id":"D-32","title":"Wie oft neue Versionen kommen","question":"Wie oft werden Änderungen nach dem ersten Echtbetrieb eingespielt?","owner":"both","context":"Sie testen alle zwei Wochen 30 Minuten auf dem Testsystem; neue Versionen sollen nie an Sprechtagen kommen.","options":[{"key":"a","label":"Alle zwei Wochen nach Ihrem Test, abends außerhalb von Sprechtagen, dringende Korrekturen auch dazwischen","pros":"Kleine geprüfte Schritte; Ihre Rückmeldung ist nach zwei Wochen umgesetzt.","cons":"Zweimal im Monat Versionshinweise lesen."},{"key":"b","label":"Einmal je Meilenstein","pros":"Weniger Änderungen.","cons":"Große Sprünge; langsame Umsetzung."},{"key":"c","label":"Jede fertige Änderung sofort","pros":"Am schnellsten.","cons":"Nicht von Ihnen getestet; riskant an Sprechtagen."}],"recommended":"a","why":"Passt zu Ihrem Testrhythmus und hält jede Änderung klein.","blocks":"Ab dem ersten Echtbetrieb"},{"id":"D-33","title":"Zweiter Faktor bei der Anmeldung","question":"Welcher zweite Faktor wird bei jeder Anmeldung verwendet, und wie kommt man bei Verlust wieder hinein?","owner":"both","context":"Die Software unterstützt beides: einen sechsstelligen Code aus einer Authenticator-App auf dem Handy und einen Sicherheitsschlüssel (kleiner USB- oder NFC-Stick, FIDO2). Die Entscheidung legt fest, was eingerichtet und was gekauft wird.","options":[{"key":"a","label":"Authenticator-App für alle","pros":"Kostenlos, auf jedem Gerät nutzbar.","cons":"Nicht gegen gefälschte Anmeldeseiten geschützt; bei jeder Anmeldung einen Code eintippen."},{"key":"b","label":"Sicherheitsschlüssel, App als Reserve","pros":"Schutz gegen gefälschte Anmeldeseiten, schnellste Anmeldung, unabhängig von privaten Apple- oder Google-Konten.","cons":"Zwei Schlüssel je Person kaufen; das iPad braucht einen passenden Schlüssel."},{"key":"c","label":"Passkeys über Apple- oder Google-Konto","pros":"Keine Hardware.","cons":"Wiederherstellung hängt an privaten Konten außerhalb der Praxis."}],"recommended":"a","why":"App für alle vor den ersten echten Daten, dazu Sicherheitsschlüssel (b) für die Inhaber vor dem Echtbetrieb; zehn ausgedruckte Notfallcodes, Zurücksetzen durch die Inhaber mit Rückruf; keine SMS.","blocks":"Vor den ersten echten Daten, M4"},{"id":"D-34","title":"Verschlüsselung auf dem Server und Schweigepflicht des Anbieters","question":"Wie werden Datenbank und Dokumente auf dem gemieteten Server verschlüsselt, wenn der Standardvertrag des Anbieters § 203 StGB möglicherweise nicht abdeckt?","owner":"both","context":"Mitarbeitende des Anbieters gelten als „sonstige mitwirkende Personen“; sind sie nicht zur Verschwiegenheit verpflichtet, haftet die Ärztin oder der Arzt (§ 203 Abs. 4 StGB). Ob der Vertrag von netcup oder Hetzner das abdeckt, ist ungeprüft. Bitte mit Ihrem Datenschutzbeauftragten abstimmen.","options":[{"key":"a","label":"Nur Schutz durch den Anbieter, dazu verschlüsselte Dokumente","pros":"Nach einem Neustart läuft alles von selbst wieder.","cons":"Datenbankdateien unverschlüsselt beim Anbieter; Schweigepflicht hängt allein am Vertrag."},{"key":"b","label":"Verschlüsselter Bereich für Datenbank und Dokumente, nach jedem Neustart von Hand entsperrt, dazu verschlüsselte Dokumente","pros":"Der Anbieter sieht nur verschlüsselte Daten.","cons":"Nach einem ungeplanten Neustart bleibt das System gesperrt, bis entsperrt wird, meist innerhalb eines Werktags; Papier und Offline-Pakete überbrücken."},{"key":"c","label":"Verschlüsselung jedes einzelnen Befundfelds","pros":"Befunde auch in Sicherungen geschützt.","cons":"Viel mehr Aufwand, keine Suche in Befunden, Schlüssel auf demselben Server."}],"recommended":"b","why":"Dazu eine schriftliche Anfrage an den Anbieter zu § 203; a nur, wenn Ihnen Verfügbarkeit wichtiger ist und Ihr Datenschutzbeauftragter zustimmt.","blocks":"Vor den ersten echten Daten"},{"id":"D-35","title":"Vertragspartner und technischer Zugang","question":"Wer schließt die Verträge für Server und Sicherung, und hat die Entwicklung dauerhaften oder nur fallweisen Zugang zum Echtsystem?","owner":"both","context":"Sie wünschen keine Abhängigkeit von einem Anbieter und Hilfe innerhalb von 1–2 Tagen, und es gibt keinen IT-Dienstleister in der Praxis.","options":[{"key":"a","label":"Die Praxis hält alle Verträge; die Entwicklung hat dauerhaften Zugang mit persönlichem Hardwareschlüssel, jede Sitzung wird protokolliert und vierteljährlich geprüft","pros":"Keine Abhängigkeit; Hilfe innerhalb von 1–2 Tagen.","cons":"Dauerhafter Zugang stützt sich auf die Verschwiegenheitsverpflichtung und das Protokoll."},{"key":"b","label":"Die Praxis hält die Verträge und schaltet den Zugang je Wartung frei","pros":"Geringste Rechte.","cons":"Die Inhaber müssen eine Anbieter-Oberfläche bedienen; langsame Hilfe im Notfall."},{"key":"c","label":"Die Entwicklung hält die Verträge und stellt den Betrieb als Dienstleistung","pros":"Einfachste Abrechnung.","cons":"Abhängigkeit; widerspricht Ihrem Wunsch nach Unabhängigkeit."}],"recommended":"a","why":"Die Praxis bleibt Eigentümerin, die Hilfe bleibt schnell; bei Teamwachstum oder Betreiberwechsel wird b erneut geprüft.","blocks":"Vor den ersten echten Daten"},{"id":"D-36","title":"Notfallzugang der Vertretung","question":"Wie wird der Zugang der Vertretungsärztin oder des Vertretungsarztes freigeschaltet, auch wenn kein Inhaber handeln kann?","owner":"practice","context":"Ursprünglich sollte der technische Betrieb auf schriftliche Anforderung freischalten. Plan und Sicherheitskonzept sehen stattdessen die Freischaltung durch die Inhaber plus einen versiegelten Umschlag vor.","options":[{"key":"a","label":"Vorbereitetes, gesperrtes Konto mit eigenem zweiten Faktor; die Inhaber schalten es für einen Zeitraum frei (standardmäßig 14 Tage)","pros":"Einfach, vollständig protokolliert.","cons":"Funktioniert nicht, wenn kein Inhaber handeln kann."},{"key":"b","label":"Wie a, zusätzlich ein versiegelter Notfallumschlag mit Einmalcode; seine Nutzung benachrichtigt alle Inhaber und den Betrieb","pros":"Funktioniert auch, wenn kein Inhaber erreichbar ist.","cons":"Der Umschlag muss verwaltet werden."},{"key":"c","label":"Der technische Betrieb schaltet auf schriftliche Anforderung frei","pros":"Kein Umschlag.","cons":"Eine ärztliche Zugangsentscheidung läge bei der Technik."}],"recommended":"b","why":"Deckt genau den Fall ab, für den die Vertretung gedacht ist; Sie benennen Vertretung und Umschlaghalter schriftlich.","blocks":"Vor dem Echtbetrieb"},{"id":"D-37","title":"Eigene Sicherungskopie der Praxis","question":"Wohin geht Ihre eigene Sicherungskopie (Sie schrieben „am liebsten cloud und owncloud“)?","owner":"both","context":"Die Software erzeugt wöchentlich ein verschlüsseltes Archiv mit allen Daten in offenen Formaten, Dokumenten, Anleitungen und Quellcode, das sich ohne Fachkenntnisse mit 7-Zip oder Keka öffnen lässt. Was mit „owncloud“ gemeint ist, ist noch offen (Frage Q-14).","options":[{"key":"a","label":"Wöchentlicher Download durch die Inhaber auf zwei abwechselnd genutzte verschlüsselte USB-Festplatten, eine außerhalb der Praxis; nach 10 Tagen ohne Download erscheint ein roter Hinweis","pros":"Kein weiterer Dienst; ohne die Entwicklung wiederherstellbar.","cons":"Braucht Disziplin."},{"key":"b","label":"Automatisch in eine eigene ownCloud/Nextcloud","pros":"Automatisch; entspricht Ihrem Wunsch.","cons":"Nur wenn eine solche Cloud in Deutschland mit Vertrag existiert; ein weiteres Kennwort auf dem Server."},{"key":"c","label":"Ein Netzwerkspeicher in der Praxis holt nachts ab","pros":"Automatisch, mit Versionen.","cons":"Gerät, Netzwerk und Updates ohne IT-Dienstleister."}],"recommended":"a","why":"a zum Start; b zusätzlich, wenn Sie eine ownCloud/Nextcloud in Deutschland bestätigen; c später, falls der Wochenrhythmus nicht klappt.","blocks":"Vor dem Echtbetrieb"},{"id":"D-38","title":"Aufbewahrung des Zugriffsprotokolls","question":"Wie lange werden Einsichten, Exporte und Anmeldungen protokolliert?","owner":"both","context":"Das Protokoll beantwortet „wer hat meine Akte gesehen“, enthält aber auch Daten über Ihre Mitarbeitenden. Bitte mit Ihrem Datenschutzbeauftragten abstimmen.","options":[{"key":"a","label":"Zugriffe 3 Jahre; Änderungsverlauf medizinischer Akten so lange wie die Akte","pros":"Deckt die regelmäßige Verjährung (§ 195 BGB); begrenzter Umfang.","cons":"Ältere Zugriffe nicht mehr nachvollziehbar."},{"key":"b","label":"So lange wie die Akte","pros":"Vollständig.","cons":"Sehr lange Speicherung von Mitarbeiterdaten."},{"key":"c","label":"1 Jahr","pros":"Minimal.","cons":"Zu kurz für späte Beschwerden."}],"recommended":"a","why":"Entspricht der Verjährungsfrist, bestätigt durch Ihren Datenschutzbeauftragten.","blocks":"Vor dem Echtbetrieb"},{"id":"D-39","title":"Datenschutz-Folgenabschätzung","question":"Führt die Praxis eine vollständige Datenschutz-Folgenabschätzung durch oder dokumentiert sie, dass keine nötig ist?","owner":"both","context":"Art. 35 DSGVO verlangt die Folgenabschätzung vor Beginn der Verarbeitung und die Beratung durch den Datenschutzbeauftragten; hier geht es um Gesundheitsdaten von 5.000–15.000 Probanden mit Laptops vor Ort. Systembeschreibung und Risikotabelle liefert die Entwicklung.","options":[{"key":"a","label":"Vollständige Folgenabschätzung durch Praxis und Datenschutzbeauftragten, einschließlich Diktat","pros":"Rechtssicher; das meiste Material liegt schon vor.","cons":"Zeit und Kosten des Datenschutzbeauftragten."},{"key":"b","label":"Dokumentierte Vorprüfung mit dem Ergebnis „nicht erforderlich“","pros":"Geringster Aufwand.","cons":"Bei diesem Umfang schwach begründbar; ein Versäumnis ist selbst ein Verstoß."}],"recommended":"a","why":"Bei diesem Umfang erforderlich und überwiegend aus vorhandenem Material zu erstellen; vor den ersten echten Daten.","blocks":"Vor den ersten echten Daten"},{"id":"D-40","title":"Versand von Listen an Kunden","question":"Wie werden Fälligkeitslisten, Teilnehmerlisten und Kartei-Exporte per E-Mail an die Personalabteilungen geschickt?","owner":"practice","context":"Die Fälligkeitsliste enthält Geburtsdaten; eine vertippte Adresse bei 16–40 Kunden legt eine ganze Liste offen. Bitte mit Ihrem Datenschutzbeauftragten abstimmen.","options":[{"key":"a","label":"Normaler E-Mail-Anhang mit verschlüsselter Übertragung","pros":"Kein Aufwand für die Personalabteilung.","cons":"Im Postfach unverschlüsselt; kein Schutz bei falscher Adresse."},{"key":"b","label":"Verschlüsselter Anhang: PDF mit Kennwort, Excel in einem verschlüsselten ZIP; Kennwort einmal je Kunde telefonisch vereinbart","pros":"Geschützt im Postfach und bei falscher Adresse.","cons":"Kennwörter verwalten; die Personalabteilung braucht ggf. 7-Zip für das ZIP."},{"key":"c","label":"Ablaufender Download-Link aus der Software","pros":"Nichts im Postfach.","cons":"Ein externer Zugang, ähnlich dem späteren Kundenportal."}],"recommended":"b","why":"b für alles mit Geburtsdaten oder Anlässen; a nur für Kunden, die Verschlüsselung schriftlich ablehnen, mit Zustimmung des Datenschutzbeauftragten; c später mit dem Portal.","blocks":"Vor dem Echtbetrieb"},{"id":"D-41","title":"Rechte am Quellcode","question":"Wem gehört der Quellcode, und welche Rechte erhält die Praxis, damit auch jemand anderes die Software weiterführen kann?","owner":"both","context":"Sie wünschen keine Abhängigkeit. Ein Vertrag mit der Entwicklung wird vor den ersten echten Daten ohnehin geschlossen.","options":[{"key":"a","label":"Urheberrecht bei der Entwicklung; die Praxis erhält schriftlich ein dauerhaftes, unwiderrufliches, kostenloses Recht, die Software zu nutzen, zu ändern und ändern zu lassen, dazu den Quellcode in jedem Wochenarchiv","pros":"Unabhängigkeit vertraglich und praktisch gesichert; wenig Aufwand.","cons":"Die Praxis verwaltet das Code-Verzeichnis nicht selbst."},{"key":"b","label":"Code-Verzeichnis und Urheberrecht bei der Praxis","pros":"Größte Kontrolle.","cons":"Ein eigenes GitHub-Konto mit zweitem Faktor zu pflegen; Übertragungsvertrag trotzdem nötig."},{"key":"c","label":"Veröffentlichung als freie Software","pros":"Gar keine Abhängigkeit.","cons":"Macht Ihre Abläufe öffentlich; nicht für andere Praxen gedacht."}],"recommended":"a","why":"Sichert den Wechsel mit wenig Aufwand ab und passt in den ohnehin nötigen Vertrag.","blocks":"Vor dem Echtbetrieb"},{"id":"D-42","title":"Arbeitgeberausfertigung: wann und wie","question":"Heute gehen Bescheinigungen nur auf Nachfrage an den Arbeitgeber. Soll die Software die Arbeitgeberausfertigung nach jeder Vorsorge erstellen, und wie wird sie zugestellt?","owner":"practice","context":"Nach § 6 Abs. 3 Nr. 3 ArbMedVV stellt die Ärztin oder der Arzt der beschäftigten Person und dem Arbeitgeber eine Vorsorgebescheinigung darüber aus, dass, wann und aus welchem Anlass eine Vorsorge stattgefunden hat und wann eine weitere angezeigt ist (geprüft am 07.11.2026).","options":[{"key":"a","label":"Beide Ausfertigungen bei jeder Freigabe; Übergabe vor Ort, wo ein Drucker steht; monatlicher Sammelversand je Kunde für alle noch nicht zugestellten Arbeitgeberausfertigungen; jeder Versand wird festgehalten","pros":"Erfüllt die Pflicht; entspricht Ihren Antworten zur Zustellung; die Kartei des Kunden bleibt vollständig.","cons":"Mehr Papier und Porto."},{"key":"b","label":"Beide erstellen, Arbeitgeberausfertigung nur auf Nachfrage versenden","pros":"Nah am heutigen Ablauf.","cons":"Rechtlich schwächer; unvollständige Kartei beim Arbeitgeber."},{"key":"c","label":"Wie heute nur auf Nachfrage","pros":"Keine Änderung.","cons":"Erfüllt § 6 Abs. 3 Nr. 3 ArbMedVV nicht."}],"recommended":"a","why":"Die einzige Option, die die Pflicht erfüllt; monatlicher Sammelversand als Voreinstellung je Kunde.","blocks":"M5"},{"id":"D-43","title":"Bescheinigung bei mehreren Arbeitgebern","question":"Wenn eine Vorsorge Anlässe von zwei Arbeitgebern abdeckt, was steht auf der jeweiligen Arbeitgeberausfertigung?","owner":"practice","context":"Kein Arbeitgeber darf von der anderen Beschäftigung und deren Gefährdungen erfahren; die Bündelung möchte trotzdem eine Vorsorge.","options":[{"key":"a","label":"Eine Vorsorge, je Kunde eine Ausfertigung nur mit dessen Anlässen","pros":"Nichts wird offengelegt; jede Kartei stimmt; Bündelung bleibt.","cons":"Zwei Arbeitgeberdokumente für einen Termin."},{"key":"b","label":"Eine Bescheinigung mit allen Anlässen","pros":"Einfach.","cons":"Legt die andere Beschäftigung offen."},{"key":"c","label":"Getrennte Vorsorgen je Arbeitgeber","pros":"Klar getrennt.","cons":"Doppelte Dokumentation."}],"recommended":"a","why":"Ein Termin, korrekte Kartei für jeden Arbeitgeber, keine Offenlegung.","blocks":"M5"},{"id":"D-44","title":"Bescheinigung bei ausstehendem Labor","question":"Wird die Bescheinigung bei ausstehenden Laborwerten beim Termin ausgestellt oder erst nach Bewertung des Labors?","owner":"practice","context":"Heute bleibt das Datumsfeld offen, wenn noch Zusatzbefunde eingehen.","options":[{"key":"a","label":"Beide Bescheinigungen erst, wenn die Vorsorge abgeschlossen ist; eine Wiedervorlage erinnert; Sie können im Einzelfall sofort ausstellen","pros":"Wie heute; eine richtige Bescheinigung.","cons":"Die beschäftigte Person geht ohne Bescheinigung."},{"key":"b","label":"Sofort mit Höchstfrist, bei Bedarf neu ausstellen","pros":"Sofort.","cons":"Zwei Fassungen im Umlauf; Korrektur beim Arbeitgeber."},{"key":"c","label":"Entscheidung im Einzelfall","pros":"Flexibel.","cons":"Bei jeder solchen Vorsorge eine Entscheidung mehr."}],"recommended":"a","why":"Nur eine richtige Bescheinigung im Umlauf, wie Sie es heute handhaben.","blocks":"M5"},{"id":"D-45","title":"Unterschrift auf Bescheinigungen","question":"Wird die eingescannte Unterschrift für alle Bescheinigungen verwendet?","owner":"practice","context":"Die AMR 6.3 verlangt eine Unterschrift, ohne die Form festzulegen; eine unverbindliche Auskunft aus NRW (KomNet) spricht für eigenhändig; ob eine eingescannte Unterschrift anerkannt wird, ist ungeprüft. Die Software kann je Dokumentart eingescannt, eigenhändig oder ohne, die Antwort ist also eine Einstellung.","options":[{"key":"a","label":"Überall eingescannt","pros":"Am schnellsten; Sammelversand ohne Unterschreiben.","cons":"Anerkennung ungeprüft; riskant, wo Dritte die Echtheit prüfen."},{"key":"b","label":"Standardmäßig eingescannt; eigenhändig beim Masern-Zeugnis und der Strahlenschutz-Bescheinigung; schriftliche Anfrage bei der Arbeitsschutzbehörde oder Ärztekammer zur Vorsorgebescheinigung","pros":"Schnell im Regelfall; sicher, wo Echtheit am wichtigsten ist.","cons":"Zwei Druckwege; eine Anfrage durch die Praxis."},{"key":"c","label":"Alle gedruckten Bescheinigungen eigenhändig","pros":"Rechtlich am sichersten.","cons":"Langsam; jedes Blatt im Sammelversand von Hand."},{"key":"d","label":"Qualifizierte elektronische Signatur (eHBA)","pros":"Stark bei elektronischem Versand.","cons":"Keine TI und kein eHBA vorhanden; nicht in Version 1."}],"recommended":"b","why":"Tempo, wo es unbedenklich ist, eigenhändig, wo Echtheit geprüft wird, und eine schriftliche Klärung für den Rest.","blocks":"M5, M9"},{"id":"D-46","title":"Einwilligungsformular für die Eignungsbeurteilung","question":"Die Einwilligung zur Weitergabe der Eignungsbeurteilung an den Arbeitgeber wird auf Papier unterschrieben und eingescannt. Druckt die Software das Formular, oder verwenden Sie Ihr eigenes?","owner":"practice","context":"Ohne Einwilligung bleibt die Arbeitgeberausfertigung gesperrt; der Scan muss der richtigen Einwilligung zugeordnet werden.","options":[{"key":"a","label":"Die Software druckt ein vorausgefülltes Formular (Proband, Kunde, Anlass, Umfang, Datum, Widerrufshinweis) mit QR-Code","pros":"Einheitlicher Text; zuverlässige Prüfung; schnell vor Ort.","cons":"Eine Vorlage mehr; Text von Ihrem Datenschutzbeauftragten zu prüfen."},{"key":"b","label":"Ihr eigenes Formular, der Scan wird von Hand zugeordnet","pros":"Kein Entwicklungsaufwand.","cons":"Zuordnungsfehler; Umfang und Ablauf von Hand eintippen."}],"recommended":"a","why":"Vermeidet Zuordnungsfehler genau an der Stelle, die über die Weitergabe an den Arbeitgeber entscheidet.","blocks":"M5 Eignung"},{"id":"D-47","title":"Wer die Vorsorgekartei führt","question":"Für welche Kunden führt die Praxis die Vorsorgekartei im Auftrag des Arbeitgebers, und auf welcher vertraglichen Grundlage?","owner":"both","context":"Die Vorsorgekartei führt der Arbeitgeber; er schließt sie mit dem Ende der Beschäftigung und händigt der Person eine Kopie aus (§ 3 Abs. 4 ArbMedVV). Führt die Praxis sie, verarbeitet sie wahrscheinlich im Auftrag des Arbeitgebers mit einem Vertrag nach Art. 28 DSGVO (ungeprüft; bitte mit Ihrem Datenschutzbeauftragten klären).","options":[{"key":"a","label":"Einstellung je Kunde; standardmäßig führt der Kunde seine Kartei aus den Arbeitgeberausfertigungen und dem regelmäßigen Kartei-Export; die Praxis führt sie nur, wo ein Kunde darauf besteht, dann mit Vertrag und Ablauf beim Austritt","pros":"Rechtlich klar; wenige Verträge.","cons":"Kunden, die sich heute auf die Praxis verlassen, müssen umstellen."},{"key":"b","label":"Die Praxis führt sie für alle Kunden","pros":"Einheitlich.","cons":"Auftragsverarbeitung und Vertrag mit jedem Kunden."},{"key":"c","label":"Die Praxis führt sie nie","pros":"Einfachste Position.","cons":"Widerspricht Ihren Antworten."}],"recommended":"a","why":"Folgt der gesetzlichen Regel und hält die Zahl der Verträge klein; Ihr Datenschutzbeauftragter bestätigt die Einordnung vor dem Echtbetrieb.","blocks":"M5 Kartei-Export, Reihenfolge der Kunden"},{"id":"D-48","title":"Medizinische Briefe und Laborpost: Berührung der Verwaltung mit medizinischen Inhalten","question":"Wer druckt und kuvertiert Schreiben mit medizinischem Inhalt (Ergebnismitteilung, Labor- und Immunstatusbriefe), und wer nimmt Laborpost auf Papier entgegen, wenn die Verwaltung in der Software keine Befunde sieht, heute aber Ergebnisse in verschlossenen Umschlägen versendet?","owner":"practice","context":"Beide Ausfertigungen der Vorsorgebescheinigung haben dieselben Angaben ohne Befunde, die Verwaltung kann sie also bearbeiten; medizinische Hinweise stehen nur in der Ergebnismitteilung. Die Verwaltung ist berufsmäßige Gehilfin nach § 203 Abs. 3 StGB; dass sie keine Befunde sieht, ist Ihre eigene Regel, kein gesetzliches Verbot. Offen ist auch, ob nach jeder Vorsorge eine Ergebnismitteilung hinausgeht oder nur bei Bedarf.","options":[{"key":"a","label":"Streng: Ärztinnen und Ärzte drucken und kuvertieren medizinische Briefe; Laborbefunde kommen digital in einen ärztlichen Eingang; die Verwaltung übernimmt nur Umschläge und Hauspost","pros":"Vollständig im Sinne Ihrer Regel.","cons":"Mehr Büroarbeit für die Ärzte; Papierpost vom Labor muss trotzdem jemand öffnen."},{"key":"b","label":"Wie a, dazu ein Posteingang: Die Verwaltung scannt Papierpost vom Labor in einen Eingang, der nur Datum, Seitenzahl und Person speichert, ohne Zuordnung und ohne erneutes Öffnen; eine Ärztin oder ein Arzt ordnet zu","pros":"Die Verwaltung behält Versand und Scannen; gespeichert sieht sie nichts Medizinisches.","cons":"Beim Scannen sieht sie Papierbefunde kurz."},{"key":"c","label":"Die Verwaltung druckt medizinische Briefe aus einer Warteschlange oder sieht sie vollständig","pros":"Arbeitsteilung wie heute.","cons":"Das Papier ist trotzdem sichtbar; widerspricht Ihrer Regel."}],"recommended":"b","why":"Erhält die Arbeitsteilung; da das Labor auf digitalen Versand umstellt, bleibt Papierpost die Ausnahme; die Ergebnismitteilung geht hinaus, wenn Sie es für nötig halten.","blocks":"M5, M6, M8"},{"id":"D-49","title":"Aufbewahrung von Einladungen und Listen","question":"Für Einladungen, Erinnerungen und Fälligkeitslisten gibt es keine gesetzliche Aufbewahrungsfrist. Wie lange werden die PDFs aufbewahrt?","owner":"practice","context":"Der Nachweis einer Einladung oder eines Angebots kann im Streitfall wichtig sein; Datensparsamkeit spricht gegen lange Speicherung. Bitte mit Ihrem Datenschutzbeauftragten abstimmen.","options":[{"key":"a","label":"Versandangaben so lange wie die Akte; PDFs nach 3 Jahren gelöscht","pros":"Nachweis für einen angemessenen Zeitraum; datensparsam.","cons":"Eine ältere Liste lässt sich nicht exakt wiederherstellen."},{"key":"b","label":"Nur Versandangaben","pros":"Am wenigsten Daten.","cons":"Nicht nachweisbar, was verschickt wurde."},{"key":"c","label":"Alles so lange wie die medizinische Akte","pros":"Einfachste Regel.","cons":"Bis zu 40 Jahre Daten ohne Zweck."}],"recommended":"a","why":"Entspricht der regelmäßigen Verjährung, bestätigt durch Ihren Datenschutzbeauftragten.","blocks":"Ab M5"},{"id":"D-50","title":"Zeitpunkt der Befunddokumentation","question":"Ursprünglich sollte die strukturierte Befunddokumentation schon im ersten Schritt kommen. Soll sie stattdessen zusammen mit dem Offline-Sprechtag zum täglichen Werkzeug werden?","owner":"both","context":"Fast alle Vorsorgen finden vor Ort mit schlechtem Internet statt; bis die Befunde digital sind, dokumentieren Sie auf Papier und tragen die Eckdaten nach.","options":[{"key":"a","label":"Befunde ab März 2028 am Bildschirm, ab Juni 2028 täglich vor Ort mit Offline","pros":"Die Dokumentation zieht einmal und in funktionierender Form nach draußen um.","cons":"Etwa sieben Monate lang Papier plus Nachtrag."},{"key":"b","label":"Befunde am Bildschirm schon vor dem ersten Echtbetrieb","pros":"Von Anfang an digital.","cons":"Erster Echtbetrieb etwa sechs Wochen später; nur nutzbar, wo das Netz hält."}],"recommended":"a","why":"Befunddokumentation hilft vor Ort erst, wenn sie offline funktioniert.","blocks":"M6"},{"id":"D-51","title":"Speicherformat der Befunde","question":"Wie werden die vorlagenbasierten Befunde technisch gespeichert?","owner":"developer","context":"Diese Entscheidung trifft die Entwicklung. Die Vorlagen sollen sich ändern können, und jede Korrektur muss nachvollziehbar bleiben (§ 630f BGB).","options":[{"key":"a","label":"Ein geprüftes Dokument je Befundfassung","pros":"Vorlagen ändern sich ohne Umbau; jede Fassung vollständig erhalten.","cons":"Auswertungen über viele Felder etwas aufwendiger."},{"key":"b","label":"Eine Zeile je Feld","pros":"Jedes Feld einzeln auswertbar.","cons":"Sehr viele Zeilen; Versionierung je Feld."},{"key":"c","label":"Eine Tabelle je Vorlage","pros":"Feste Felder.","cons":"Umbau bei jeder Vorlagenänderung."}],"recommended":"a","why":"Vorlagen können sich ändern, ohne die Datenbank umzubauen, und jede Fassung bleibt vollständig.","blocks":"M6"},{"id":"D-52","title":"Blutdruckfelder","question":"Erhält die Vorlage optionale Felder für Blutdruck und Puls, obwohl Messwerte erst „später“ kommen sollten?","owner":"practice","context":"Ihr einziges Messgerät ist das Blutdruckmessgerät; eine Standard-Vorsorge soll 1–3 Minuten dauern.","options":[{"key":"a","label":"Optionale Felder RR und Puls im Befund","pros":"Passt zu Ihrem Gerät; über die Zeit vergleichbar.","cons":"Etwas mehr als ursprünglich gewünscht."},{"key":"b","label":"Nur Freitext","pros":"Genau wie gewünscht.","cons":"Nicht vergleichbar."},{"key":"c","label":"Alle Messwerte (Größe, Gewicht, BMI, Seh- und Hörtest)","pros":"Vollständig.","cons":"Bremst das 1–3-Minuten-Ziel."}],"recommended":"a","why":"Zwei optionale Felder kosten keine Zeit.","blocks":"M6"},{"id":"D-53","title":"Telemedizinische Vorsorge","question":"Wie werden telemedizinische Vorsorgen behandelt, solange ein Videomodul erst später kommt?","owner":"practice","context":"Nach AMR 3.4 Nr. 4 prüft die Ärztin oder der Arzt vor jeder telemedizinischen Vorsorge, ob sie vertretbar ist; die erste Pflicht- oder Angebotsvorsorge im Betrieb findet in Präsenz statt; der Arbeitgeber erhält das Ergebnis der Prüfung in Textform. Diese Regeln sind bereits vorgesehen; offen ist, wie das Gespräch selbst geführt wird.","options":[{"key":"a","label":"Die Software erfasst Präsenz, Video oder Telefon mit der Prüfung und der Mitteilung an den Arbeitgeber; das Gespräch läuft über ein externes Programm","pros":"Regelkonform dokumentiert; kein Videomodul nötig.","cons":"Ein zweites Programm für das Gespräch."},{"key":"b","label":"Videodienst in Version 1 einbauen","pros":"Ein Programm.","cons":"Sollte später kommen; ein weiterer Auftragsverarbeiter."},{"key":"c","label":"Durchführungsart nicht erfassen","pros":"Kein Aufwand.","cons":"Prüfung und Nachweis nach AMR 3.4 fehlen."}],"recommended":"a","why":"Regelkonform ohne eigenes Videomodul; bis März 2028 dokumentieren Sie telemedizinische Vorsorgen wie heute auf Papier.","blocks":"M6"},{"id":"D-54","title":"Vorab-Anamnese durch den Probanden","question":"Ab wann füllen Probanden den Anamnesebogen selbst aus (Link oder Tablet), da Sie ihn als „wichtig“, aber auch als „später“ markiert haben?","owner":"practice","context":"Ein Formular für Probanden braucht einen öffentlich erreichbaren Zugang für Gesundheitsdaten mit eigener Sicherheitsprüfung und Einwilligungstext.","options":[{"key":"a","label":"Nach Version 1 als eigener Schritt; die Vorlagen werden schon jetzt so gebaut, dass Probanden sie später selbst ausfüllen können","pros":"Kein öffentlicher Zugang mit Gesundheitsdaten in Version 1.","cons":"In Version 1 tragen Sie die Antworten selbst ein."},{"key":"b","label":"Ende 2028 als Tablet vor Ort","pros":"Kein Internetformular.","cons":"Braucht ein offlinefähiges Tablet; Tablet sollte später kommen."},{"key":"c","label":"Früh per E-Mail-Link","pros":"Frühester Nutzen.","cons":"Wenige E-Mail-Adressen; großer Sicherheitsaufwand vorab."}],"recommended":"a","why":"Bereitet alles vor, ohne in Version 1 einen öffentlichen Zugang für Gesundheitsdaten zu öffnen.","blocks":"M6 Vorlagen"},{"id":"D-55","title":"Welche Daten auf dem Laptop liegen dürfen","question":"Was darf der Laptop für einen Offline-Sprechtag enthalten?","owner":"both","context":"Spontan Erscheinende und Ersatz für Nichterschienene sind häufig; ein verlorener Laptop muss datenschutzrechtlich bewertet werden. Jeder Teil des Pakets lässt sich einzeln ein- oder ausschalten.","options":[{"key":"a","label":"Nur die Teilnehmer mit Vorgeschichte","pros":"Am wenigsten Daten.","cons":"Spontan Erscheinende sind offline nicht auffindbar."},{"key":"b","label":"Teilnehmer mit Vorgeschichte, dazu ein Verzeichnis der aktiven Beschäftigten am Standort nur mit Stammdaten; keine Scans; ein Paket je Sprechtag, nach dem Abgleich gelöscht","pros":"Spontan Erscheinende sind abgedeckt; entspricht der heutigen Papiervorbereitung.","cons":"Bei spontan Erscheinenden fehlt offline die Vorgeschichte."},{"key":"c","label":"Alle Kunden mit Sprechtag im Zeitraum −30 bis +14 Tage plus kürzlich geöffnete Akten","pros":"Etwas Vorgeschichte auch für spontan Erscheinende.","cons":"Mehr Daten auf dem Gerät."},{"key":"d","label":"Vollständige Kopie aller Daten","pros":"Alles überall.","cons":"Gesundheitsdaten aller 5.000–15.000 Probanden auf jedem Laptop."}],"recommended":"b","why":"Deckt spontan Erscheinende mit möglichst wenig Gesundheitsdaten ab; Scans nur, wenn Sie sie für einen Probanden ausdrücklich brauchen.","blocks":"M7, Datenschutz-Folgenabschätzung"},{"id":"D-56","title":"Entsperren ohne Internet","question":"Wie funktioniert „zweiter Faktor bei jeder Anmeldung“ auf einem Laptop ohne Internet?","owner":"both","context":"Ohne Verbindung kann der Server keinen App-Code prüfen. Das Paket wird vorher online mit vollständiger Anmeldung geladen. Ihr Datenschutzbeauftragter bestätigt das Ergebnis.","options":[{"key":"a","label":"Offline-Kennwort (mindestens 12 Zeichen) plus ein Schlüssel, der fest an den freigegebenen Laptop gebunden ist; Sperre nach 60 Minuten; Paket gültig bis 72 Stunden nach dem Sprechtag; Löschung nach 10 Fehlversuchen (bereits Dokumentiertes bleibt verschlüsselt erhalten)","pros":"Funktioniert in jedem aktuellen Browser; zwei Faktoren: Gerät und Wissen.","cons":"Ein schwaches Kennwort schützt bei Diebstahl weniger; die Festplattenverschlüsselung ist die Grundlage."},{"key":"b","label":"Passkey oder Fingerabdruck des Geräts","pros":"Stark, kein Kennwort.","cons":"2026 noch nicht in allen Browsern gleich unterstützt; Verlust kann nicht übertragene Daten kosten."},{"key":"c","label":"PIN, gültig 72 Stunden nach jeder Online-Anmeldung","pros":"Einfach.","cons":"Schwächer als das Kennwort."},{"key":"d","label":"Keine Offline-Entsperrung; die morgens geöffnete Sitzung bleibt den ganzen Tag offen","pros":"Am einfachsten.","cons":"Widerspricht der Abmeldung nach 60 Minuten; ein geschlossenes Fenster sperrt Sie aus."}],"recommended":"a","why":"Funktioniert heute in jedem Browser; b wird geprüft, sobald die Unterstützung einheitlich ist; die Bedienung testen Sie im Feldtest auf Ihren Laptops.","blocks":"Offline-Einsatz vor Ort"},{"id":"D-57","title":"Geräte für den Offline-Betrieb und iPad","question":"Welche Geräte dürfen Gesundheitsdaten offline enthalten, und wird das iPad in Version 1 unterstützt, online und offline?","owner":"practice","context":"Safari löscht gespeicherte Daten nach 7 Tagen ohne Nutzung, wenn die App nicht vom Home-Bildschirm gestartet wird; Tablets sollten „später“ kommen, und Sie arbeiten bevorzugt mit Maus und Tastatur.","options":[{"key":"a","label":"Praxis-Laptops mit Festplattenverschlüsselung, Chrome oder Edge als installierte App für offline; iPad in Version 1 online, offline ab Ende 2028 nach eigenem Feldtest; keine eigene Touch-Oberfläche","pros":"Kontrollierbar und datenschutzrechtlich gut begründbar; keine doppelte Oberfläche.","cons":"Ein iPad ist bis Ende 2028 nur online nutzbar."},{"key":"b","label":"Laptops und iPads offline ab Juni 2028","pros":"Alle Geräte sofort.","cons":"Risiko gelöschter Daten; mehr Tests im schwierigsten Schritt."},{"key":"c","label":"Jedes ärztliche Gerät mit bestätigter Verschlüsselung","pros":"Keine Anschaffung.","cons":"Private Geräte sind schwer zu kontrollieren und zu sperren."}],"recommended":"a","why":"Eine erprobte Geräteart im schwierigsten Schritt; das iPad folgt nach eigenem Test.","blocks":"M7, M9 iPad"},{"id":"D-58","title":"Offline oder Labor zuerst","question":"Kommen nach den Bescheinigungen zuerst Befunde und Offline oder zuerst Labor und Immunstatus?","owner":"practice","context":"Das Labor steht auf Platz 3 Ihrer wichtigsten Wünsche und kann sofort auf digitalen Versand umstellen; die ärztliche Freigabe von Laborwerten braucht aber die Befunddokumentation.","options":[{"key":"a","label":"Erst Befunde und Offline, dann Labor","pros":"Das größte technische Risiko wird früh erledigt; Offline war Ihr Wunsch für Version 1.","cons":"Digitaler Laboreingang erst im Sommer 2028."},{"key":"b","label":"Erst Labor und Immunstatus","pros":"Laborzuordnung etwa vier Monate früher.","cons":"Ohne Befunddokumentation fehlt der Zusammenhang; Offline verschiebt sich."}],"recommended":"a","why":"Risiko zuerst, und das Labor baut auf der Befunddokumentation auf.","blocks":"Reihenfolge M7 und M8"},{"id":"D-59","title":"Wie Laborbefunde hineinkommen","question":"Wie gelangen Laborbefunde ins System, sobald das Labor digital liefert?","owner":"both","context":"LDT 3 ist das übliche Labordatenformat der Kassenärztlichen Bundesvereinigung; ob Ihr Labor es auch einer Praxis außerhalb der Kassenabrechnung liefert, ist unbekannt.","options":[{"key":"a","label":"PDF hochladen, wichtige Werte (Titer) eintippen, Zuordnung per Bildschirm","pros":"Funktioniert mit jedem Labor sofort.","cons":"Werte von Hand."},{"key":"b","label":"LDT-Datei einlesen mit automatischer Zuordnung","pros":"Werte kommen strukturiert.","cons":"Etwas mehr Aufwand; braucht eine Musterdatei des Labors mit erfundenen Daten."},{"key":"c","label":"Automatischer Abruf (verschlüsselte E-Mail oder Dateiübertragung)","pros":"Kein Handgriff.","cons":"Mitwirkung des Labors und Einrichtung nötig."}],"recommended":"a","why":"a im Sommer 2028, danach b, sobald Sie das Labor benennen und eine Musterdatei vorliegt (bis 01.05.2028).","blocks":"M8"},{"id":"D-60","title":"Umfang des Immunstatus","question":"Kommt der Immunstatus (Status je Krankheit, Nachweis, Titer, Auffrisch- und Titertermine, Masern-Nachweis) in Version 1, obwohl Impfmanagement „später“ markiert ist?","owner":"practice","context":"Sie möchten Auffrischungen und Titerkontrollen als Fristen, nennen eine Impfbescheinigung und sagen, dass Laborwerte vor allem den Impfschutz betreffen; selbst impfen Sie nicht.","options":[{"key":"a","label":"Immunstatus in schlanker Form: Status je Krankheit, Nachweis, Titerwerte, Auffrisch- und Titertermine; kein Impfbuch, keine Chargen","pros":"Passt zu Ihren Antworten; überschaubar.","cons":"Etwas mehr als „später“."},{"key":"b","label":"Später","pros":"Kleinere Version 1.","cons":"Titerfristen und Laborzuordnung verlieren ihren Zweck."},{"key":"c","label":"Vollständiges Impfmanagement mit Impfbuch","pros":"Vollständig.","cons":"Sie impfen nicht selbst."}],"recommended":"a","why":"Was Laborablauf und Erinnerungswunsch brauchen, ohne Impfverwaltung.","blocks":"M8"},{"id":"D-61","title":"Immunität und Vorsorge bei Biostoffen","question":"Beendet eine nachgewiesene Immunität die Pflicht- oder Angebotsvorsorge bei Biostoffen?","owner":"practice","context":"In der ArbMedVV spielt Immunität nur für das Impfangebot eine Rolle (§ 6 Abs. 2); die TRBA 250 sieht keinen Verzicht vor; eine Regel der TRBA 100 für Labore ist ungeprüft.","options":[{"key":"a","label":"Die Vorsorge läuft weiter; Sie können je Anlass „n. n.“ setzen","pros":"Durch die geltenden Texte gedeckt.","cons":"Mehr Vorsorgen für immune Beschäftigte."},{"key":"b","label":"Die Software schlägt „n. n.“ vor, wenn alle Erreger abgedeckt sind","pros":"Weniger Termine.","cons":"Stützt sich auf eine ungeprüfte Regel; rechtliches Risiko."},{"key":"c","label":"Keine Biostoff-Vorsorge mehr bei Immunität","pros":"Geringster Aufwand.","cons":"Wahrscheinlich nicht vereinbar mit § 4 ArbMedVV."}],"recommended":"a","why":"Die einzige Option, die durch die geprüften Texte gedeckt ist; die Einzelfallentscheidung bleibt bei Ihnen.","blocks":"M8"},{"id":"D-62","title":"Was die Verwaltung von Impf-Terminen sieht","question":"Die Verwaltung sieht Fristen, aber keine Befunde. Wie viel von einem Impf- oder Titertermin sieht sie?","owner":"practice","context":"Eine Bezeichnung wie „Kontrolle nach Zusatzdosis“ verrät einen Befund; einladen muss die Verwaltung trotzdem.","options":[{"key":"a","label":"Neutral „Impfstatus-Termin“ mit Monat; Bezeichnung, Grund und Werte nur für Ärztinnen und Ärzte","pros":"Die Verwaltung kann einladen; kein Befund wird sichtbar.","cons":"Den Zweck erklären Sie beim Termin."},{"key":"b","label":"Volle Bezeichnung","pros":"Transparent.","cons":"Bezeichnungen verraten Befunde."},{"key":"c","label":"Nicht sichtbar; Ärzte laden selbst ein","pros":"Größte Vertraulichkeit.","cons":"Widerspricht Ihrer Arbeitsteilung."}],"recommended":"a","why":"Die Einladung bleibt bei der Verwaltung, ohne Befunde preiszugeben.","blocks":"M8"},{"id":"D-63","title":"Kalender in Version 1","question":"Wie viel Kalender braucht Version 1 („wäre gut, aber nicht zwingend“, im Modulplan aber „Version 1“)?","owner":"both","context":"Sie beschreiben vor allem die Sprechtagsplanung mit Zeitfenstern; ein Abgleich in beide Richtungen mit Google oder Proton ist aufwendig und störanfällig.","options":[{"key":"a","label":"Sprechtags- und Zeitplanung ab Januar 2028; ab Herbst 2028 ein Kalender-Abonnement ohne Probandennamen zum Einbinden in Ihren Kalender","pros":"Deckt Ihren Ablauf; kein störanfälliger Abgleich.","cons":"Private Termine bleiben im bisherigen Kalender."},{"key":"b","label":"Abgleich in beide Richtungen mit Google oder Proton","pros":"Ein Kalender.","cons":"Störanfällig; Proton bietet kaum Schnittstellen; weitere Datenschutzprüfung."},{"key":"c","label":"Nur Sprechtagsplanung","pros":"Geringster Aufwand.","cons":"Termine von Hand übertragen."}],"recommended":"a","why":"Liefert, was Sie beschreiben, ohne störanfälligen Abgleich.","blocks":"M9"},{"id":"D-64","title":"Inhalt und Format des Jahresberichts","question":"Was enthält der Jahresbericht je Kunde, und in welchem Format, da § 5 DGUV Vorschrift 2 kein Format vorgibt?","owner":"practice","context":"Der erste Bericht aus Systemdaten betrifft 2028 und ist Anfang 2029 fällig; das Auszählen gehört zu Ihren großen Zeitfressern.","options":[{"key":"a","label":"Automatische Statistik (Anzahl je Anlass und Art, Ablehnungen, Nichterscheinen, Überfällige) plus Ihre Textabschnitte, als bearbeitbare Word-Datei nach dem Aufbau eines früheren Berichts","pros":"Das Zählen entfällt; Sie bearbeiten vor dem Versand.","cons":"Änderungen in Word werden nicht ins System zurückgespeichert."},{"key":"b","label":"Nur festes PDF","pros":"Einheitlich; so archiviert, wie verschickt.","cons":"Kein Platz für Ihre eigenen Ausführungen."},{"key":"c","label":"Den Vorjahresbericht genau nachbilden","pros":"Vertraut.","cons":"Braucht eventuell Inhalte, die das System nicht hat (Begehungen, Einsatzzeiten)."}],"recommended":"a","why":"Automatisiert das Zählen und lässt den Text bei Ihnen.","blocks":"M9"}],"openQuestions":[{"id":"Q-01","question":"Welcher Wochentag und welche Uhrzeit passen für den festen 30-minütigen Test alle zwei Wochen, und wer testet für die Verwaltung und für die Ärzte?","why":"Der Test ist die Abnahme jeder neuen Version; der Termin wird bei der ersten Vorführung im Februar 2027 festgelegt.","owner":"practice"},{"id":"Q-02","question":"Können Sie bis 15.03.2027 die Spaltenüberschriften (ohne Inhalt) Ihrer Excel-/Numbers-Fristenliste und von zwei typischen Personallisten schicken, dazu ein Foto einer leeren Karteikarte?","why":"Übernahme und Abgleich werden an diesem Aufbau gebaut und getestet; echte Daten kommen vorher nie in die Entwicklung.","owner":"practice"},{"id":"Q-03","question":"Welcher Kunde soll Pilotkunde werden (Excel-Listen, 200–800 Probanden, eigene Kartei, Sprechtag im November 2027), und welche Kunden folgen in der ersten Welle?","why":"Davon hängt der Umstellungsplan und der erste echte Import ab 04.10.2027 ab (D-29).","owner":"practice"},{"id":"Q-04","question":"Sind Ihre Excel-/Numbers-Fristenlisten für alle Kunden vollständig, oder stehen manche nächsten Termine nur auf den Karteikarten?","why":"Entscheidet je Kunde, ob Karteikarten vor der Umstellung nachgetragen werden müssen (D-26).","owner":"practice"},{"id":"Q-05","question":"Wie hoch war Ihr Umsatz 2026, aufgeteilt nach Vorsorge, Eignungsuntersuchungen, ASiG-Pauschale und Einsatzzeit sowie Fahrtkosten, und wie ordnet Ihr Steuerberater diese Leistungen umsatzsteuerlich ein?","why":"Davon hängt ab, ob Sie ab 01.01.2027 E-Rechnungen ausstellen müssen; bitte bis 15.12.2026 (D-08).","owner":"practice"},{"id":"Q-06","question":"Haben Sie bereits einen E-Mail-Anbieter mit Auftragsverarbeitungsvertrag, der Systemnachrichten und Einladungen versenden darf (z. B. ein bezahltes mailbox.org-Business-Konto)? Sonst wird bis 30.06.2027 eine Praxisdomain mit Postfach bestellt.","why":"Systemnachrichten werden ab dem ersten Echtbetrieb gebraucht (D-28).","owner":"practice"},{"id":"Q-07","question":"Wer in der Praxis erhält Systemhinweise (fehlgeschlagene Sicherung, Notfallzugang, Zurücksetzen des zweiten Faktors), und wer lädt das wöchentliche Archiv herunter?","why":"Beides steht auf der Checkliste vor dem Echtbetrieb (D-37).","owner":"practice"},{"id":"Q-08","question":"Wie viele Stunden pro Woche kann die Verwaltung zwischen Oktober 2027 und Februar 2028 für die Umstellung der Kunden aufwenden?","why":"Bestimmt das Tempo der Umstellungswellen.","owner":"practice"},{"id":"Q-09","question":"Welche Laptops nehmen die Ärzte zu Sprechtagen mit (Anzahl, Windows oder Mac, Eigentum der Praxis, Festplattenverschlüsselung eingeschaltet)? Gibt es im Sprechzimmer einen Drucker, und ist vor Ort meist ein Handy-Hotspot möglich?","why":"Gerätefreigabe, Test auf Ihrem Modell, Druck vor Ort und Abgleich tagsüber (D-57).","owner":"practice"},{"id":"Q-10","question":"Welcher Abend passt für ein monatliches Wartungsfenster von etwa zwei Stunden, und ist es für Sie in Ordnung, dass das System nach einem ungeplanten Neustart gesperrt bleibt, bis es entsperrt wird, meist innerhalb eines Werktags?","why":"Folge der verschlüsselten Ablage auf dem Server (D-34); Papier und Offline-Pakete überbrücken.","owner":"practice"},{"id":"Q-11","question":"In welchem Bundesland ist die Praxis ansässig?","why":"Bestimmt die Berufsordnung der Landesärztekammer und die zuständige Datenschutzaufsicht.","owner":"practice"},{"id":"Q-12","question":"Ist eine Ärztin oder ein Arzt der Praxis ermächtigt nach der Strahlenschutzverordnung?","why":"Nur dann gibt es die Strahlenschutz-Bescheinigung und die besonderen Aufbewahrungsregeln; sonst entfällt dieser Teil.","owner":"practice"},{"id":"Q-13","question":"Für welche Kunden führen Sie heute die Vorsorgekartei, und wie oft wünschen Kunden einen Kartei-Export (monatlich, vierteljährlich, bei Prüfung)?","why":"Einstellung je Kunde, Verträge und Reihenfolge der Umstellung (D-47).","owner":"practice"},{"id":"Q-14","question":"Was ist mit „owncloud“ in Ihrer Anmerkung gemeint: eine vorhandene ownCloud/Nextcloud, ein Wunsch oder allgemein „eigene Cloud“?","why":"Entscheidet, ob die Praxiskopie automatisch abgelegt werden kann (D-37).","owner":"practice"},{"id":"Q-15","question":"Wer ist die Vertretungsärztin oder der Vertretungsarzt, gibt es eine schriftliche Vertretungsvereinbarung, wer darf den Notfallumschlag öffnen, und gibt es dafür einen abschließbaren Schrank oder Tresor?","why":"Vertretung und versiegelter Umschlag müssen vor dem Echtbetrieb geregelt sein (D-36).","owner":"practice"},{"id":"Q-16","question":"Diktat: Welche App auf welchem Handy, wird auf dem Handy umgewandelt oder Ton an einen Clouddienst geschickt, und wo bleiben Aufnahmen und Texte?","why":"Befunde dürfen nicht ohne Vertrag und Verschwiegenheitsverpflichtung an Dritte gelangen; vor den ersten echten Daten zu klären.","owner":"practice"},{"id":"Q-17","question":"Womit scannen Sie (Einwilligungen, Altakten, Unterschrift), und sollen auch Handyfotos hochgeladen werden können?","why":"Eingescannte Einwilligungen sind Voraussetzung für die Eignungsausfertigung an den Arbeitgeber; ein Scanner ist in Ihren Antworten nicht genannt.","owner":"practice"},{"id":"Q-18","question":"Sollen Wunschvorsorge, Mutterschutz-Beratung, BEM und abgelehnte Angebotsvorsorge auf den Fälligkeitslisten für den Arbeitgeber erscheinen?","why":"Solche Einträge können Gesundheitsinformationen gegenüber der Personalabteilung verraten (D-23).","owner":"practice"},{"id":"Q-19","question":"Legen Gefährdungsbeurteilungen einzelner Kunden kürzere Abstände fest als die AMR 2.1?","why":"Die Frage im Fragebogen blieb offen; davon hängen Kundenregeln und Voreinstellungen ab.","owner":"practice"},{"id":"Q-20","question":"Führen Sie Untersuchungen nach dem Jugendarbeitsschutzgesetz für Auszubildende unter 18 durch, und welche Fahr-, Steuer- und Überwachungstätigkeiten kommen bei welchen Kunden auf welcher Grundlage vor?","why":"Voreinstellungen und Bescheinigungen für diese Untersuchungen (D-21).","owner":"practice"},{"id":"Q-21","question":"Mit welchem Labor arbeiten Sie, und was liefert es nach der Umstellung: LDT-Datei, PDF per E-Mail oder Download aus einem Portal?","why":"Bestimmt den Weg der Laborbefunde; eine Musterdatei mit erfundenen Daten wird bis 01.05.2028 gebraucht (D-59).","owner":"practice"},{"id":"Q-22","question":"Darf die Software die Ereignisse „Angebotsvorsorge abgelehnt“ und „Tätigkeit oder Exposition beendet“ erfassen, die im Fragebogen nicht angekreuzt waren?","why":"Nötig, um abgelehnte Angebote erneut anzubieten und die nachgehende Vorsorge auszulösen.","owner":"practice"},{"id":"Q-23","question":"Reicht für Briefe immer die Hauspost über Station und Kunde, oder werden Privatanschriften gebraucht?","why":"Briefvorlagen brauchen eine Anschrift; die Vorsorgebescheinigung nach AMR 6.3 sieht zudem die Privatanschrift vor.","owner":"practice"},{"id":"Q-24","question":"Ist die Grenze von 50 EUR im Monat brutto oder netto gemeint, und sind Domain und E-Mail darin enthalten?","why":"Der Plan passt mit etwa 39–40 EUR brutto in beiden Fällen, der Spielraum ist aber verschieden.","owner":"practice"},{"id":"Q-25","question":"Führt Ihr Datenschutzbeauftragter bereits ein Verzeichnis der Verarbeitungstätigkeiten für die Praxis, und kann er die Datenschutz-Folgenabschätzung vor den ersten echten Daten prüfen (Buchung im Frühjahr 2027)?","why":"Seine schriftliche Stellungnahme ist Voraussetzung für die ersten echten Daten (D-39).","owner":"practice"},{"id":"Q-26","question":"Wie viele Entwicklungsstunden pro Woche sind bis zum ersten Echtbetrieb und danach realistisch?","why":"Alle Termine gehen von 20 Stunden aus; nach dem ersten Meilenstein werden sie mit den gemessenen Stunden neu berechnet.","owner":"developer"},{"id":"Q-27","question":"Wer ist die zweite technische Person, die im Notfall nach den Betriebsanleitungen handeln kann, sich nach § 203 StGB verpflichtet und vor den ersten echten Daten eigenen Zugang erhält?","why":"Ohne benannte Person gibt es keine echten Daten im System; bis 27.08.2027 zu klären.","owner":"developer"}],"risks":[{"id":"R-01","title":"Entwicklungszeit: weniger Stunden als angenommen verschieben den ersten Echtbetrieb Richtung Weihnachten 2027","level":"high","mitigation":"Stunden werden ab der ersten Woche erfasst und die Termine im März 2027 neu berechnet; bis dahin gelten für Sie die späten Termine; Puffer für Rückmeldungen und technische Risiken sind eingeplant; je Meilenstein ist festgelegt, was zuerst entfallen kann."},{"id":"R-02","title":"Personallisten nur mit Namen: eine falsche Zuordnung mit automatischem „ausgeschieden“ beendet die Beschäftigung der falschen Person und stoppt deren Pflichtvorsorge","level":"high","mitigation":"Abgleich in Stufen mit Bestätigung, Gesamtliste nur für einen festgelegten Bereich, 30 Tage rückgängig machbar, beim ersten Import eines Kunden kein automatisches Ausscheiden, Bitte an alle Kunden um eine Spalte Geburtsdatum (D-24, D-25)."},{"id":"R-03","title":"Übernahme der Fristen: Excel-Listen und Karteikarten weichen ab, und die aktuellen Abstände der AMR 2.1 lassen die ersten Listen voller „überfällig“ erscheinen","level":"high","mitigation":"Karteikarten nachtragen, wo Listen lückenhaft sind (D-26), geschätzte Positionen kennzeichnen, je Kunde 20 Probanden gegen die Karteikarte prüfen, erste Fälligkeitsliste jedes Kunden ärztlich durchsehen, Papier läuft mit bis zwei Sprechtage fehlerfrei waren (D-31)."},{"id":"R-04","title":"Verträge und Datenschutzunterlagen nicht rechtzeitig fertig","level":"medium","mitigation":"Beginn im Frühjahr 2027; technische Teile liefert die Entwicklung als Entwurf; den Datenschutzbeauftragten früh buchen; ohne diese Unterlagen kommen keine echten Daten ins System, eine Verspätung kostet also Zeit, keine Rechtssicherheit."},{"id":"R-05","title":"Fristen falsch ausgelegt: eine Pflichtvorsorge wird zu spät vorgeschlagen","level":"medium","mitigation":"Sie bestätigen die Auslegungen an Beispielfällen im Frühjahr 2027; automatische Prüfung, dass kein Vorschlag die Höchstfrist überschreitet; jede Regeländerung zeigt, wie viele Fristen sich verschieben, und braucht Ihre Freigabe."},{"id":"R-06","title":"Fehler beim Offline-Abgleich oder verlorener Laptop","level":"medium","mitigation":"Derselbe Übertragungsweg ist ab dem ersten Echtbetrieb täglich im Einsatz; Konflikte werden zu Aufgaben; Feldtest mit Papier als Reserve; Pakete je Sprechtag verschlüsselt, mit Kennwort und Geräteschlüssel, aus der Ferne sperrbar."},{"id":"R-07","title":"Befunde gelangen an die Verwaltung oder einen Arbeitgeber","level":"medium","mitigation":"Mehrfache Absicherung bis in die Datenbank; automatische Prüfung jeder Ansicht, Liste und E-Mail vor jeder Version; in jedem Test wird auch aus Sicht der Verwaltung geprüft."},{"id":"R-08","title":"Der technische Betrieb hängt an einer Person","level":"medium","mitigation":"Benannte zweite technische Person mit eigenem Zugang vor den ersten echten Daten; Betriebsanleitungen und versiegelter Umschlag; Neustarts nur im Wartungsfenster; Papier und Offline-Pakete überbrücken einen Tag."},{"id":"R-09","title":"Die E-Rechnungspflicht kommt, bevor ein Rechnungsprogramm gewählt ist","level":"medium","mitigation":"Steuerberater bis 15.12.2026; Rechnungsprogramm bis 31.12.2026 oder 31.10.2027 je nach Ergebnis; Leistungsnachweis aus der Software vor 2028 (D-08)."},{"id":"R-10","title":"Dringende Zusatzwünsche verschieben laufende Schritte","level":"medium","mitigation":"Neue Wünsche kommen in die Entscheidungsliste oder auf die Liste „später“; was zusätzlich kommt, ersetzt ausdrücklich etwas anderes."},{"id":"R-11","title":"Tests fallen aus oder Unterlagen kommen spät (Vorlagen, Unterschriften, Anamnesebögen, Labormuster)","level":"medium","mitigation":"Fester Testtermin alle zwei Wochen mit kurzem Ablaufplan; Liste der Unterlagen mit Terminen und Ersatzlösung; Vorlagen sind Daten, eine späte Vorlage ändert also keine Programmierung."},{"id":"R-12","title":"Echte Daten gelangen in die Entwicklung (Support-Anfrage, Bildschirmfoto, weitergeleitete Personalliste)","level":"low","mitigation":"Außerhalb des Echtsystems nur erfundene Daten; Fehler werden mit erfundenen Daten nachgestellt; Personallisten nur über den Import, nie per E-Mail an die Entwicklung."},{"id":"R-13","title":"Die Bescheinigung lässt sich nicht genau genug nach Ihrer Vorlage gestalten","level":"low","mitigation":"Test im ersten Schritt mit dem Muster nach AMR 6.3 und erneut mit Ihrer Vorlage; als Reserve wird der Briefkopf als Bild hinterlegt."},{"id":"R-14","title":"Preiserhöhung oder Ende eines Servertarifs beim Anbieter","level":"low","mitigation":"Anbieterunabhängiger Aufbau; die vierteljährliche Wiederherstellungsprobe auf einem frischen Server übt zugleich den Umzug; etwa 10 EUR monatlicher Spielraum."}]},"en":{"lang":"en","title":"Implementation plan: practice software for occupational medicine","subtitle":"Outline of the plan for review by the practice and the developer: scope, architecture, roadmap M0–M9, 64 open decisions, open questions and risks.","asOf":"2026-11-07","intro":"This page condenses the implementation plan in docs/plan/ (chapters 00–08 and decisions.md) into one reviewable outline. Read the overview and the seven chapter summaries, rate each chapter and comment on milestones and risks. For each decision D-01 to D-64 pick an option (the recommended one is what the build follows until a choice is recorded) and answer the open questions. Export the result as a text file; it is filed under docs/plan/feedback/ and carried into decisions.md and the chapters.","summary":["Version 1 is a digital Vorsorgekartei under ArbMedVV for one practice with 16–40 Kunden and 5,000–15,000 Probanden: Kunden hierarchy, Probanden and Beschäftigungen, a deadline engine that proposes the next month per Proband and Anlass (AMR 2.1, month-precise, bald fällig 3 months ahead, bundled to the earliest month), import of the Kunden's HR lists, Fälligkeitslisten, Sprechtag planning, both AMR 6.3 Vorsorgebescheinigungen, structured findings with Normalbefund, an offline Sprechtag on the physician's laptop, lab results with Immunstatus, e-mail reminders and the annual report. Billing, portals, online booking and the Proband's own Vorab-Anamnese come later; TI/ePA and an Impfbuch are not planned.","It ships in steps so that the practice's first pain (deadlines) is relieved first: V1.0a Kartei und Fristen at GL1 (end of M4, pilot import in the week of 2027-10-04 at 20 h/week), V1.0b Sprechtag and Bescheinigungen (M5, January 2028), V1.1 findings plus offline on site at GL2 (M7, June 2028), V1.2 Labor and Immunstatus (M8), V1.3 Kommunikation and Jahresbericht (M9, November 2028). Total about 40.6 dev-weeks including a 10 % feedback allowance; until the weekly hours are measured the practice is told the late dates (GL1 late November 2027, GL2 end of September 2028, V1.3 March 2029).","Architecture: one TypeScript code base (React 19 PWA, Fastify 5 on Node.js 26 LTS, PostgreSQL 18 as the only database and job queue), Docker Compose on one netcup VPS in Nuremberg with an encrypted vault, hourly encrypted backups to a Hetzner Storage Box and a weekly encrypted archive the practice keeps itself; about 39–40 EUR gross a month from GL1 against a 50 EUR budget. Findings are separated in the database itself (schema med, no grant for the assistant's role), checked by sentinel tests on every route, export and template.","The offline Sprechtag is the only place a browser holds health data: an enrolled laptop checks out an encrypted package for one Sprechtag, documents and prints certificates without network, and returns idempotent commands through the same outbox the office uses online every day from M2. The deadline engine and the pdfmake certificate renderer are shared code on server and laptop.","Nothing real enters any system before the RD gate: production in the practice's own accounts, AVVs, the developer's Art. 28 and § 203 StGB agreement, a named second technician, VVT and DPIA with the DPO's written statement, and a timed restore drill. Until then all work, tests and demos use synthetic Probanden. Separately and first, the Steuerberater must say by 2026-12-15 whether e-invoices are required for services from 2027-01-01 (§ 27 Abs. 38 UStG).","Main risks: developer capacity, name-only HR lists that can match or retire the wrong person, migration quality of the existing deadline lists, the legal track arriving late, and the single operator. Each has a named mitigation in the risk list; decisions due in a milestone are presented at the demo before it and the recommended option stands if no answer arrives within two weeks."],"sections":[{"id":"scope","title":"Scope and requirements","short":"Scope","lead":"What Version 1 must do, for whom, and in which release; traced to the questionnaire answers by stable key plus number.","points":[{"title":"Users and roles","text":"Roles arzt, verwaltung, vertretung (inactive until activated) and betrieb (no access to records without a physician's time-limited grant). Two users today, 5+ within two years (team2y B2); one practice, single tenant, no product features (otherPractices B17)."},{"title":"Release cut","text":"V1.0a Kartei und Fristen (GL1), V1.0b Sprechtag and Bescheinigungen, V1.1a findings online, V1.1 Vor Ort digital with offline (GL2), V1.2 Labor and Immunstatus, V1.3 Kommunikation and Jahresbericht (01 §7, 07 §0; D-01, D-30, D-50)."},{"title":"Out of scope","text":"Later: online booking, Vorab-Anamnese by the Proband, billing and E-Rechnung module, client and Proband portals, SMS, HR interface, Einsatzzeiten and Begehungen. Not planned: TI/ePA (modules.epa H1) and an Impfbuch with Chargen, because the practice does not vaccinate (vaccinateSelf D12)."},{"title":"Requirements catalogue","text":"REQ-KUN, -PRB, -ANL, -FRI, -TER, -DOK, -BES, -IMP, -EXP, -EIN, -AUF, -LAB, -IMM, -AUS, -OFF, -BEN, -DSG, -BTR with priorities and acceptance criteria, plus NFR-01 to NFR-18 and screens S01–S17. Every acceptance criterion becomes at least one automated test named with its requirement ID; a coverage script lists IDs without a test."},{"title":"Speed targets","text":"A standard Vorsorge takes at most 6 user actions and a median of 60 s software time (speed K3, NFR-06); record open under 1 s and search under 300 ms with a 30,000-Probanden seed (NFR-07); 10 concurrent users at p95 under 500 ms (NFR-05)."},{"title":"Contradictions resolved by decision","text":"Matching key versus list contents (D-24), e-invoicing urgent versus billing later (D-08), calendar (D-63), tablet (D-57), Vorab-Anamnese (D-54), Immunstatus scope (D-60) and blood pressure fields (D-52); 01 §6 lists 27 questions behind them."}],"doc":"docs/plan/01-requirements.md"},{"id":"architecture","title":"Architecture and stack","short":"Architecture","lead":"One TypeScript code base, one server, one database, few moving parts; the offline Sprechtag is the only place a browser holds health data.","points":[{"title":"Stack","text":"React 19 SPA (Vite 8, TanStack) installable as a PWA, Fastify 5 JSON API on Node.js 26 LTS, PostgreSQL 18 with Drizzle and pg-boss as job queue; own authentication module on Argon2id, otplib and SimpleWebAuthn (ADR-12) and own outbox sync module of about 2,500 client lines (ADR-08). Decision D-02."},{"title":"Hosting","text":"Docker Compose behind Caddy on a netcup VPS 1000 G12.5 in Nuremberg (production) and a VPS 500 (staging); database, files and keys in a LUKS vault unlocked by hand after a reboot; hourly restic backups to a Hetzner Storage Box BX11. Provider-neutral bootstrap script, so a move is a restore drill (D-03, D-34)."},{"title":"Findings separated in the database","text":"Medical tables live in schema med; every request of the Verwaltung runs under app_assistant, which has no grant on med; every route declares its data classes; sentinel strings in every F field are scanned in responses, exports, PDFs and logs. A pull request that grants app_assistant anything on med fails CI."},{"title":"Offline Sprechtag","text":"An enrolled laptop checks out an encrypted package per Sprechtag (participants with history, a master-data directory of the Standort, templates, signature), captures Vorsorgen and prints certificates offline, and returns idempotent commands through an outbox. The same outbox carries every online Vorsorge from M2, and the conflict rules of 02 §7.8 turn collisions into tasks."},{"title":"Shared code","text":"The deadline engine and the pdfmake 0.3 renderer run identically in Node and in the browser, so walk-ins get a certificate offline without pre-rendered forms (D-05)."},{"title":"Spikes before feature work","text":"M0 spikes: offline (persistent storage on Edge, Chrome and Safari, encrypted 4,000-entry directory searched under 300 ms, printing under the strict CSP) and documents (PDF/A-2b passes veraPDF, 300 certificates under 60 s). A failure changes the architecture before anything is built on it."},{"title":"Dependencies","text":"Every major at least eight weeks old (ADR-23); Renovate with a 14-day minimum release age and no automatic merges; lockfile, install scripts disabled, osv-scanner and npm audit in CI."}],"doc":"docs/plan/02-architecture.md"},{"id":"domain","title":"Domain model and algorithms","short":"Domain model","lead":"About 60 tables, 45 of them in V1.0, with English identifiers in code and the practice's German terms in the interface and documents (D-06).","points":[{"title":"Organisation and persons","text":"client (Unternehmen/Träger) → site (Standort) → unit (Abteilung/Station) with Kostenstelle; person with fresh Probanden-Nummer; employment per Kunde. The record belongs to the person, so a Proband with two employers has one record and two Beschäftigungen."},{"title":"Catalogue and deadlines","text":"occasion (Anlass) with Art Pflicht, Angebot, Wunsch or Eignung; Tätigkeitsprofile map Tätigkeiten to Anlässe (several per Beschäftigung, D-13); occasion_assignment per employment; stored deadline rows recomputed by one function on every trigger plus a nightly comparison that alerts on differences (D-14)."},{"title":"Deadline engine","text":"A pure function: month-precise output, bald fällig 3 months ahead (soonWindow D6), bundling to the earliest month within ArbMedVV (bundle D8), physician overrides with reason and history. Table-driven case files, 100 % branch coverage of the engine package and fast-check properties, including that no proposal exceeds the AMR 2.1 maximum."},{"title":"Data classes and history","text":"Classes M, O, C-AG, C-B, F, S and A drive authorisation, export and offline rules. Every update writes a history row (§ 630f BGB for findings); no soft delete, but hard delete plus tombstone after the retention period."},{"title":"Import pipeline","text":"Parse in the worker only (xlsx, CSV in Windows-1252 or UTF-8, header in any row), column mapping remembered per Kunde, normalisation, tiered matching, diff classes (new, changed, unsure, missing), confirmation, idempotent commit and undo for 30 days (03 §5)."},{"title":"Encounters and findings","text":"Two documentation purposes per appointment, care (Vorsorge, Nachtarbeit, Beratung) and fitness (Eignung, FSÜ, StrlSchV, JArbSchG) (D-12); findings stored as one JSON document per version, validated against the versioned template (D-51)."}],"doc":"docs/plan/03-domain-model.md"},{"id":"rules","title":"Vorsorge rules and catalogue","short":"Vorsorge rules","lead":"The catalogue seeds proposals that the physician can override; the AMR 2.1 maxima are never exceeded. Medical rules are defaults, never diagnostic advice.","points":[{"title":"Intervals (AMR 2.1 Nr. 3)","text":"Erstvorsorge within 3 months before taking up the activity; zweite Vorsorge at the latest 6, 12 or 24 months after Beginn depending on the Anlass; every further one at the latest 36 months after the previous; only shorter intervals are allowed. Text from the BGN mirror; the baua.de PDF is checked by hand before go-live (04 §8)."},{"title":"Interpretations signed off in M2","text":"Where the text leaves room the engine follows a recommendation the physician signs off on the case files: überfällig after the due month (D-15), declined Erstangebot keeps its position (D-16), unknown Beginn and legacy history (D-18), Ruhen and return (D-19), no later month than the maximum and n. n. only with an activity end (D-20)."},{"title":"Catalogue maintenance","text":"Own Kürzel with the former G-number as search alias (D-22); rule versions with valid_from; a twice-yearly review of AMR, ArbMedVV and STIKO changes; a rule change shows how many Fristen move and needs the physician's approval."},{"title":"Eignung and other tracks","text":"Eignung stays separate from Vorsorge (§ 3 Abs. 3 ArbMedVV). Nachtarbeit (§ 6 Abs. 3 ArbZG), JArbSchG (§ 33) and StrlSchV (only if a physician is ermächtigt) have their own rules and are not bundled automatically (D-17); FSÜ intervals are not seeded until the current DGUV Empfehlung is in hand (D-21)."},{"title":"Immunity","text":"Status per disease, evidence, titer values, booster and titer deadlines, Masern-Nachweis (D-60); documented immunity does not stop the Biostoff Vorsorge cycle (D-61); the assistant sees only a neutral Impfstatus-Termin (D-62); thresholds are physician-confirmed defaults."},{"title":"Nachgehende Vorsorge (minimal)","text":"In M2 the event exposure ended creates the follow-up need (e.g. KMR-N), and marking a person ausgeschieden creates a transfer-consent task; the full nachgehende Vorsorge comes later."}],"doc":"docs/plan/04-vorsorge-rules.md"},{"id":"documents","title":"Documents and exports","short":"Documents","lead":"Anything addressed to the employer is built from master data, organisational data and the catalogue only, never from findings, lab values or medical free text.","points":[{"title":"Vorsorgebescheinigung","text":"Per AMR 6.3 in two copies with identical fields for employee and employer, as § 6 Abs. 3 Nr. 3 ArbMedVV requires a certificate for both; medical details for the Proband go only into a separate Ergebnismitteilung. A reprint is byte-identical to the archived PDF."},{"title":"Delivery of employer copies","text":"Both copies are created at every release; the Proband takes one on site, and a monthly Sammelversand per Kunde picks up every employer copy not yet delivered; each delivery is logged (D-42). With two employers each copy lists only that Kunde's Anlässe (D-43)."},{"title":"Eignungsbeurteilung","text":"Employer copy only with a scanned written consent; the software prints a prefilled consent form with the document number as QR code so the scan links itself (D-46, eignungConsent F9)."},{"title":"Fälligkeitsliste","text":"Per Kunde with the columns the practice chose (Name, Vorname, Geburtsdatum, Abteilung/Station, Pflicht/Angebot, Status), one row per Proband and Beschäftigung (D-23), as PDF and Excel; every export logged; sent encrypted (D-40)."},{"title":"Rendering","text":"pdfmake 0.3 in browser and Node, PDF/A-2b, pdf-lib for batch merging; letterhead, logo and signature from the practice's empty templates (P-3, P-4); signature mode set per document type (D-45)."},{"title":"Further outputs","text":"Invitations, § 6 Abs. 4 Mitteilung, Nachtarbeit certificate, Immunstatus letter and Masern-Zeugnis, Strahlenschutz certificate if ermächtigt, AMR 3.4 telemedicine notice, Kartei export and Kartei-Auszug at Austritt, Leistungsnachweis for the external e-invoicing tool, annual report as editable .docx."}],"doc":"docs/plan/05-documents.md"},{"id":"privacy","title":"Security and data protection","short":"Data protection","lead":"Health data under Art. 9 GDPR and § 203 StGB; checklist SEC-01 to SEC-90 with the gates RD (before real data) and GL (before go-live).","points":[{"title":"Login","text":"Password plus second factor at every login (TOTP for everyone, FIDO2 keys for owners, ten printed recovery codes, no SMS; D-33), server-side sessions, logout after 60 minutes idle (autoLogout J4), step-up for exports and archive downloads."},{"title":"The assistant never sees findings","text":"Enforced in four layers: data classes, a policy module per route, database roles and sentinel tests as a release gate. Medical attachments are not listed for the assistant at all, not even type and date."},{"title":"Contracts before real data","text":"The practice holds hosting contracts and AVVs (D-35); developer and second technician sign Art. 28 terms and a § 203 undertaking; VVT and a full DPIA with the DPO's written statement are dated before the first import (D-39)."},{"title":"Encryption","text":"TLS, an encrypted vault for database, files and keys, application-level encryption of documents (D-34); offline packages encrypted with passphrase plus a non-extractable device key, valid until Sprechtag plus 72 hours and wiped after sync (D-55, D-56)."},{"title":"Audit and emergency access","text":"Hash-chained log of reads, exports and logins with a nightly verification; access events kept 3 years (D-38). The deputy account is pre-enrolled and activated by an owner or by a sealed emergency code, which notifies all owners (D-36)."},{"title":"Development without real data","text":"Synthetic data only until RD and on staging forever (SEC-50); a production problem is reproduced with synthetic data; support access to a real record only with a physician's grant of at most 24 hours, logged."},{"title":"Retention","text":"Retention per data class and Anlass (up to 40 years for carcinogenic substances), deletion proposals confirmed by an owner; imported persons never seen are proposed for deletion 12 months after ausgeschieden (D-27)."}],"doc":"docs/plan/06-security-privacy.md"},{"id":"operations","title":"Operations, costs and rollout","short":"Operations","lead":"Run by one part-time operator: few containers, runbooks, monitoring, a named second technician and a paper fallback for a day's outage.","points":[{"title":"Running costs","text":"About 13 EUR gross a month during development, about 39–40 EUR from GL1 (production and staging servers, Storage Box, domain and mailbox, quarterly restore drill) against the 50 EUR budget (runCost L3). An e-invoicing tool's fee is not inclu
