<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<title>Umsetzungsplan Praxissoftware Arbeitsmedizin</title>
<meta name="description" content="Überblick über den Umsetzungsplan einer Praxissoftware für die arbeitsmedizinische Vorsorge, mit Kommentaren und Entscheidungen.">
<meta property="og:type" content="website">
<meta property="og:title" content="Umsetzungsplan Praxissoftware Arbeitsmedizin">
<meta property="og:description" content="Der Plan im Überblick – kommentieren, offene Punkte entscheiden, Rückmeldung als Datei zurückschicken.">
<meta name="theme-color" content="#0b6e66">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%230b6e66'/%3E%3Cpath d='M18 20h28M18 32h28M18 44h16' fill='none' stroke='white' stroke-width='6' stroke-linecap='round'/%3E%3C/svg%3E">
<style>
:root{
  --bg:#f4f6f5;--surface:#ffffff;--surface-2:#f0f4f3;--surface-3:#e4ebe9;
  --text:#16201e;--text-2:#3d4b48;--muted:#5f6e6a;--line:#dbe3e0;--line-strong:#c2cfcb;
  --primary:#0b6e66;--primary-hover:#085a53;--primary-ink:#ffffff;--primary-soft:#e1f1ee;--primary-line:#94cbc2;
  --star:#a24d07;--star-soft:#fcefdf;
  --ok:#147a3c;--ok-soft:#e4f4e9;--warn:#8c5d00;--warn-soft:#fbf1d6;--bad:#b42318;--bad-soft:#fcebe9;
  --focus:#1d4ed8;
  --shadow:0 1px 2px rgba(14,30,27,.05),0 8px 28px rgba(14,30,27,.06);
  color-scheme:light;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#0d1312;--surface:#141c1a;--surface-2:#1a2422;--surface-3:#24312e;
    --text:#e4edea;--text-2:#b8c7c3;--muted:#8d9e9a;--line:#27332f;--line-strong:#37463f;
    --primary:#4cc2b2;--primary-hover:#6fd3c5;--primary-ink:#05221e;--primary-soft:#123430;--primary-line:#2c6b62;
    --star:#f2a65a;--star-soft:#33240f;
    --ok:#62d38e;--ok-soft:#132c1d;--warn:#efc54d;--warn-soft:#2d2611;--bad:#ff8b80;--bad-soft:#351716;
    --focus:#7aa7ff;
    --shadow:0 1px 2px rgba(0,0,0,.35),0 8px 28px rgba(0,0,0,.25);
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0d1312;--surface:#141c1a;--surface-2:#1a2422;--surface-3:#24312e;
  --text:#e4edea;--text-2:#b8c7c3;--muted:#8d9e9a;--line:#27332f;--line-strong:#37463f;
  --primary:#4cc2b2;--primary-hover:#6fd3c5;--primary-ink:#05221e;--primary-soft:#123430;--primary-line:#2c6b62;
  --star:#f2a65a;--star-soft:#33240f;
  --ok:#62d38e;--ok-soft:#132c1d;--warn:#efc54d;--warn-soft:#2d2611;--bad:#ff8b80;--bad-soft:#351716;
  --focus:#7aa7ff;
  --shadow:0 1px 2px rgba(0,0,0,.35),0 8px 28px rgba(0,0,0,.25);
  color-scheme:dark;
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%;scroll-behavior:smooth;scroll-padding-top:20px}
@media (max-width:960px){html{scroll-padding-top:76px}}
@media (prefers-reduced-motion:reduce){html{scroll-behavior:auto}*{transition:none!important}}
body{margin:0;background:var(--bg);color:var(--text);font:16px/1.55 system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;-webkit-font-smoothing:antialiased;overflow-wrap:break-word}
h1,h2,h3{line-height:1.2;margin:0;letter-spacing:-.01em}
p{margin:0 0 .7em}
a{color:var(--primary)}
b,strong{font-weight:650}
.skip{position:absolute;left:-9999px}
.skip:focus{left:16px;top:16px;z-index:100;background:var(--surface);padding:8px 12px;border-radius:8px}
svg.i{width:18px;height:18px;flex:none;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}

/* Kopfbereich */
.hero{background:linear-gradient(180deg,var(--surface) 0%,var(--bg) 100%);border-bottom:1px solid var(--line)}
.hero-inner{max-width:1180px;margin:0 auto;padding:48px 24px 32px}
.eyebrow{font-size:.78rem;font-weight:700;letter-spacing:.09em;text-transform:uppercase;color:var(--primary);margin:0}
.hero h1{font-size:clamp(1.75rem,3.4vw,2.6rem);margin:.45rem 0 .5rem;font-weight:750}
.sub{font-size:1.08rem;color:var(--text-2);font-weight:600;margin:0 0 .8rem}
.lead{font-size:1.1rem;color:var(--text-2);max-width:72ch}
.steps{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px;margin:26px 0 14px}
.step{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:16px 18px;color:var(--text-2);font-size:.95rem}
.step b{display:block;color:var(--text);margin-bottom:3px;font-size:1rem}
.step .n{display:inline-grid;place-items:center;width:26px;height:26px;border-radius:50%;background:var(--primary);color:var(--primary-ink);font-weight:700;font-size:.85rem;margin-bottom:8px}
.meta-row{display:flex;flex-wrap:wrap;gap:6px 20px;color:var(--muted);font-size:.92rem;margin:0 0 16px}
.meta-row span{display:inline-flex;align-items:center;gap:7px}
.notice{display:flex;gap:12px;align-items:flex-start;background:var(--warn-soft);border:1px solid color-mix(in srgb,var(--warn) 30%,transparent);border-radius:12px;padding:12px 14px;font-size:.93rem;color:var(--text);max-width:900px}
.notice svg{color:var(--warn);margin-top:2px}
.notice p{margin:0}
.hero-controls{display:flex;flex-wrap:wrap;gap:14px 28px;align-items:flex-end;margin-top:22px}
.field{display:flex;flex-direction:column;gap:5px;font-size:.88rem;color:var(--muted);min-width:240px}
.field.lang{min-width:0}
.save{font-size:.86rem;color:var(--muted);display:inline-flex;align-items:center;gap:6px;padding-bottom:9px}
.save.bad{color:var(--bad)}
.save::before{content:"";width:8px;height:8px;border-radius:50%;background:var(--line-strong)}
.save.ok::before{background:var(--ok)}
.save.bad::before{background:var(--bad)}
.seg{display:inline-flex;border:1px solid var(--line-strong);border-radius:10px;overflow:hidden;background:var(--surface)}
.seg label{position:relative;display:flex}
.seg input{position:absolute;opacity:0;width:1px;height:1px;margin:0}
.seg span{display:block;padding:9px 14px;font-size:.92rem;cursor:pointer;border-left:1px solid var(--line);white-space:nowrap;color:var(--text-2);user-select:none;-webkit-user-select:none}
.seg label:first-child span{border-left:0}
.seg label:hover span{background:var(--surface-2)}
.seg input:checked+span{background:var(--primary);color:var(--primary-ink);font-weight:650}
.seg input:focus-visible+span{outline:2px solid var(--focus);outline-offset:-3px}

/* Layout */
.layout{max-width:1180px;margin:0 auto;padding:28px 24px 120px;display:grid;grid-template-columns:250px minmax(0,1fr);gap:32px;align-items:start}
.toc{position:sticky;top:16px;max-height:calc(100vh - 32px);overflow:auto;padding:2px 4px 8px 2px}
.prog{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:14px 14px 12px;margin-bottom:14px}
.prog-top{display:flex;justify-content:space-between;align-items:baseline;font-size:.9rem;margin-bottom:8px}
.prog-top .pct{font-weight:700;color:var(--primary);font-variant-numeric:tabular-nums}
.bar{height:8px;border-radius:999px;background:var(--surface-3);overflow:hidden}
.bar i{display:block;height:100%;width:0;background:var(--primary);border-radius:999px;transition:width .3s}
.prog small{display:block;margin-top:7px;color:var(--muted);font-size:.8rem}
.prog small+small{margin-top:2px}
.toc-list{list-style:none;margin:0 0 14px;padding:0}
.toc-list a{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:7px 10px;border-radius:9px;color:var(--text-2);text-decoration:none;font-size:.92rem}
.toc-list a:hover{background:var(--surface-2);color:var(--text)}
.toc-list a.active{background:var(--primary-soft);color:var(--text);font-weight:600}
.toc-list .tl{display:inline-block;width:1.6em;color:var(--muted);font-weight:700}
.toc-list .cnt{color:var(--muted);font-variant-numeric:tabular-nums;font-size:.78rem;white-space:nowrap}
.toc-list a.done .cnt{color:var(--ok);font-weight:700}
.toc .btn{width:100%;justify-content:center}

/* Mobile Leiste */
.mbar{display:none;position:sticky;top:0;z-index:20;background:color-mix(in srgb,var(--surface) 92%,transparent);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);border-bottom:1px solid var(--line);padding:10px 16px;align-items:center;gap:12px}
.mnav{position:relative}
.mnav summary{list-style:none;cursor:pointer;display:inline-flex;align-items:center;gap:6px;font-weight:600;font-size:.92rem;padding:7px 11px;border:1px solid var(--line-strong);border-radius:9px;background:var(--surface)}
.mnav summary::-webkit-details-marker{display:none}
.mnav .toc-list{position:absolute;top:calc(100% + 8px);left:0;width:min(330px,calc(100vw - 32px));max-height:70vh;overflow:auto;background:var(--surface);border:1px solid var(--line);border-radius:12px;box-shadow:var(--shadow);padding:6px;margin:0}
.mprog{flex:1;display:flex;align-items:center;gap:8px;min-width:0}
.mprog .bar{flex:1}
.mprog .pct{font-size:.85rem;font-weight:700;color:var(--primary);font-variant-numeric:tabular-nums}
@media (max-width:960px){
  .layout{grid-template-columns:minmax(0,1fr);padding:18px 16px 110px}
  .toc{display:none}
  .mbar{display:flex}
  .hero-inner{padding:32px 16px 24px}
}
@media (max-width:760px){.steps{grid-template-columns:minmax(0,1fr)}}

/* Abschnitte */
.sec{background:var(--surface);border:1px solid var(--line);border-radius:18px;box-shadow:var(--shadow);margin-bottom:28px;overflow:hidden}
.sec-head{padding:26px 32px 20px;border-bottom:1px solid var(--line);background:linear-gradient(180deg,var(--surface-2),var(--surface))}
.sec-head h2{font-size:1.38rem;display:flex;align-items:center;gap:12px;font-weight:720}
.sec-letter{display:inline-grid;place-items:center;min-width:34px;height:34px;padding:0 6px;border-radius:10px;background:var(--primary);color:var(--primary-ink);font-weight:750;font-size:1rem;flex:none}
.sec-intro{color:var(--text-2);margin:10px 0 0;max-width:74ch}
.sec-body{padding:6px 32px 26px}
@media (max-width:600px){.sec-head{padding:20px 18px 16px}.sec-body{padding:2px 18px 20px}.sec-head h2{font-size:1.2rem}}
.prose{max-width:78ch;padding-top:16px}
.prose p{color:var(--text-2)}
.note-block{margin-top:14px}
.note-block label{display:block;font-size:.88rem;color:var(--muted);margin:0 0 6px;font-weight:600}
.points{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:12px;margin:18px 0 6px}
.point{border:1px solid var(--line);background:var(--surface-2);border-radius:12px;padding:14px 16px;font-size:.94rem;color:var(--text-2)}
.point b{display:block;color:var(--text);margin-bottom:4px;font-size:.99rem}
.doc{font-size:.86rem;color:var(--muted);margin:12px 0 0}
code{font:.84rem/1.4 ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;background:var(--surface-2);border:1px solid var(--line);border-radius:6px;padding:1px 6px}
.feedback{border-top:1px solid var(--line);margin-top:18px}

/* Fragen, Optionen */
.q{padding:22px 0;border-top:1px solid var(--line)}
.sec-body>.q:first-child{border-top:0}
.q-title{display:flex;gap:10px;align-items:baseline;font-weight:620;font-size:1.03rem;margin:0 0 4px;line-height:1.4}
.q-id{flex:none;font-size:.74rem;font-weight:750;color:var(--muted);background:var(--surface-2);border:1px solid var(--line);border-radius:6px;padding:1px 6px;font-variant-numeric:tabular-nums;position:relative;top:-1px;min-width:2.6em;text-align:center}
.q.answered .q-id,.dec.decided .q-id{background:var(--primary-soft);border-color:var(--primary-line);color:var(--primary)}
.q-help{color:var(--text-2);font-size:.93rem;margin:4px 0 10px;max-width:76ch}
.opts{display:flex;flex-wrap:wrap;gap:8px}
.opt{position:relative;display:inline-flex;max-width:100%}
.opt input{position:absolute;opacity:0;width:1px;height:1px;margin:0}
.opt .box{position:relative;display:inline-flex;align-items:center;gap:10px;min-height:40px;padding:8px 14px 8px 12px;border:1px solid var(--line-strong);border-radius:10px;background:var(--surface);color:var(--text);cursor:pointer;user-select:none;-webkit-user-select:none;transition:background .12s,border-color .12s,box-shadow .12s;font-size:.95rem;line-height:1.35}
.opt .box::before{content:"";flex:none;width:16px;height:16px;border:1.5px solid var(--line-strong);border-radius:50%;background:var(--surface);transition:background .12s,border-color .12s,box-shadow .12s}
.opt:hover .box{border-color:var(--primary-line);background:var(--surface-2)}
.opt input:checked+.box{border-color:var(--primary);background:var(--primary-soft);box-shadow:inset 0 0 0 1px var(--primary)}
.opt input:checked+.box::before{border-color:var(--primary);background:var(--primary);box-shadow:inset 0 0 0 3px var(--surface)}
.opt input:focus-visible+.box{outline:2px solid var(--focus);outline-offset:2px}
.opts.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:10px}
.opts.cards .opt{display:flex}
.opts.cards .opt .box{display:block;width:100%;padding:14px 16px 14px 44px;border-radius:12px}
.opts.cards .opt .box::before{position:absolute;left:16px;top:16px}
.opts.cards .opt .t{display:block;font-weight:640}
.opt .pc{display:block;margin-top:6px;color:var(--text-2);font-size:.86rem;line-height:1.45}
.opt .pc b{color:var(--text);font-weight:650}
.rec{display:inline-block;font-style:normal;font-size:.7rem;font-weight:750;color:var(--primary);background:var(--primary-soft);border:1px solid var(--primary-line);border-radius:999px;padding:0 7px;margin-left:6px;vertical-align:1px}
.grp-h{font-size:.76rem;text-transform:uppercase;letter-spacing:.07em;color:var(--muted);font-weight:750;margin:0 0 4px}

.inp,textarea{width:100%;font:inherit;font-size:.97rem;color:var(--text);background:var(--surface);border:1px solid var(--line-strong);border-radius:10px;padding:10px 12px;transition:border-color .12s,box-shadow .12s}
textarea{min-height:92px;resize:vertical;line-height:1.5;display:block}
textarea.compact{min-height:56px}
.inp:focus,textarea:focus{outline:none;border-color:var(--primary);box-shadow:0 0 0 3px color-mix(in srgb,var(--primary) 22%,transparent)}
::placeholder{color:var(--muted);opacity:.85}

/* Einschätzung */
.rate{display:flex;flex-wrap:wrap;gap:8px;margin-top:14px;align-items:center}
.rate .lbl{font-size:.86rem;color:var(--muted);margin-right:2px}
.rbtn{position:relative;display:inline-flex}
.rbtn input{position:absolute;opacity:0;width:1px;height:1px;margin:0}
.rbtn span{display:inline-flex;align-items:center;gap:6px;padding:6px 13px;border-radius:999px;border:1px solid var(--line-strong);font-size:.9rem;cursor:pointer;background:var(--surface);user-select:none;-webkit-user-select:none}
.rbtn:hover span{background:var(--surface-2)}
.rbtn input:focus-visible+span{outline:2px solid var(--focus);outline-offset:2px}
.rbtn input[value=ok]:checked+span{background:var(--ok-soft);border-color:var(--ok);color:var(--ok);font-weight:650}
.rbtn input[value=partly]:checked+span{background:var(--warn-soft);border-color:var(--warn);color:var(--warn);font-weight:650}
.rbtn input[value=wrong]:checked+span{background:var(--bad-soft);border-color:var(--bad);color:var(--bad);font-weight:650}
.feedback textarea{margin-top:10px}

/* Chips */
.chips{display:flex;flex-wrap:wrap;gap:6px;margin:8px 0 10px}
.chip{display:inline-flex;align-items:center;gap:5px;font-size:.75rem;font-weight:700;border-radius:12px;padding:2px 9px;background:var(--surface-2);border:1px solid var(--line);color:var(--text-2);line-height:1.5;max-width:100%;overflow-wrap:anywhere}
.chip.own-practice{background:var(--star-soft);border-color:color-mix(in srgb,var(--star) 35%,transparent);color:var(--star)}
.chip.own-developer{background:var(--primary-soft);border-color:var(--primary-line);color:var(--primary)}
.chip.lvl-high{background:var(--bad-soft);border-color:color-mix(in srgb,var(--bad) 30%,transparent);color:var(--bad)}
.chip.lvl-medium{background:var(--warn-soft);border-color:color-mix(in srgb,var(--warn) 30%,transparent);color:var(--warn)}
.chip.lvl-low{background:var(--ok-soft);border-color:color-mix(in srgb,var(--ok) 30%,transparent);color:var(--ok)}
.chip.st-done{background:var(--ok-soft);border-color:color-mix(in srgb,var(--ok) 30%,transparent);color:var(--ok)}
.q-title .chip{margin-left:6px;vertical-align:1px}

/* Fahrplan */
.ms-list{list-style:none;margin:20px 0 0;padding:0}
.ms{position:relative;padding:0 0 26px 52px}
.ms::before{content:"";position:absolute;left:17px;top:40px;bottom:6px;width:2px;background:var(--line)}
.ms:last-child{padding-bottom:4px}
.ms:last-child::before{display:none}
.ms-id{position:absolute;left:0;top:0;display:inline-grid;place-items:center;width:36px;height:36px;border-radius:10px;background:var(--primary-soft);border:1px solid var(--primary-line);color:var(--primary);font-weight:750;font-size:.84rem}
.ms-head{display:flex;flex-wrap:wrap;align-items:center;gap:6px 12px;min-height:36px}
.ms-head h3{font-size:1.08rem;font-weight:680}
.ms-goal{color:var(--text-2);margin:6px 0 10px;max-width:78ch}
.ms-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:4px 24px;font-size:.92rem;color:var(--text-2)}
.ms-grid ul{margin:.1em 0 .6em;padding-left:1.15em}
.ms-grid li{margin:.2em 0}
.ms-grid li::marker{color:var(--primary)}
.ms-demo{font-size:.92rem;color:var(--text-2);margin:2px 0 4px}
.ms-dep{font-size:.85rem;color:var(--muted);margin:0 0 4px}
.ms textarea{margin-top:10px}

/* Entscheidungen */
.filters{display:flex;flex-wrap:wrap;gap:8px;margin:18px 0 6px}
.fbtn{font:inherit;font-size:.88rem;font-weight:620;padding:6px 12px;border-radius:999px;border:1px solid var(--line-strong);background:var(--surface);color:var(--text-2);cursor:pointer}
.fbtn:hover{background:var(--surface-2)}
.fbtn.on{background:var(--primary);border-color:var(--primary);color:var(--primary-ink)}
.fbtn .fc{font-variant-numeric:tabular-nums;opacity:.8;margin-left:2px}
.fbtn:focus-visible{outline:2px solid var(--focus);outline-offset:2px}
.dec{padding:22px 0;border-top:1px solid var(--line)}
.dec-list>.dec:first-child{border-top:0}
.dec[hidden]{display:none}
.dec-head{display:flex;gap:10px;align-items:baseline}
.dec-head h3{font-size:1.06rem;font-weight:680;line-height:1.35}
.dec-q{font-weight:600;margin:0 0 6px;max-width:80ch}
.dec-ctx{color:var(--text-2);font-size:.94rem;max-width:80ch;margin:0 0 12px}
.dec-why{font-size:.92rem;color:var(--text-2);margin:12px 0 0;max-width:80ch}
.dec textarea{margin-top:10px}
.empty{color:var(--muted);font-size:.93rem;padding:14px 0 0}

/* Risiken */
.risk-list{list-style:none;margin:14px 0 14px;padding:0}
.risk-list li{display:flex;gap:12px;align-items:flex-start;padding:12px 0;border-top:1px solid var(--line)}
.risk-list li:first-child{border-top:0}
.risk-list .chip{margin-top:2px;min-width:72px;justify-content:center}
.risk-list .rt{display:block;font-weight:640}
.risk-list .rm{display:block;color:var(--text-2);font-size:.93rem}

/* Abschluss */
.howto{margin:4px 0 18px;padding-left:1.2em;color:var(--text-2)}
.howto li{margin:.35em 0}
.howto b{color:var(--text)}
.final-count{display:flex;align-items:center;gap:14px;margin:18px 0 16px;flex-wrap:wrap}
.final-count .bar{flex:1;min-width:160px;max-width:420px}
.btns{display:flex;flex-wrap:wrap;gap:10px}
.btn{display:inline-flex;align-items:center;gap:8px;font:inherit;font-size:.95rem;font-weight:620;padding:10px 16px;border-radius:10px;border:1px solid var(--line-strong);background:var(--surface);color:var(--text);cursor:pointer;text-decoration:none;line-height:1.2}
.btn:hover{background:var(--surface-2)}
.btn.primary{background:var(--primary);border-color:var(--primary);color:var(--primary-ink)}
.btn.primary:hover{background:var(--primary-hover);border-color:var(--primary-hover)}
.btn.danger{color:var(--bad)}
.btn.sm{padding:7px 12px;font-size:.88rem}
.btn:focus-visible{outline:2px solid var(--focus);outline-offset:2px}
.more{margin-top:22px;border-top:1px solid var(--line);padding-top:16px}
.more summary{cursor:pointer;color:var(--text-2);font-weight:600;font-size:.93rem}
.more p{color:var(--text-2);font-size:.93rem;margin:10px 0 12px}

<script>
const PLAN_DATA = {"de":{"lang":"de","title":"Umsetzungsplan Praxissoftware Arbeitsmedizin","subtitle":"Übersicht zur Durchsicht durch die Praxis: Umfang, Technik, Fahrplan M0 bis M9, 64 offene Entscheidungen, offene Fragen und Risiken.","asOf":"2026-11-07","intro":"Diese Seite fasst den ausführlichen Umsetzungsplan auf einer Seite zusammen. Bitte lesen Sie die Übersicht und die sieben Kapitel, bewerten Sie jedes Kapitel und kommentieren Sie Meilensteine und Risiken. Wählen Sie bei jeder Entscheidung D-01 bis D-64 eine Option (gebaut wird nach der Empfehlung, bis Sie anders entscheiden) und beantworten Sie die offenen Fragen, soweit Sie können. Am Ende laden Sie Ihre Rückmeldung als Textdatei herunter; sie wird in den Plan übernommen.","summary":["Version 1 ist eine digitale Vorsorgekartei nach ArbMedVV für Ihre Praxis mit 16–40 Kunden und 5.000–15.000 Probanden: Kunden mit Standorten und Stationen, Probanden mit Beschäftigungen, eine Fristenberechnung, die je Proband und Vorsorgeanlass den nächsten Monat vorschlägt (nach AMR 2.1, monatsgenau, „bald fällig“ drei Monate vorher, mehrere Anlässe auf den frühesten Termin gebündelt), der Import der Personallisten Ihrer Kunden, Fälligkeitslisten, Sprechtagsplanung, beide Vorsorgebescheinigungen nach AMR 6.3, strukturierte Befunddokumentation mit Normalbefund, ein Offline-Sprechtag auf dem Laptop, Laborbefunde mit Immunstatus, E-Mail-Erinnerungen und der Jahresbericht. Abrechnung, Portale, Online-Terminbuchung und die Vorab-Anamnese durch den Probanden folgen später; TI/ePA und ein Impfbuch sind nicht vorgesehen.","Die Software kommt in Schritten, damit zuerst das entlastet wird, was Sie am meisten Zeit kostet, nämlich die Fristen: „Kartei und Fristen“ mit dem ersten Pilotkunden ab Oktober 2027, Sprechtag und Bescheinigungen im Januar 2028, Befunddokumentation und Offline-Sprechtag vor Ort im Juni 2028, danach Labor und Immunstatus sowie Erinnerungen und Jahresbericht bis November 2028. Diese Termine gelten bei 20 Entwicklungsstunden pro Woche. Bis die tatsächlichen Stunden gemessen sind, planen Sie bitte mit den späten Terminen: erster Echtbetrieb Ende November 2027, Offline vor Ort Ende September 2028, Version 1 vollständig im März 2029.","Technisch läuft die Software im Browser und lässt sich auf Laptops wie ein Programm installieren. Server und Daten liegen in einem Rechenzentrum in Nürnberg; Datenbank und Dokumente sind verschlüsselt. Jede Stunde wird verschlüsselt bei einem zweiten deutschen Anbieter gesichert, und einmal pro Woche laden Sie ein verschlüsseltes Archiv mit allen Daten selbst herunter. Die laufenden Kosten liegen ab dem Echtbetrieb bei etwa 39–40 EUR brutto im Monat, also unter Ihrer Grenze von 50 EUR.","Die Verwaltung sieht nie Befunde. Das wird nicht nur in der Oberfläche, sondern in der Datenbank selbst durchgesetzt und vor jeder neuen Version automatisch geprüft. Auf dem Laptop liegen Gesundheitsdaten nur für einen Sprechtag, verschlüsselt und mit eigenem Kennwort geschützt; nach dem Abgleich werden sie gelöscht.","Bevor echte Daten in das System kommen, müssen die Verträge stehen: Konten beim Anbieter auf den Namen der Praxis, Auftragsverarbeitungsverträge, eine Verschwiegenheitsverpflichtung nach § 203 StGB für alle, die technisch Zugriff haben, das Verzeichnis der Verarbeitungstätigkeiten und die Datenschutz-Folgenabschätzung mit Stellungnahme Ihres Datenschutzbeauftragten. Bis dahin wird ausschließlich mit erfundenen Probanden gearbeitet. Als Erstes und unabhängig davon: Bitte klären Sie bis 15.12.2026 mit Ihrem Steuerberater, ob Sie ab 01.01.2027 E-Rechnungen ausstellen müssen.","Die größten Risiken sind die verfügbare Entwicklungszeit, Personallisten ohne Geburtsdatum (dadurch können Personen verwechselt werden), die Qualität der übernommenen Fristenlisten, verspätete Verträge und dass der Betrieb an einer Person hängt. Für jedes Risiko ist eine Gegenmaßnahme geplant. Entscheidungen werden jeweils in der Vorführung vor dem betroffenen Meilenstein besprochen; kommt innerhalb von zwei Wochen keine Antwort, gilt die Empfehlung."],"sections":[{"id":"scope","title":"Umfang und Anforderungen","short":"Umfang","lead":"Was Version 1 können muss, für wen und in welchem Schritt. Grundlage sind Ihre Antworten im Fragebogen.","points":[{"title":"Wer arbeitet damit","text":"Ärztinnen und Ärzte, die Verwaltung, eine Vertretungsärztin oder ein Vertretungsarzt (nur im Notfall freigeschaltet) und der technische Betrieb (ohne Einblick in Probandenakten, außer eine Ärztin oder ein Arzt gibt eine Akte zeitlich begrenzt frei). Heute zwei, in zwei Jahren fünf oder mehr Benutzer; nur für Ihre Praxis, nicht für andere."},{"title":"Reihenfolge der Schritte","text":"1. Kartei und Fristen, 2. Sprechtag und Bescheinigungen, 3. Befunddokumentation am Bildschirm, 4. Vor Ort digital mit Offline-Sprechtag, 5. Labor und Immunstatus, 6. Erinnerungen und Jahresbericht. Ob diese Reihenfolge so bleibt, entscheiden Sie mit D-01, D-30 und D-50."},{"title":"Was nicht in Version 1 kommt","text":"Später: Online-Terminbuchung, Vorab-Anamnese durch den Probanden, Abrechnung und E-Rechnung in der Software, Portale für Kunden und Probanden, SMS, Schnittstelle zur Personalabteilung, Einsatzzeiten und Begehungen. Nicht vorgesehen: TI/ePA und ein Impfbuch mit Chargen, da Sie nicht selbst impfen."},{"title":"Prüfbare Anforderungen","text":"Jede Anforderung hat eine Nummer und Abnahmekriterien. Jedes Kriterium wird als automatischer Test hinterlegt, sodass bei jeder Änderung geprüft wird, ob alles Vereinbarte noch funktioniert."},{"title":"Tempo","text":"Eine Standard-Vorsorge soll in höchstens sechs Bedienschritten und im Mittel in 60 Sekunden dokumentiert sein. Eine Akte öffnet in unter einer Sekunde, die Suche antwortet in unter 0,3 Sekunden, auch bei 30.000 Probanden."},{"title":"Widersprüche in den Antworten","text":"Einige Antworten passen nicht ganz zusammen, etwa der Abgleich über Personalnummer und Geburtsdatum bei Listen ohne diese Spalten, oder E-Rechnung „dringend“, Abrechnung aber „später“. Diese Punkte sind als Entscheidungen aufgeführt (z. B. D-24, D-08, D-52, D-54, D-57, D-60, D-63)."}],"doc":"docs/plan/01-requirements.md"},{"id":"architecture","title":"Technik und Aufbau","short":"Technik","lead":"Eine Programmiersprache, ein Server, eine Datenbank und möglichst wenige Bausteine, damit die Software mit geringem Aufwand betrieben werden kann.","points":[{"title":"Im Browser, installierbar","text":"Die Software läuft im Browser (Chrome, Edge, Safari) und lässt sich als App installieren (PWA, „Progressive Web App“). Server und Oberfläche sind in TypeScript geschrieben, einer verbreiteten Sprache, die auch eine spätere Nachfolge leicht übernehmen kann. Die Wahl ist Entscheidung D-02."},{"title":"Server in Deutschland","text":"Ein gemieteter Server bei netcup in Nürnberg für den Echtbetrieb und ein kleinerer für Tests mit erfundenen Daten. Datenbank, Dokumente und Schlüssel liegen in einem verschlüsselten Bereich; stündliche verschlüsselte Sicherungen gehen zu Hetzner, einem zweiten deutschen Anbieter (D-03, D-34)."},{"title":"Befunde technisch getrennt","text":"Medizinische Daten liegen in einem eigenen Bereich der Datenbank. Die Verwaltung arbeitet mit einer Datenbankrolle, die auf diesen Bereich gar keinen Zugriff hat. Vor jeder Version prüfen automatische Tests mit Prüfwörtern in allen Befundfeldern, dass in keiner Ansicht, Liste, Datei oder E-Mail für die Verwaltung oder den Arbeitgeber etwas davon erscheint."},{"title":"Offline-Sprechtag","text":"Vor dem Sprechtag lädt der Laptop ein verschlüsseltes Paket nur für diesen Tag: Teilnehmer mit Vorgeschichte, ein Verzeichnis der Beschäftigten am Standort (nur Name, Geburtsdatum, Station), Vorlagen und Unterschrift. Vor Ort dokumentieren und drucken Sie ohne Internet; danach wird alles übertragen. Derselbe Übertragungsweg wird vom ersten Echtbetrieb an täglich im Büro genutzt und ist dadurch erprobt, bevor der Laptop offline geht."},{"title":"Gleiche Berechnung überall","text":"Fristenberechnung und Bescheinigungsdruck laufen auf dem Server und auf dem Laptop mit demselben Programmcode. Auch spontan erscheinende Beschäftigte bekommen offline eine korrekte Bescheinigung (D-05)."},{"title":"Frühe Machbarkeitstests","text":"Bevor Funktionen gebaut werden, wird geprüft, dass Offline-Speicherung und Drucken auf Windows- und Mac-Laptops funktionieren und dass Bescheinigungen schnell und archivtauglich (PDF/A) erzeugt werden: 300 Bescheinigungen in unter einer Minute."},{"title":"Sorgfalt bei Fremdbausteinen","text":"Verwendet werden nur ausgereifte Versionen fremder Programmbausteine; Aktualisierungen werden erst nach einer Wartezeit und nach automatischen Sicherheitsprüfungen übernommen."}],"doc":"docs/plan/02-architecture.md"},{"id":"domain","title":"Datenmodell und Abläufe","short":"Datenmodell","lead":"Wie Kunden, Probanden, Vorsorgeanlässe, Fristen und Vorsorgen in der Software abgebildet und berechnet werden.","points":[{"title":"Kunden und Probanden","text":"Unternehmen/Träger, darunter Standorte und Abteilungen/Stationen, dazu die Kostenstelle. Die Akte gehört dem Probanden, nicht dem Arbeitgeber: Wer bei zwei Kunden arbeitet, hat eine Akte mit zwei Beschäftigungen. Probandennummern werden neu vergeben."},{"title":"Anlässe und Tätigkeitsprofile","text":"Jeder Vorsorgeanlass hat eine Art (Pflicht-, Angebots-, Wunschvorsorge oder Eignungsuntersuchung). Tätigkeitsprofile ordnen Tätigkeiten aus den Personallisten den Anlässen zu; eine Beschäftigung kann mehrere Profile haben (D-13)."},{"title":"Fristenberechnung","text":"Für jede Kombination aus Proband und Anlass wird der nächste Monat vorgeschlagen, mehrere ArbMedVV-Anlässe auf den frühesten gebündelt. Sie können jeden Vorschlag mit Begründung ändern. Eine nächtliche Gegenrechnung meldet Abweichungen; eine umfangreiche Fallsammlung prüft, dass kein Vorschlag die Höchstfrist der AMR 2.1 überschreitet."},{"title":"Nichts geht verloren","text":"Jede Änderung wird mit Zeitpunkt und Person aufbewahrt; bei Befunden bleibt das Original erkennbar (§ 630f BGB). Gelöscht wird erst nach Ablauf der Aufbewahrungsfrist und nach Bestätigung durch die Praxisinhaber."},{"title":"Import der Personallisten","text":"Excel- und CSV-Listen in jedem Aufbau; die Spaltenzuordnung wird je Kunde gemerkt. Vor dem Übernehmen zeigt die Software, wer neu ist, wer sich geändert hat, wer unsicher erkannt wurde und wer fehlt. Jeder Import lässt sich 30 Tage lang mit einem Klick rückgängig machen."},{"title":"Vorsorge und Eignung getrennt","text":"Bei einem Termin werden Vorsorge (einschließlich Nachtarbeit und Beratungen) und Eignungsuntersuchung getrennt dokumentiert, wie es § 3 Abs. 3 ArbMedVV verlangt (D-12)."}],"doc":"docs/plan/03-domain-model.md"},{"id":"rules","title":"Vorsorgeregeln und Anlasskatalog","short":"Vorsorgeregeln","lead":"Die Software schlägt Fristen nach den Regeln vor, die ärztliche Entscheidung geht immer vor. Die Höchstfristen der AMR 2.1 werden nie überschritten; die Regeln sind Voreinstellungen, keine medizinische Beratung.","points":[{"title":"Fristen nach AMR 2.1","text":"Erstvorsorge innerhalb von drei Monaten vor Aufnahme der Tätigkeit; die zweite spätestens nach 6, 12 oder 24 Monaten je nach Anlass; jede weitere spätestens 36 Monate nach der vorigen. Kürzere Abstände sind erlaubt, längere nicht."},{"title":"Auslegungen, die Sie bestätigen","text":"Wo der Regeltext Spielraum lässt, folgt die Software einer Empfehlung, die Sie im Frühjahr 2027 an Beispielfällen bestätigen: ab wann „überfällig“ gilt (D-15), was nach einem abgelehnten Erstangebot geschieht (D-16), unbekannter Tätigkeitsbeginn (D-18), Ruhen und Rückkehr (D-19), „n. n.“ ohne weiteren Termin (D-20)."},{"title":"Katalogpflege","text":"Eigene Kürzel mit der früheren G-Nummer als Suchbegriff (D-22). Regeländerungen erhalten ein Gültigkeitsdatum; zweimal im Jahr werden AMR, ArbMedVV und STIKO auf Änderungen geprüft. Vor jeder Regeländerung sehen Sie, wie viele Fristen sich verschieben, und geben sie frei."},{"title":"Eignung und andere Rechtsgrundlagen","text":"Eignungsuntersuchungen bleiben von der Vorsorge getrennt. Nachtarbeit (§ 6 ArbZG), Jugendarbeitsschutz und Strahlenschutz (nur bei Ermächtigung) haben eigene Regeln und werden nicht automatisch mit der Vorsorge gebündelt (D-17). Für Fahr-, Steuer- und Überwachungstätigkeiten werden erst Fristen hinterlegt, wenn die aktuelle DGUV-Empfehlung vorliegt (D-21)."},{"title":"Immunstatus","text":"Status je Krankheit, Nachweis, Titerwerte, Auffrisch- und Titerkontrolltermine sowie Masern-Nachweis (D-60). Eine nachgewiesene Immunität beendet die Vorsorge bei Biostoffen nicht (D-61). Die Verwaltung sieht nur einen neutralen „Impfstatus-Termin“ (D-62)."},{"title":"Nachgehende Vorsorge","text":"Schon im ersten Schritt erzeugt „Exposition beendet“ den Bedarf an nachgehender Vorsorge, und beim Ausscheiden entsteht eine Aufgabe zur Einwilligung in die Übertragung. Der volle Ablauf folgt später."}],"doc":"docs/plan/04-vorsorge-rules.md"},{"id":"documents","title":"Bescheinigungen, Listen und Ausgaben","short":"Dokumente","lead":"Alles, was an den Arbeitgeber geht, entsteht nur aus Stammdaten, Planungsdaten und dem Anlasskatalog, nie aus Befunden, Laborwerten oder medizinischen Freitexten.","points":[{"title":"Vorsorgebescheinigung","text":"Nach AMR 6.3 in zwei Ausfertigungen mit denselben Angaben für Beschäftigte und Arbeitgeber, wie § 6 Abs. 3 Nr. 3 ArbMedVV es vorsieht. Medizinische Hinweise für den Probanden stehen nur in einer getrennten Ergebnismitteilung. Ein Nachdruck ist identisch mit dem archivierten Original."},{"title":"Versand an den Arbeitgeber","text":"Beide Ausfertigungen entstehen bei jeder Freigabe. Der Proband erhält seine vor Ort; die Arbeitgeberausfertigungen gehen gesammelt einmal im Monat je Kunde hinaus, und jeder Versand wird festgehalten (D-42). Bei zwei Arbeitgebern steht auf jeder Ausfertigung nur, was diesen Kunden betrifft (D-43)."},{"title":"Eignungsbeurteilung","text":"Die Ausfertigung für den Arbeitgeber gibt es nur mit unterschriebener und eingescannter Einwilligung. Die Software druckt dafür ein vorausgefülltes Formular mit QR-Code, damit der Scan automatisch der richtigen Einwilligung zugeordnet wird (D-46)."},{"title":"Fälligkeitsliste","text":"Je Kunde mit den Spalten, die Sie gewählt haben (Name, Vorname, Geburtsdatum, Abteilung/Station, Pflicht/Angebot, Status), eine Zeile je Proband und Beschäftigung (D-23), als PDF und Excel. Jeder Export wird protokolliert; versandt wird verschlüsselt (D-40)."},{"title":"Gestaltung","text":"Briefkopf, Logo und Unterschrift kommen aus Ihren leeren Vorlagen. Ob die eingescannte Unterschrift überall genügt, ist Entscheidung D-45; die Software kann beides."},{"title":"Weitere Ausgaben","text":"Einladungen, Mitteilung nach § 6 Abs. 4 ArbMedVV, Bescheinigung Nachtarbeit, Immunstatus-Mitteilung und Masern-Zeugnis, Strahlenschutz-Bescheinigung (bei Ermächtigung), Mitteilung zur telemedizinischen Vorsorge, Kartei-Export und Kartei-Auszug beim Austritt, Leistungsnachweis für das Rechnungsprogramm, Jahresbericht als bearbeitbare Word-Datei."}],"doc":"docs/plan/05-documents.md"},{"id":"privacy","title":"Datenschutz und Sicherheit","short":"Datenschutz","lead":"Gesundheitsdaten nach Art. 9 DSGVO und ärztliche Schweigepflicht nach § 203 StGB. Eine Prüfliste legt fest, was vor den ersten echten Daten und was vor dem Echtbetrieb erfüllt sein muss.","points":[{"title":"Anmeldung","text":"Kennwort und zweiter Faktor bei jeder Anmeldung: ein Code aus einer Authenticator-App für alle, für die Praxisinhaber zusätzlich ein Sicherheitsschlüssel (kleiner USB-Stick), zehn ausgedruckte Notfallcodes, keine SMS (D-33). Abmeldung nach 60 Minuten ohne Aktivität."},{"title":"Verwaltung ohne Befunde","text":"Mehrfach abgesichert: in der Oberfläche, in jeder Serverfunktion, in der Datenbank und durch automatische Tests vor jeder Version. Medizinische Anhänge erscheinen für die Verwaltung gar nicht, auch nicht als Eintrag mit Art und Datum."},{"title":"Verträge vor den ersten echten Daten","text":"Die Praxis ist Vertragspartnerin der Anbieter und schließt die Auftragsverarbeitungsverträge (D-35). Wer technisch Zugriff hat, verpflichtet sich schriftlich zur Verschwiegenheit nach § 203 StGB. Verzeichnis der Verarbeitungstätigkeiten und Datenschutz-Folgenabschätzung mit Stellungnahme Ihres Datenschutzbeauftragten liegen vor dem ersten Import vor (D-39)."},{"title":"Verschlüsselung","text":"Verschlüsselte Verbindung, verschlüsselte Datenbank und Dokumente auf dem Server (D-34). Das Offline-Paket auf dem Laptop ist mit Ihrem Offline-Kennwort und einem Geräteschlüssel geschützt, gilt bis 72 Stunden nach dem Sprechtag und wird nach dem Abgleich gelöscht (D-55, D-56)."},{"title":"Protokoll und Vertretung","text":"Jedes Öffnen einer Akte, jeder Export und jede Anmeldung wird manipulationssicher protokolliert, Zugriffe drei Jahre lang (D-38). Der Zugang der Vertretung ist vorbereitet und wird von den Inhabern oder im Notfall über einen versiegelten Umschlag freigeschaltet; alle Inhaber werden dann benachrichtigt (D-36)."},{"title":"Entwicklung ohne echte Daten","text":"Entwickelt und getestet wird nur mit erfundenen Probanden. Tritt im Echtbetrieb ein Fehler auf, wird er mit erfundenen Daten nachgestellt. Einblick in eine echte Akte gibt es nur, wenn eine Ärztin oder ein Arzt sie für höchstens 24 Stunden freigibt; das wird protokolliert."},{"title":"Aufbewahrung und Löschung","text":"Aufbewahrungsfristen je Datenart und Anlass (bis zu 40 Jahre bei krebserzeugenden Stoffen). Die Software schlägt Löschungen vor, die Inhaber bestätigen sie. Importierte Personen ohne jede Vorsorge werden 12 Monate nach dem Ausscheiden zur Löschung vorgeschlagen (D-27)."}],"doc":"docs/plan/06-security-privacy.md"},{"id":"operations","title":"Betrieb, Kosten und Einführung","short":"Betrieb","lead":"Ein schlanker Betrieb mit Anleitungen, Überwachung, einer benannten Vertretung für die Technik und Papier als Überbrückung, falls das System einen Tag ausfällt.","points":[{"title":"Laufende Kosten","text":"Während der Entwicklung etwa 13 EUR brutto im Monat (von der Entwicklung getragen, D-04), ab dem Echtbetrieb etwa 39–40 EUR brutto (Server, Testserver, Sicherungsspeicher, Domain und Postfach, vierteljährliche Wiederherstellungsprobe). Die Gebühr eines Rechnungsprogramms ist nicht enthalten."},{"title":"Datensicherung","text":"Stündliche verschlüsselte Sicherung, monatliche automatische Prüfung, vierteljährlich eine vollständige Wiederherstellung auf einem frischen Server in unter vier Stunden. Wöchentlich laden Sie ein verschlüsseltes Archiv herunter, das sich mit dem kostenlosen 7-Zip oder Keka öffnen lässt, und bewahren es abwechselnd auf zwei verschlüsselten USB-Festplatten auf, eine davon außerhalb der Praxis (D-37)."},{"title":"Neue Versionen","text":"Alle zwei Wochen nach Ihrem 30-minütigen Test, abends und nie an einem Sprechtag; dringende Korrekturen auch dazwischen (D-32). Zu jeder Version gibt es eine kurze Beschreibung auf Deutsch."},{"title":"Überwachung und Unterstützung","text":"Ausfälle werden innerhalb von zehn Minuten gemeldet. Wenn sich niemand anmelden kann oder ein Datenschutzvorfall vermutet wird: Reaktion am selben Werktag. Sonstige Fehler innerhalb von 1–2 Werktagen, wie von Ihnen gewünscht. Fällt das System aus, überbrücken Papier und Offline-Pakete."},{"title":"Einführung je Kunde","text":"Zuerst ein Pilotkunde, dann die übrigen in Wellen (D-29). Je Kunde: Personalliste importieren, Anlässe ärztlich bestätigen, Fristenliste übernehmen, fehlende Termine von den Karteikarten nachtragen (D-26), 20 zufällige Probanden gegen die Karteikarte prüfen. Die Karteikarte läuft mit, bis zwei Sprechtage fehlerfrei waren (D-31); bis dahin gilt das Papier."},{"title":"Schulung","text":"Acht kurze Schulungen am Testsystem mit erfundenen Daten, jeweils mit zweiseitiger Kurzanleitung je Rolle und kurzen Bildschirmvideos. Neue Mitarbeitende werden ohne die Entwicklung eingearbeitet."},{"title":"Unabhängigkeit","text":"Betriebsanleitungen, ein versiegelter Umschlag mit den Schlüsseln, der Quellcode in jedem Wochenarchiv und eine benannte zweite technische Person mit eigenem Zugang sorgen dafür, dass auch jemand anderes den Betrieb übernehmen kann (D-41)."}],"doc":"docs/plan/07-roadmap.md"}],"milestones":[{"id":"M0","title":"Grundlagen","goal":"Ein lauffähiges Grundgerüst, in dem jede spätere Funktion von Anfang an sicher ist, dazu zwei Machbarkeitstests, die die Technik noch ändern können.","weeks":"6,0 Entwicklungswochen, 09.11.2026 bis 12.02.2027","deliverables":["Anmeldung mit Kennwort und Code aus der Authenticator-App, Notfallcodes, Abmeldung nach 60 Minuten","Datenbank mit getrenntem Befundbereich, Änderungsverlauf und manipulationssicherem Protokoll","Grundmodell für Kunden, Probanden und Beschäftigungen mit erfundenen Testdaten (2.000 Probanden, drei Kunden)","Startseite, Kundenbaum, Suche; Testsystem mit Datensicherung und Überwachung","Machbarkeitstests für Offline-Betrieb und Bescheinigungsdruck"],"demo":"Woche ab 15.02.2027: Sie richten auf dem Testsystem Ihre Authenticator-App ein, melden sich mit Kennwort und Code an, drucken die Notfallcodes, öffnen den Kundenbaum und finden die erfundene Probandin Erika Beispiel über Namen und Geburtsdatum. Auf einem Laptop ohne WLAN wird eine Musterbescheinigung gedruckt.","exit":["Mit Kennwort allein ist keine Anmeldung möglich; nach 61 Minuten ohne Aktivität erscheint die Anmeldung","Eine Programmänderung, die der Verwaltung Zugriff auf Befunde gäbe, wird automatisch abgelehnt","Das Testsystem startet nur mit erfundenen Daten, das Echtsystem nur ohne sie","Stündliche Sicherung kommt an; ein Ausfall wird innerhalb von zehn Minuten gemeldet","Offline-Speicherung und Druck funktionieren auf Windows und Mac; 300 Bescheinigungen in unter einer Minute"],"dependsOn":["D-01 bis D-07 (sonst gilt die Empfehlung)"]},{"id":"M1","title":"Kunden und Probanden","goal":"Die Verwaltung pflegt Kunden und Probanden wie im Alltag, und beide Rollen finden jede Person in Sekunden.","weeks":"2,2 Entwicklungswochen, bis 19.03.2027","deliverables":["Kunden mit Standorten, Abteilungen/Stationen, Kostenstelle und Ansprechpartnern","Probanden mit Stammdaten, früheren Namen, Beschäftigungen bei mehreren Kunden, Ereignissen und Ruhen","Zusammenführen von Doppelten (30 Tage rückgängig machbar), Anhänge, Einwilligungen, Aufgaben und Wiedervorlagen","Protokoll je Akte: wer hat wann hineingesehen"],"demo":"Woche ab 22.03.2027: Die Verwaltung legt einen Kunden mit zwei Standorten an, benennt Erika Beispiel in Erika Neumann um und findet sie weiter unter „Beispiel“, setzt „ruht bis 06/2027 (Elternzeit)“ und legt eine Aufgabe an; die Ärztin führt eine doppelte Akte zusammen und lädt einen Laborbefund hoch, den die Verwaltung nicht öffnen kann.","exit":["Alle vereinbarten Abnahmekriterien dieses Schritts laufen als automatische Tests","Ein Proband bei zwei Kunden hat eine Akte; in der Ansicht des einen Kunden ist der andere nicht zu sehen","Ein ärztlich hochgeladener Laborbefund ist für die Verwaltung nirgends sichtbar","Akte öffnet in unter einer Sekunde, Suche unter 0,3 Sekunden bei 30.000 Probanden"],"dependsOn":["M0","D-09, D-10, D-11"]},{"id":"M2","title":"Anlässe und Fristen","goal":"Die Software schlägt für jeden Probanden und Anlass den nächsten Monat vor, Sie können ihn ändern, erledigte Vorsorgen sind in Sekunden nachgetragen, und die Fälligkeitsliste entsteht mit einem Klick.","weeks":"4,2 Entwicklungswochen, bis 21.05.2027","deliverables":["Anlasskatalog mit Kürzel, Rechtsgrundlage und Gültigkeitsdatum; Tätigkeitsprofile; Anpassungen je Kunde","Fristenberechnung mit Fallsammlung und nächtlicher Gegenrechnung; ärztliche Änderung mit Begründung","Vorsorge-Nachtrag (Datum, Anlässe, nächster Termin) für die Zeit, in der vor Ort noch auf Papier dokumentiert wird","Einfache nachgehende Vorsorge (Exposition beendet, Aufgabe beim Ausscheiden)","Fälligkeitsliste je Kunde, Standort und Station als PDF und Excel, jeder Export protokolliert"],"demo":"Woche ab 24.05.2027: Bei Erika Beispiel steht Biostoffe 03/2027 (überfällig), Bildschirmarbeit ist auf 03/2027 gebündelt; die Ärztin trägt die gestrige Vorsorge nach und sieht 04/2030 für beide vorgeschlagen; die Verwaltung erzeugt die Fälligkeitsliste einer Station als PDF und Excel.","exit":["Die Fallsammlung der Fristenberechnung läuft vollständig fehlerfrei","Die Ärztin hat die Beispielfälle durchgesehen und D-15, D-16, D-18, D-19 und D-20 bestätigt","Ein Nachtrag mit zwei Anlässen braucht höchstens sechs Bedienschritte; ein späterer Monat als die Höchstfrist wird bei Pflicht und Angebot abgelehnt","Die Fälligkeitsliste öffnet sich ohne Warnung in Excel und Numbers, eine Zeile je Proband"],"dependsOn":["M1","D-12 bis D-23"]},{"id":"M3","title":"Import und Übernahme","goal":"Personallisten jedes Kunden kommen ohne Abtippen hinein, jede Änderung wird vor dem Übernehmen gezeigt, und Ihre bisherigen Fristenlisten lassen sich je Kunde übernehmen.","weeks":"3,7 Entwicklungswochen, bis 16.07.2027","deliverables":["Import-Assistent für Excel und CSV, Spaltenzuordnung je Kunde gemerkt, Zuordnung von Tätigkeiten zu Profilen","Abgleich in Stufen, Prüfansicht (neu, geändert, unsicher, fehlt), Bestätigung, 30 Tage rückgängig machbar","Automatisch „ausgeschieden“ mit den Schutzregeln aus D-25","Tabelleneingabe (auch für Karteikarten) und Übernahme der Excel-/Numbers-Fristenlisten mit Fehlerliste","Erste Entwürfe für Ihren Datenschutzbeauftragten (Systembeschreibung, Datenflüsse)"],"demo":"Woche ab 19.07.2027: Die Verwaltung importiert eine erfundene Personalliste im Aufbau Ihrer Kunden, ordnet Spalten und drei unbekannte Tätigkeiten zu, prüft neue, geänderte, unsichere und fehlende Personen, übernimmt, macht den Import rückgängig und wiederholt ihn; eine erfundene Fristenliste wird übernommen.","exit":["Listen aus Windows-Excel und CSV mit Umlauten werden richtig gelesen, auch mit Überschrift in Zeile 3","Eine Gesamtliste für eine Station verändert keine andere Station; „Import rückgängig“ stellt alles wieder her","Bei Listen nur mit Namen wird keine unsichere Zuordnung ohne Bestätigung übernommen; ein bekannter Kunde ist in unter drei Minuten importiert","Eine Fristenliste mit 500 Zeilen wird vollständig übernommen oder die Fehlerliste nennt Zeile und Grund"],"dependsOn":["M2","D-24 bis D-28","Spaltenüberschriften Ihrer Listen (bis 15.03.2027)"]},{"id":"M4","title":"Betriebsbereitschaft und Pilotkunde","goal":"Echte Daten kommen in ein Echtsystem, das gesichert, wiederherstellbar, überwacht und rechtlich abgedeckt ist, zuerst für einen Pilotkunden, dann für die übrigen nacheinander.","weeks":"3,5 Entwicklungswochen plus eine Woche zur Stabilisierung, 19.07. bis 01.10.2027 (mit Sommerpause); Pilotimport ab 04.10.2027","deliverables":["Echtserver im Konto der Praxis, verschlüsselte Ablage, Verwaltungszugang nur über gesicherte Verbindung mit Hardwareschlüssel","Stündliche Sicherung, Wiederherstellungsprobe auf frischem Server, wöchentliches Praxisarchiv, vollständiger Export in offenen Formaten","Sicherheitsschlüssel für die Inhaber, Notfallzugang der Vertretung, zeitlich begrenzte Freigabe für den Support","Sicherheitsprüfung, Zugang der zweiten technischen Person, Betriebsanleitungen","Vertragsentwürfe für den Datenschutzbeauftragten, Schulungen T-1 bis T-4, Begleitung des Pilotkunden"],"demo":"Woche ab 20.09.2027 auf dem Testsystem: Archiv-Download durch die Inhaber, Freischaltung der Vertretung mit Benachrichtigung, Support-Freigabe für 24 Stunden im Protokoll, Bericht der Wiederherstellungsprobe. Ab 04.10.2027 im Echtsystem: Import der Personal- und Fristenliste des Pilotkunden, Prüfung von 20 Probanden gegen die Karteikarten.","exit":["Vor echten Daten: alle Verträge unterschrieben, schriftliche Stellungnahme des Datenschutzbeauftragten liegt vor","Vor echten Daten: vollständige Wiederherstellung in unter vier Stunden; die Inhaber haben das Archiv auf einem anderen Rechner geöffnet","Vor echten Daten: zweite technische Person benannt, nach § 203 StGB verpflichtet und eingewiesen","Vor dem Echtbetrieb: die Checkliste für den ersten Echtbetrieb ist vollständig und von Entwicklung und Inhabern unterschrieben"],"dependsOn":["M3","Verträge und Datenschutzunterlagen der Praxis","D-29 bis D-41"]},{"id":"M5","title":"Sprechtag und Bescheinigungen","goal":"Die Verwaltung plant Sprechtage aus der Fälligkeitsliste und lädt ein; nach jeder Vorsorge stellen Sie beide Bescheinigungen nach AMR 6.3 aus, und die Arbeitgeberausfertigungen gehen so hinaus, wie es für den Kunden eingestellt ist.","weeks":"4,6 Entwicklungswochen, bis 07.01.2028","deliverables":["Sprechtags- und Zeitplanung mit Vorschlagsliste (Überfällige zuerst), Teilnehmer- und Personalabteilungsliste nach Station","Einladungsbriefe; Tagesansicht mit Anwesenheit; Erfassung der Vorsorge","Beide Vorsorgebescheinigungen mit Briefkopf und Unterschrift, Nummerierung, Archiv, monatlicher Sammelversand je Kunde","Eignungsbeurteilung mit Einwilligungsprüfung; Kartei-Export der laufenden Beschäftigungen; Kartei-Auszug beim Austritt"],"demo":"Zwei Termine (Wochen ab 15.11.2027 und 10.01.2028): Die Verwaltung plant einen Sprechtag aus der Vorschlagsliste, vergibt Zeiten per Tastatur und druckt Einladungen und Liste; die Ärztin erfasst die Anwesenheit, dokumentiert eine Vorsorge und druckt beide Ausfertigungen; die Verwaltung schließt den Monatsversand ab und druckt einen Kartei-Auszug.","exit":["Ein Sprechtag 08:00–12:00 mit 10-Minuten-Takt und 30 Minuten Pause ergibt 21 Termine; Nichterschienene erscheinen beim nächsten Sprechtag wieder","Beide Ausfertigungen enthalten dieselben Angaben und keinerlei Befund; ein Nachdruck ist identisch","Ohne eingescannte Einwilligung ist die Eignungsausfertigung für den Arbeitgeber gesperrt","Ihre Vorlage ist zu Ihrer Zufriedenheit nachgebildet; der nächste Sprechtag des Pilotkunden läuft im System"],"dependsOn":["M4","D-42 bis D-49","Leere Vorlagen, Unterschriften, Brieftexte (bis 01.09.2027)"]},{"id":"M6","title":"Befunddokumentation","goal":"Eine Standard-Vorsorge ist in 1–3 Minuten mit strukturierten Vorlagen dokumentiert, die auf den Normalbefund voreingestellt sind; zunächst am Bildschirm mit Internet.","weeks":"3,6 Entwicklungswochen, 10.01. bis 10.03.2028","deliverables":["Vorlagen für die vier häufigsten Anlassgruppen nach Ihren Papierbögen","Vorsorge-Bildschirm mit Tastaturbedienung (Taste N für Normalbefund), Nachträge mit Verlauf, „Zusatzbefund ausstehend“ mit Wiedervorlage","Ergebnismitteilung für den Probanden; Einfügen diktierter Texte","Prüfung nach AMR 3.4 für telemedizinische Vorsorge mit Mitteilung an den Arbeitgeber; Leistungsnachweis für das Rechnungsprogramm"],"demo":"Woche ab 13.03.2028: Die Ärztin dokumentiert drei Vorsorgen mit Stoppuhr (unauffällig, Hautbefund, Labor ausstehend), fügt einen diktierten Text ein und erfasst eine telemedizinische Folgevorsorge; die Verwaltung exportiert den Leistungsnachweis und liest ihn in das Rechnungsprogramm ein.","exit":["Eine unauffällige Folgevorsorge mit zwei Anlässen: höchstens sechs Bedienschritte, im Mittel höchstens 60 Sekunden","Ein Nachtrag zu einem abgeschlossenen Befund zeigt Original und Änderung mit Person und Zeit","Die Verwaltung sieht nur „Befunde: nur für Ärztinnen und Ärzte“","Video oder Telefon lässt sich ohne abgeschlossene AMR-3.4-Prüfung nicht speichern"],"dependsOn":["M5","D-50 bis D-54","Leere Anamnesebögen (bis 01.12.2027)","Rechnungsprogramm ausgewählt"]},{"id":"M7","title":"Offline-Sprechtag","goal":"Ein ganzer Sprechtag läuft auf dem Laptop ohne Internet, einschließlich spontan Erscheinender und neuer Probanden; beide Bescheinigungen werden vor Ort gedruckt, und alles kommt vollständig und ohne Doppelungen auf dem Server an.","weeks":"5,3 Entwicklungswochen, 13.03. bis 16.06.2028; Einsatz vor Ort ab 19.06.2028","deliverables":["Freigabe der Praxis-Laptops durch die Inhaber","Verschlüsseltes Paket je Sprechtag, Entsperren mit Offline-Kennwort, Sperre nach 60 Minuten, Fernlöschung","Dokumentieren und Drucken ohne Internet, Abgleich mit Konflikten als Aufgaben","Feldtest mit Ihrem Laptop und Drucker"],"demo":"Woche ab 22.05.2028 mit Ihrem Laptop: Sprechtag vorbereiten, WLAN aus, sechs Teilnehmer einschließlich eines spontan Erscheinenden und eines neuen Probanden, beide Ausfertigungen drucken, Browser schließen und wieder entsperren, Verbindung herstellen und den Abgleich verfolgen; die Verwaltung sieht die Anwesenheit im Büro.","exit":["Automatischer Test eines ganzen Sprechtags ohne Internet läuft fehlerfrei; zwei Laptops am selben Termin erzeugen einen sichtbaren Konflikt, aber keinen Verlust","Im Browserspeicher steht kein lesbarer Name; 14 Tage nach dem Sprechtag ist das Paket gelöscht; ein gesperrtes Gerät wird beim nächsten Kontakt gelöscht","Feldtest: ein echter Sprechtag des Pilotkunden offline mit Papier als Reserve, ein zweiter ohne","Ein Laptop ohne dauerhaften Speicher wird nicht als „offline bereit“ freigegeben"],"dependsOn":["M6","D-55 bis D-58","Praxis-Laptops mit Festplattenverschlüsselung"]},{"id":"M8","title":"Labor und Immunstatus","goal":"Laborbefunde kommen digital an, werden der offenen Vorsorge und dem Immunstatus zugeordnet und führen zum nächsten Termin und zu einem Ergebnisbrief.","weeks":"3,6 Entwicklungswochen, 19.06. bis 01.09.2028 (mit Sommerpause)","deliverables":["Laboreingang nur für Ärztinnen und Ärzte mit automatischer Zuordnung zu „Zusatzbefund ausstehend“; Posteingang für eingescannte Papierbefunde","Wichtige Werte (Titer), ärztliche Freigabe, Ergebnisbrief","Immunstatus je Krankheit mit Nachweis, Auffrisch- und Titerterminen, Masern-Nachweis","Einlesen von LDT-Dateien, falls das Labor sie liefert, sonst PDF mit Eingabe der wichtigen Werte"],"demo":"Woche ab 04.09.2028: Die Ärztin legt drei erfundene Laborbefunde in den Eingang, ordnet sie zu, trägt Titer ein, gibt frei und druckt einen Ergebnisbrief; im Immunstatus von Erika Beispiel stehen Masern-Nachweis vorhanden und ein Kontrolltermin für Hepatitis B.","exit":["Ein Befund zu einem Probanden mit offenem „Zusatzbefund ausstehend“ wird ohne weitere Eingabe zugeordnet; die Freigabe schließt die Wiedervorlage","Ein Anti-HBs-Wert unter der eingestellten Grenze zeigt „kein ausreichender Schutz“; eine Td-Impfung erzeugt die Auffrischung in zehn Jahren","Beides erscheint weder in Listen für den Arbeitgeber noch bei der Verwaltung, außer als „Impfstatus-Termin“"],"dependsOn":["M6","M7 (Reihenfolge nach D-58)","D-59 bis D-62","Labor liefert digital"]},{"id":"M9","title":"Erinnerungen und Jahresbericht","goal":"Weniger Nichterscheinen durch Einladungen und Erinnerungen per E-Mail mit Bestätigungslink; Jahresbericht je Kunde auf Knopfdruck; die übrigen Dokumente der Version 1.","weeks":"3,9 Entwicklungswochen, 04.09. bis 03.11.2028","deliverables":["E-Mail-Einladungen und Erinnerungen von der Praxisdomain mit Bestätigungslink; Liste der Probanden ohne E-Mail","Kalenderansicht und ein Kalender-Abonnement ohne Probandennamen","Jahresbericht je Kunde mit Statistik und Textabschnitten als Word-Datei","Bescheinigungen Nachtarbeit und Strahlenschutz (falls zutreffend), Löschvorschläge, iPad offline (falls entschieden)"],"demo":"Woche ab 06.11.2028: Die Verwaltung verschickt E-Mail-Einladungen für den nächsten Sprechtag und zeigt die Liste „keine E-Mail“; die Ärztin erzeugt den Jahresbericht 2027 eines erfundenen Kunden und bearbeitet ihn in Word; die Inhaber sehen die Löschvorschläge durch.","exit":["Keine Erinnerungs-E-Mail nennt einen Anlass; „bestätigen“ setzt den Teilnehmer auf bestätigt","Der Kalender zeigt Sprechtage mit Kunde und Standort, keine Probandennamen","Die Zahlen im Bericht stimmen mit der Datenbank überein; Werte unter fünf erscheinen als „\u003c 5“","Löschvorschläge enthalten nie eine Akte mit krebserzeugendem Stoff vor Fristende"],"dependsOn":["M5","D-28, D-63, D-64","Praxisdomain und Postfach","Gliederung eines früheren Jahresberichts"]}],"decisions":[{"id":"D-01","title":"Reihenfolge der Einführung","question":"Soll zuerst die Büroarbeit digital werden (Kartei, Fristen, Import, dann Sprechtag und Bescheinigungen; vor Ort weiter Papier mit kurzem Nachtrag) und die Offline-Dokumentation später folgen, oder soll Offline gleich mit dem ersten Echtbetrieb kommen?","owner":"both","context":"Sie haben Offline für Version 1 gewünscht, und fast alle Vorsorgen finden beim Kunden mit teils schlechtem Internet statt. Am meisten Zeit kosten Ihnen aber Fristen, Terminvergabe und Bescheinigungen, während die Papierdokumentation vor Ort schnell geht. Version 1 umfasst rund 40 Entwicklungswochen, bei 20 Stunden pro Woche also etwa zwei Jahre; der Offline-Abgleich ist der technisch schwierigste Teil.","options":[{"key":"a","label":"Erst Büro, dann offline: Kartei und Fristen ab Oktober 2027, dann Bescheinigungen, dann Befunde und Offline","pros":"Entlastung bei Ihren größten Zeitfressern nach etwa einem Jahr; der schwierigste Teil baut auf einem erprobten Fundament auf.","cons":"Vor Ort bis Juni 2028 weiter Papier mit Nachtrag; Offline kommt nicht im ersten Schritt."},{"key":"b","label":"Zuerst Offline-Sprechtag und Befunde","pros":"Der Ablauf vor Ort wird sofort digital.","cons":"Ohne Kartei, Fristen und Import hat das Offline-Modul keine Daten; schwierigster Teil zuerst, längste Wartezeit bis zum ersten Nutzen."},{"key":"c","label":"Alles in einer Version","pros":"Nur eine Umstellung.","cons":"Rund zwei Jahre ohne Nutzen; späte Rückmeldung; alle Risiken gleichzeitig."}],"recommended":"a","why":"Entlastet zuerst dort, wo Sie am meisten Zeit verlieren, und hält das größte technische Risiko vom ersten Echtbetrieb fern.","blocks":"M0 (Reihenfolge aller Schritte)"},{"id":"D-02","title":"Technische Grundlage","question":"Auf welcher technischen Grundlage wird die Software gebaut?","owner":"developer","context":"Fristenberechnung und Bescheinigungsdruck müssen auch auf dem Laptop ohne Internet laufen, also im Browser. Drei Ansätze wurden verglichen. Diese Entscheidung trifft die Entwicklung; sie ist hier zur Information aufgeführt.","options":[{"key":"a","label":"TypeScript mit React, Fastify und PostgreSQL, eigene Module für Offline und Anmeldung","pros":"Eine Sprache für Server, Berechnung, Dokumente und Offline; sehr verbreitet, daher leicht an eine Nachfolge zu übergeben.","cons":"Etwas mehr Programmieraufwand je Bildschirmmaske."},{"key":"b","label":"TypeScript mit SvelteKit","pros":"Weniger Code für einfache Masken.","cons":"Hauptversion erst seit Oktober 2026 verfügbar; zwei Darstellungswege für online und offline."},{"key":"c","label":"Python mit Django plus eigene Offline-App","pros":"Viele Bausteine fertig vorhanden.","cons":"Zwei Sprachen; Fristenberechnung müsste doppelt gebaut werden."}],"recommended":"a","why":"Berechnung und Bescheinigungen werden nur einmal gebaut, und die Bausteine sind ausgereift und weit verbreitet.","blocks":"M0 und alle weiteren Schritte"},{"id":"D-03","title":"Anbieter für Server und Sicherung","question":"Bei welchem deutschen Anbieter laufen Echt- und Testsystem, und wohin gehen die Sicherungen?","owner":"both","context":"Vorgaben: Server in Deutschland, höchstens 50 EUR im Monat, Auftragsverarbeitungsvertrag. Hetzner nahm am 07.11.2026 keine neuen Cloud-Server an. Die Entwicklung empfiehlt; die Praxis schließt die Verträge ab.","options":[{"key":"a","label":"netcup in Nürnberg für Echt- und Testserver, Hetzner Storage Box für die Sicherungen, netcup Webhosting für Domain und Postfach","pros":"Heute bestellbar; ISO-27001-zertifiziert; Sicherungen bei einem zweiten Anbieter; etwa 33 EUR brutto, mit Wiederherstellungsprobe 39–40 EUR.","cons":"Kein BSI-C5-Testat; 12 Monate Laufzeit."},{"key":"b","label":"Alles bei Hetzner","pros":"Am günstigsten; BSI C5.","cons":"Derzeit nicht bestellbar; Sicherungen beim selben Anbieter."},{"key":"c","label":"IONOS","pros":"Großer deutscher Anbieter.","cons":"Teurer; Serverstandort Deutschland nicht ausdrücklich zugesichert (ungeprüft)."}],"recommended":"a","why":"Die einzige heute bestellbare Lösung, die Standort, Budget und Vertrag erfüllt; ein späterer Wechsel ist ohne großen Aufwand möglich.","blocks":"M0 Testsystem, Verträge vor den ersten echten Daten"},{"id":"D-04","title":"Testsystem vor den ersten echten Daten","question":"Muss das Testsystem, das nur erfundene Daten enthält, von Anfang an im Konto der Praxis laufen?","owner":"both","context":"Die Praxis soll Vertragspartnerin für alle Server mit echten Daten sein. Das Testsystem enthält nie echte Daten.","options":[{"key":"a","label":"Die Praxis eröffnet das Konto sofort; das Testsystem läuft dort","pros":"Von Anfang an ein Konto.","cons":"Der Start wartet auf Ihre Anmeldung; Kosten für die Praxis ab November 2026."},{"key":"b","label":"Testsystem bis zum Echtbetrieb im Konto der Entwicklung, danach Umzug in Ihr Konto","pros":"Sofortiger Start; der Umzug prüft zugleich die Wiederaufbau-Anleitung.","cons":"Ein zusätzlicher Umzug; die Entwicklung trägt bis dahin etwa 13 EUR im Monat."}],"recommended":"b","why":"Nur erfundene Daten, also kein Datenschutzproblem; das Echtsystem steht von Anfang an in Ihrem Konto.","blocks":"M0 Testsystem"},{"id":"D-05","title":"Erzeugung der PDF-Dokumente","question":"Womit werden alle Dokumente erzeugt, wenn Bescheinigungen auch offline auf dem Laptop entstehen müssen?","owner":"developer","context":"Diese Entscheidung trifft die Entwicklung. Mit einem Werkzeug, das im Browser und auf dem Server gleich arbeitet, bekommen auch spontan Erscheinende offline eine Bescheinigung.","options":[{"key":"a","label":"pdfmake im Browser und auf dem Server","pros":"Offline und online identische Dokumente; frei nutzbar.","cons":"Gestaltung etwas weniger frei; Archivformat noch zu bestätigen."},{"key":"b","label":"Erzeugung nur auf dem Server","pros":"Pixelgenaue Gestaltung.","cons":"Funktioniert offline nicht."},{"key":"c","label":"Typst","pros":"Sehr schöner Satz.","cons":"Im Web wenig erprobt."}],"recommended":"a","why":"Wird schon im ersten Schritt mit dem Muster nach AMR 6.3 und später mit Ihren Vorlagen geprüft.","blocks":"M0 Machbarkeitstest, M2 Listen, M5, M7"},{"id":"D-06","title":"Sprache der Bezeichnungen im Programmcode","question":"Werden Tabellen und Rollen im Programmcode einheitlich englisch benannt?","owner":"developer","context":"Diese Entscheidung trifft die Entwicklung. Sie betrifft nur den Code; Bildschirm und Dokumente sind immer deutsch mit Ihren Begriffen.","options":[{"key":"a","label":"Englisch im Code, Deutsch in Oberfläche und Dokumenten","pros":"Einheitlich, leicht für eine Nachfolge.","cons":"Ein Hinweis im Plan nötig."},{"key":"b","label":"Gemischt","pros":"Keine Planänderung.","cons":"Zwei Sprachen in denselben Abfragen."},{"key":"c","label":"Deutsch im Code","pros":"Ihre Begriffe.","cons":"Umlaute müssen umschrieben werden; widerspricht dem Datenmodell."}],"recommended":"a","why":"Einheitlicher Code ist leichter zu pflegen und zu übergeben.","blocks":"M0"},{"id":"D-07","title":"Wo der Arbeitsstand geführt wird","question":"Wo wird festgehalten, welche Aufgaben erledigt sind?","owner":"developer","context":"Diese Entscheidung trifft die Entwicklung. Sie sehen den Fortschritt in den Vorführungen, in den Versionshinweisen und auf dieser Seite.","options":[{"key":"a","label":"Aufgabenliste im Plan, Status in GitHub","pros":"Plan an einem Ort, Status mit den Änderungen verknüpft.","cons":"Zwei Stellen abzugleichen."},{"key":"b","label":"Nur die Aufgabenliste im Plan","pros":"Ein Ort.","cons":"Keine Verknüpfung mit den Änderungen."},{"key":"c","label":"Nur GitHub","pros":"Gute Werkzeuge.","cons":"Der Plan verlässt die Plandokumente."}],"recommended":"a","why":"Der Plan bleibt lesbar, der Status nachvollziehbar.","blocks":"M0"},{"id":"D-08","title":"E-Rechnung","question":"Wie wird die dringende Umstellung auf E-Rechnung gelöst, solange die Abrechnung in der Software erst später kommt?","owner":"both","context":"Nach § 27 Abs. 38 UStG sind Papier- oder PDF-Rechnungen für Leistungen bis 31.12.2026 erlaubt, für Leistungen 2027 nur, wenn Ihr Gesamtumsatz 2026 im Sinne von § 19 Abs. 2 UStG nicht über 800.000 EUR lag; ab 2028 gilt die Pflicht für alle. Sie betrifft steuerpflichtige Leistungen an Unternehmen: Vorsorge ist weitgehend steuerfrei, Eignungsuntersuchungen sind steuerpflichtig. Welche Ihrer Leistungen genau betroffen sind, klärt Ihr Steuerberater.","options":[{"key":"a","label":"Ein externes E-Rechnungsprogramm (Ihres Steuerberaters oder ein Online-Dienst), gefüttert mit einem Leistungsnachweis aus der Software (ab März 2028)","pros":"Rechtzeitig korrekte Rechnungen, ohne Version 1 zu verzögern.","cons":"Zwei Programme; bis März 2028 Übertragung von Hand; ggf. eigene Monatsgebühr."},{"key":"b","label":"E-Rechnung direkt in der Software, vor der Pflicht","pros":"Ein Programm.","cons":"Ein eigenes Projekt; kommt eventuell zu spät für 2027."},{"key":"c","label":"Bis 2028 warten","pros":"Fokus auf Version 1.","cons":"Unzulässig für 2027, falls Ihr Umsatz 2026 über der Grenze liegt."}],"recommended":"a","why":"Bitte fragen Sie Ihren Steuerberater bis 15.12.2026, welche Leistungen steuerpflichtig sind und ob der Gesamtumsatz 2026 über 800.000 EUR liegt; davon hängt die echte Frist ab.","blocks":"Steuerberater bis 15.12.2026, M6 Leistungsnachweis"},{"id":"D-09","title":"Grund für „Proband ruht“","question":"Welcher Grund wird bei „ruht“ erfasst, und wer sieht ihn? Im Fragebogen stand auch „Langzeiterkrankung“, das ist eine Gesundheitsangabe.","owner":"practice","context":"Die Verwaltung trägt ein, was die Personalabteilung meldet, soll aber keine Gesundheitsdaten sehen.","options":[{"key":"a","label":"Neutrale Gründe (Elternzeit, längere Abwesenheit, sonstige), für alle sichtbar; gilt standardmäßig für alle Beschäftigungen","pros":"Die Verwaltung kann Meldungen eintragen, ohne Gesundheitsdaten zu verarbeiten.","cons":"Langzeiterkrankung steht nur in der ärztlichen Akte."},{"key":"b","label":"Gründe wie im Fragebogen, auch Langzeiterkrankung, für die Verwaltung sichtbar","pros":"Genau.","cons":"Gesundheitsangabe in einem Feld, das die Verwaltung sieht."},{"key":"c","label":"Nur Zeitraum, kein Grund","pros":"Minimal.","cons":"Elternzeit und Abwesenheit sind nicht mehr unterscheidbar."}],"recommended":"a","why":"Hält Gesundheitsangaben aus den Verwaltungsfeldern heraus, ohne die Planung zu erschweren.","blocks":"M1"},{"id":"D-10","title":"Wer doppelte Akten zusammenführen darf","question":"Wer darf zwei Akten derselben Person zusammenführen, wenn die Verwaltung die medizinischen Inhalte nicht sieht?","owner":"practice","context":"Eine falsche Zusammenführung zeigt Befunde einer Person in der Akte einer anderen; das wäre ein meldepflichtiger Datenschutzvorfall.","options":[{"key":"a","label":"Die Verwaltung, wenn höchstens eine Akte medizinische Daten hat, sonst eine Ärztin oder ein Arzt; 30 Tage rückgängig machbar","pros":"Reine Verwaltungsdubletten werden sofort bereinigt; zwei Krankengeschichten verbindet nur, wer sie sieht.","cons":"Manche Fälle brauchen zwei Schritte."},{"key":"b","label":"Verwaltung und Ärzte gleichermaßen","pros":"Am einfachsten.","cons":"Die Verwaltung würde Akten verbinden, deren Inhalt sie nicht prüfen kann."},{"key":"c","label":"Nur Ärztinnen und Ärzte","pros":"Am sichersten.","cons":"Mehr Büroarbeit für die Ärzte; Dubletten bleiben liegen."}],"recommended":"a","why":"Jede Rolle entscheidet nur, was sie auch prüfen kann.","blocks":"M1, M3"},{"id":"D-11","title":"Eingescannte Einwilligungen","question":"Gelten eingescannte Einwilligungen als Verwaltungsunterlage oder als medizinische Unterlage?","owner":"practice","context":"Die Ausfertigung der Eignungsbeurteilung für den Arbeitgeber braucht eine eingescannte Einwilligung; frei formulierte Schweigepflichtentbindungen können Diagnosen nennen.","options":[{"key":"a","label":"Nach Art: Formulare, die die Software druckt, sind Verwaltungsunterlagen; frei formulierte Entbindungen und Einwilligungen nach § 6 Abs. 4 ArbMedVV sind medizinisch","pros":"Die Verwaltung kann den üblichen Fall wie heute bearbeiten.","cons":"Eine Regel je Formularart."},{"key":"b","label":"Alle medizinisch","pros":"Streng.","cons":"Ärzte müssen scannen; die Eignungsausfertigung wartet auf sie."},{"key":"c","label":"Alle Verwaltung","pros":"Einfach.","cons":"Freie Texte können Diagnosen enthalten."}],"recommended":"a","why":"Standardformulare enthalten keine Befunde, freie Texte möglicherweise schon.","blocks":"M1, M5 Eignung"},{"id":"D-12","title":"Getrennte Dokumentation je Zweck","question":"Wenn bei einem Termin mehrere Rechtsgrundlagen zusammenkommen (ArbMedVV, Nachtarbeit, Eignung, Strahlenschutz, Jugendarbeitsschutz, Beratung): was wird gemeinsam, was getrennt dokumentiert?","owner":"both","context":"Eignung muss von der Vorsorge getrennt bleiben (§ 3 Abs. 3 ArbMedVV); eine Standard-Vorsorge soll 1–3 Minuten dauern. Sie entscheiden die Einteilung, die Entwicklung setzt sie um.","options":[{"key":"a","label":"Zwei Bereiche: Vorsorge (Pflicht, Angebot, Wunsch, Nachtarbeit, Mutterschutz-, BEM- und Impfberatung) und Eignung (Eignung, Fahr-/Steuer-/Überwachung, Strahlenschutz, Jugendarbeitsschutz)","pros":"Rechtlich sauber getrennt; die Nachtdienst-Pflegekraft mit Biostoffen und Feuchtarbeit wird einmal dokumentiert.","cons":"Nachtarbeitsbefunde stehen im Vorsorgebereich."},{"key":"b","label":"Ein Bereich je Rechtsgrundlage","pros":"Am klarsten getrennt.","cons":"Doppelte Dokumentation im häufigsten Fall."},{"key":"c","label":"Ein Bereich je Termin, nur die Dokumente getrennt","pros":"Am schnellsten.","cons":"Eignungs- und Vorsorgebefunde vermischt."}],"recommended":"a","why":"Erfüllt die rechtliche Trennung mit nur einem Dokumentationsgang im Regelfall.","blocks":"M2"},{"id":"D-13","title":"Tätigkeitsprofile je Beschäftigung","question":"Hat eine Beschäftigung genau ein Tätigkeitsprofil oder mehrere kombinierbare (z. B. „Pflege Normalstation“ plus „Nachtdienst“)?","owner":"practice","context":"Tätigkeitsprofile ordnen beim Import die Tätigkeiten aus der Personalliste den Vorsorgeanlässen zu.","options":[{"key":"a","label":"Ein Profil plus einzelne Anlässe","pros":"Einfache Zuordnung.","cons":"Jede Kombination braucht ein eigenes Profil."},{"key":"b","label":"Mehrere Profile je Beschäftigung","pros":"Kleiner Katalog aus Bausteinen.","cons":"Etwas mehr Logik; Überschneidungen werden zusammengeführt."}],"recommended":"b","why":"Weniger Katalogpflege ohne sichtbaren Nachteil.","blocks":"M2, M3"},{"id":"D-14","title":"Gespeicherte oder jedes Mal berechnete Fristen","question":"Werden Fristen gespeichert und bei jeder Änderung neu berechnet, oder bei jedem Aufruf frisch berechnet?","owner":"developer","context":"Diese Entscheidung trifft die Entwicklung. Listen, Offline-Pakete und ärztliche Änderungen brauchen Fristen als gespeicherte Daten.","options":[{"key":"a","label":"Gespeichert, bei jeder Änderung neu berechnet, nachts gegengerechnet","pros":"Schnelle Listen, nachvollziehbare ärztliche Änderungen.","cons":"Eine vergessene Neuberechnung fällt erst nachts auf."},{"key":"b","label":"Bei jedem Aufruf berechnet","pros":"Nie veraltet.","cons":"Langsame Listen; ärztliche Änderungen schwer abzubilden."},{"key":"c","label":"Nächtlicher Zwischenspeicher","pros":"Einfach.","cons":"Eine heute erledigte Vorsorge steht noch auf der heutigen Liste."}],"recommended":"a","why":"Schnell und nachvollziehbar; die nächtliche Gegenrechnung begrenzt das Risiko.","blocks":"M2"},{"id":"D-15","title":"Ab wann „überfällig“","question":"Fälligkeiten werden monatsgenau angezeigt (03/2027). Ist eine Vorsorge nach Ende des Fälligkeitsmonats überfällig, schon nach dem genau berechneten Tag, oder wird der Monat einen Monat vorverlegt?","owner":"both","context":"Die AMR 2.1 setzt Höchstfristen; auf der Vorsorgebescheinigung steht der nächste Termin als Monat und Jahr. Sie bestätigen die Auslegung an Beispielfällen im Frühjahr 2027.","options":[{"key":"a","label":"Nach Ende des Fälligkeitsmonats","pros":"Passt zu Monat/Jahr auf der Bescheinigung und in den Listen.","cons":"Kann die genaue Höchstfrist um bis zu etwa 30 Tage überschreiten."},{"key":"b","label":"Nach dem genau berechneten Tag","pros":"Streng innerhalb der AMR 2.1.","cons":"Der Status wechselt mitten im Monat, obwohl die Liste nur „03/2027“ zeigt."},{"key":"c","label":"Fälligkeitsmonat einen Monat früher","pros":"Streng und monatsgenau.","cons":"Jeder Zyklus verliert bis zu einen Monat; mehr Vorsorgen über die Jahre."}],"recommended":"a","why":"Sie haben die monatsgenaue Anzeige gewählt, und die Überschreitung ist begrenzt.","blocks":"M2 Fristen und Fälligkeitsliste"},{"id":"D-16","title":"Abgelehntes erstes Angebot","question":"Wird nach einem abgelehnten ersten Angebot die zweite Vorsorge zum regulären Termin angeboten (Beginn plus 6/12/24 Monate) oder erst 36 Monate nach der Ablehnung?","owner":"practice","context":"Ein abgelehntes Angebot muss erneut angeboten werden (AMR 2.1 Nr. 3 Abs. 9); Sie möchten es „nach der regulären Frist“ wieder. Ein verspätetes Angebot ist für den Arbeitgeber eine Ordnungswidrigkeit.","options":[{"key":"a","label":"Das abgelehnte Angebot behält seinen Platz; als Nächstes kommt die zweite Vorsorge","pros":"Vorsichtig; nie zu spät.","cons":"Eine Einladung mehr."},{"key":"b","label":"36 Monate nach der Ablehnung","pros":"Weniger Einladungen.","cons":"Kann das 12-Monats-Angebot überspringen; Risiko eines verspäteten Angebots."},{"key":"c","label":"Ärztliche Entscheidung im Einzelfall","pros":"Flexibel.","cons":"Handarbeit; uneinheitliche Listen."}],"recommended":"a","why":"Kein Angebot kommt zu spät.","blocks":"M2, Einladungen"},{"id":"D-17","title":"Was automatisch gebündelt wird","question":"Werden nur ArbMedVV-Pflicht- und Angebotsvorsorgen automatisch auf den frühesten Termin gebündelt, oder auch Nachtarbeit, Jugendarbeitsschutz, Strahlenschutz und Impftermine?","owner":"practice","context":"Die AMR 2.1 empfiehlt einen gemeinsamen Termin für mehrere Anlässe; die übrigen Untersuchungen haben eigene Rechtsgrundlagen und Abstände.","options":[{"key":"a","label":"Nur ArbMedVV; andere werden als „kann am selben Termin erledigt werden“ angezeigt, wenn sie bald fällig sind","pros":"Rechtlich gedeckt; Nachtarbeit ab 50 zieht nicht jede Vorsorge auf jährlich.","cons":"Eine Person kann zwei Fälligkeiten haben."},{"key":"b","label":"Alles bündeln","pros":"Ein Termin je Person.","cons":"Deutlich mehr Termine."},{"key":"c","label":"Nur Vorschlag, keine Automatik","pros":"Volle Kontrolle.","cons":"Mehr Klicks; Sie hatten „automatisch“ gewählt."}],"recommended":"a","why":"Bündelt, wo die Regeln es vorsehen, und gibt sonst einen Hinweis.","blocks":"M2, Sprechtagsplanung"},{"id":"D-18","title":"Unbekannter Tätigkeitsbeginn und frühere Vorsorgen","question":"Wie rechnet die Software, wenn der Tätigkeitsbeginn fehlt, oder wenn bei übernommenen Probanden nur eine frühere Vorsorge bekannt ist, aber nicht, ob es die erste war?","owner":"practice","context":"Der Beginn wird nur manchmal gemeldet. Nach der aktuellen AMR 2.1 ist die zweite Vorsorge bei vielen Anlässen 12 Monate nach Beginn fällig; eine falsche Voreinstellung überschwemmt die ersten Listen oder setzt Termine zu spät.","options":[{"key":"a","label":"Fehlender Beginn heißt „jetzt fällig“; eine frühere Vorsorge zählt als weitere (36 Monate) mit Hinweis „Position geschätzt“","pros":"Praktisch; keine Flut beim Start.","cons":"Zu spät, falls die frühere Vorsorge tatsächlich die erste war."},{"key":"b","label":"Eine frühere Vorsorge gilt als Erstvorsorge (zweite nach 12 Monaten)","pros":"Vorsichtig.","cons":"Viele Überfällige beim Start."},{"key":"c","label":"Beim Import je Liste fragen: „Waren das Erstvorsorgen?“","pros":"Nutzt Ihr Wissen.","cons":"Ein Schritt mehr beim Import."}],"recommended":"a","why":"a als Voreinstellung, c zusätzlich als Ankreuzfeld im Import.","blocks":"M2, M3"},{"id":"D-19","title":"Ruhen und Rückkehr","question":"Was geschieht mit Fälligkeiten während Elternzeit oder längerer Abwesenheit und bei der Rückkehr?","owner":"practice","context":"Eine Pflichtvorsorge muss vor Aufnahme der Tätigkeit stattfinden (§ 4 Abs. 2 ArbMedVV); für das Ruhen gibt es keine ausdrückliche Regel, daher bestätigen Sie die Auslegung.","options":[{"key":"a","label":"Termine bleiben, sind während des Ruhens ausgeblendet; bei Rückkehr ist eine Pflichtvorsorge im Monat davor fällig, ein Angebot im Rückkehrmonat","pros":"Höchstfristen bleiben gewahrt; Pflichtvorsorge vor Arbeitsbeginn.","cons":"Braucht ein Rückkehrdatum, um vorauszuplanen."},{"key":"b","label":"Nach Rückkehr neu beginnen wie bei einer Erstvorsorge","pros":"Einfach.","cons":"Keine Rechtsgrundlage; kann die zweite Vorsorge verzögern."},{"key":"c","label":"Ruhen ändert nichts, nur ausblenden","pros":"Am einfachsten.","cons":"Bei Rückkehr stehen alte Überfällige in der Liste."}],"recommended":"a","why":"Bleibt in den Höchstfristen und legt die Pflichtvorsorge vor den Wiedereinstieg.","blocks":"M2"},{"id":"D-20","title":"Keine längeren Fristen; „n. n.“ bei wiederkehrender Vorsorge","question":"Darf ein späterer Monat als die Höchstfrist der AMR 2.1 eingetragen werden, und wann ist „n. n.“ (kein weiterer Termin) bei wiederkehrender Pflicht- oder Angebotsvorsorge erlaubt?","owner":"both","context":"Die Höchstfristen der AMR 2.1 dürfen nicht überschritten werden, und eine Pflichtvorsorge läuft weiter, solange die Tätigkeit andauert. Dass spätere Monate abgelehnt werden, ist bereits vorgesehen; offen ist der Umgang mit „n. n.“.","options":[{"key":"a","label":"Spätere Monate werden abgelehnt; „n. n.“ nur mit Tätigkeitsende bis zur Höchstfrist, sonst bleibt die Höchstfrist stehen und der Fall kommt auf die ärztliche Prüfliste","pros":"Rechtskonform; deckt den berechtigten Fall ab.","cons":"Weniger Spielraum."},{"key":"b","label":"Warnen und protokollieren","pros":"Flexibel.","cons":"Ermöglicht nicht regelkonforme Bescheinigungen."},{"key":"c","label":"„n. n.“ mit Begründung, ohne Termin","pros":"Einfach.","cons":"Eine Pflichtvorsorge könnte trotz laufender Tätigkeit entfallen."}],"recommended":"a","why":"Die einzige Option, bei der keine Pflichtvorsorge verspätet; bitte bestätigen Sie den Umgang mit „n. n.“.","blocks":"M2, Bescheinigung"},{"id":"D-21","title":"Fristen für Fahr-, Steuer- und Überwachungstätigkeiten","question":"Welche Standardabstände erhält die Eignungsuntersuchung für Fahr-, Steuer- und Überwachungstätigkeiten?","owner":"practice","context":"Die DGUV-Grundsätze (G-Nummern) wurden 2022 durch die DGUV-Empfehlungen ersetzt; der alte G 25 nannte 36–60, 24–36 und 12–24 Monate je nach Alter. Die aktuelle Empfehlung lag nicht vor. Rechtsgrundlage ist hier je Kunde Vertrag oder Branchenrecht.","options":[{"key":"a","label":"Keine Voreinstellung; Sie legen jeden Abstand fest","pros":"Keine ungeprüften Werte.","cons":"Eingabe von Hand."},{"key":"b","label":"Altersstufen des alten G 25 als gekennzeichneter Vorschlag","pros":"Vertraut.","cons":"Quelle zurückgezogen; möglicherweise veraltet."},{"key":"c","label":"Aktuelle DGUV-Empfehlung beschaffen und daraus vorbelegen","pros":"Richtig und aktuell.","cons":"Die Veröffentlichung muss gekauft oder geliehen werden."}],"recommended":"c","why":"Richtige Werte aus der aktuellen Quelle; bis sie eingetragen sind, gilt a.","blocks":"M2, M5 Eignung"},{"id":"D-22","title":"Kürzel für Vorsorgeanlässe","question":"Welche Kürzel erhalten die Anlässe (Sie wünschten „Kürzel und Klartext“)?","owner":"practice","context":"Die G-Nummern wurden 2022 formal ersetzt, und eine G-Nummer deckt teils mehrere Rechtsfälle ab. Kürzel lassen sich später jederzeit umbenennen.","options":[{"key":"a","label":"Eigene Kürzel (FEU-P, BIO-PAT, BILD …), die alte G-Nummer bleibt als Suchbegriff","pros":"Unterscheidet Pflicht/Angebot und Biostoff-Fälle eindeutig.","cons":"Neue Kürzel lernen."},{"key":"b","label":"G-Nummern als Kürzel","pros":"Vertraut.","cons":"Formal ersetzt; mehrdeutig."},{"key":"c","label":"Ihre eigene
