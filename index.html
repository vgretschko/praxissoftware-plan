ded."},{"title":"Backups and restore","text":"Hourly encrypted backups; an automatic monthly restore check; a full restore on a fresh server every quarter, timed under four hours; a weekly 7z archive with AES-256 that an owner downloads onto two rotating encrypted USB disks, one kept off-site (D-37)."},{"title":"Releases","text":"Staging receives every merge to main; production gets a release every two weeks after the practice's 30-minute test session, in an evening window and never on a Sprechtag, plus hotfixes (D-32)."},{"title":"Monitoring and support","text":"Heartbeat every five minutes with alerts within ten; a daily status mail without personal data. P1 (nobody can log in, suspected breach) same working day best effort; P2 within 1–2 working days (supportSpeed J11); an outage is bridged with paper (outage J10)."},{"title":"Rollout per Kunde","text":"One pilot Kunde, then waves (D-29); per Kunde: Gesamtliste import with automatic ausgeschieden off, Anlass confirmation, migration of the deadline list, Karteikarten where needed (D-26), reconciliation of 20 random Probanden, parallel run until two clean Sprechtage (D-31). Paper stays authoritative until then."},{"title":"Training","text":"Eight short sessions T-1 to T-8 on staging with synthetic data, each with a two-page Kurzanleitung per role and screen recordings; new users onboard without the developer."},{"title":"Continuity","text":"Runbooks, a sealed envelope with vault and archive keys, the source code in every weekly archive and a named second technician with own access before RD let someone else take over (REQ-BTR-07)."}],"doc":"docs/plan/07-roadmap.md"}],"milestones":[{"id":"M0","title":"Foundation","goal":"A deployable skeleton in which every later feature is secure by construction, plus the two spikes that can still change the architecture.","weeks":"6.0 dev-weeks, 2026-11-09 to 2027-02-12","deliverables":["Repository, CI (type check, lint with import boundaries, tests, contract and permission matrix, sentinel scan, gitleaks, osv-scanner), automatic deploy of main to staging","Own authentication module: password plus TOTP, recovery codes, server-side sessions, 60-minute idle logout","PostgreSQL schemas by data class, role switching per transaction (withTx), history triggers, hash-chained audit log","Base data model for organisation, persons and employments; synthetic seed (2,000 Probanden, three Kunden, three fixed cases)","First screens: start page, Kunden tree, search; staging with backups and heartbeat monitoring","Offline spike and document spike written up as ADRs; hours log from week 1"],"demo":"Week of 2027-02-15: each tester enrols an authenticator app on staging, logs in with password and code, prints the recovery codes, opens the Kunden tree and finds Erika Beispiel by name and by birth date; the developer prints a sample certificate on a laptop with Wi-Fi switched off.","exit":["A correct password alone yields no session; after 61 idle minutes the next request lands on the login screen","A pull request that adds a route without contract declaration, or grants app_assistant anything on schema med, fails CI","Seed loads in under two minutes; staging refuses to start without the synthetic marker, production refuses to start with it","Hourly staging backup reaches the Storage Box; a stopped stack raises an alert within ten minutes","Spikes: persistent storage on Edge, Chrome and Safari, encrypted 4,000-entry directory search under 300 ms, PDF/A-2b passes veraPDF, 300 certificates under 60 s"],"dependsOn":["D-01 to D-07 (recommended options used if open)"]},{"id":"M1","title":"Kunden and Probanden","goal":"The assistant maintains Kunden and Probanden as in daily work, and both roles find any person in seconds.","weeks":"2.2 dev-weeks, to 2027-03-19","deliverables":["Kunden hierarchy Unternehmen/Träger, Standort, Abteilung/Station with Kostenstelle and contacts","Probanden with Stammdaten, former names, Beschäftigungen at several Kunden, events and Ruhen","Duplicate merge with 30-day undo, encrypted attachments by data class, consents, tasks and Wiedervorlagen","Protokoll tab: every record read logged and visible to the physicians"],"demo":"Week of 2027-03-22: the assistant creates a Kunde with two Standorte, renames Erika Beispiel to Erika Neumann and still finds her under Beispiel, sets ruht bis 06/2027 (Elternzeit), creates a task; the physician merges a seeded duplicate and uploads a lab PDF the assistant cannot open.","exit":["Every acceptance criterion in scope passes as an automated test (except those needing later features)","A Proband with Beschäftigungen at two Kunden shows one record; a filter by Kunde A does not reveal Kunde B","A physician's Laborbefund upload is invisible to the assistant in every route, list and search","Record open under 1 s and search under 300 ms with 30,000 seeded Probanden"],"dependsOn":["M0","D-09, D-10, D-11"]},{"id":"M2","title":"Anlässe and Fristen","goal":"The software proposes the next due month for every Proband and Anlass, the physician can override it, finished Vorsorgen are recorded in seconds, and one click exports the Fälligkeitsliste.","weeks":"4.2 dev-weeks, to 2027-05-21","deliverables":["Anlass catalogue with Kürzel, legal basis and valid_from; Tätigkeitsprofile; per-Kunde adjustments","Deadline engine with case files, stored deadlines and nightly comparison; physician overrides with reason","Vorsorge facts and Nachtrag through the command path with the conflict rules of 02 §7.8","Minimal nachgehende Vorsorge (exposure ended, transfer-consent task at Ausscheiden)","Fälligkeitsliste per Kunde, Standort and Station as PDF and Excel, every export logged"],"demo":"Week of 2027-05-24: Erika Beispiel shows Biostoffe due 03/2027 (überfällig) and Bildschirmarbeit bundled to 03/2027; the physician records yesterday's Vorsorge as Nachtrag and sees 04/2030 proposed for both; the assistant exports the Fälligkeitsliste for one Station as PDF and Excel.","exit":["Engine case files pass with 100 % branch coverage and fast-check properties","The physician has walked through the case files and signed off D-15, D-16, D-18, D-19 and D-20","A Nachtrag of a Folgevorsorge for two Anlässe takes at most 6 user actions; a later month than the AMR 2.1 maximum is refused for Pflicht and Angebot","The Fälligkeitsliste opens in Excel and Numbers without warnings, one row per Proband, no sentinel string","Conflict rules tested in both arrival orders; nightly recomputation reports zero differences on the seed"],"dependsOn":["M1","D-12 to D-23"]},{"id":"M3","title":"Import and migration","goal":"HR lists of any Kunde go in without retyping, every change is shown before it is applied, and the existing deadline lists can be migrated per Kunde.","weeks":"3.7 dev-weeks, to 2027-07-16","deliverables":["Import wizard for xlsx and CSV with column mapping remembered per Kunde and Tätigkeit-to-profile mapping","Tiered matching, diff review (new, changed, unsure, missing), confirmation, undo for 30 days","Automatic ausgeschieden with the safeguards of D-25","Grid entry and paste (also for Karteikarten); migration tool for the Excel/Numbers deadline lists with rejection list","First legal drafts for the DPO: DPIA system description, data-flow diagram, technical parts of the VVT"],"demo":"Week of 2027-07-19: the assistant imports a synthetic HR list in the practice's column structure, maps three unknown Tätigkeiten, reviews new, changed, unsure and missing persons, confirms, undoes and repeats; the migration tool loads a synthetic deadline list.","exit":["Windows-1252 CSV with semicolons and an xlsx with the header in row 3 import with correct umlauts","A Gesamtliste scoped to one Station never touches another; Import rückgängig restores every change","On a name-only test set (300 rows with renames and homonyms) no uncertain match is applied without confirmation; a known Kunde's import takes under 3 minutes of user time","A 500-row synthetic deadline list becomes 500 deadlines or a rejection list naming row and reason","Files parse only in the worker; .xlsm is refused; raw files are deleted 30 days after commit"],"dependsOn":["M2","D-24 to D-28","P-1, P-2 column headers from the practice"]},{"id":"M4","title":"Production readiness and pilot (RD, GL1)","goal":"Real data enter a production system that is backed up, restorable, monitored and legally covered, first for one pilot Kunde, then the others one by one.","weeks":"3.5 dev-weeks plus a stabilisation week, 2027-07-19 to 2027-10-01 (August break inside); pilot import from 2027-10-04","deliverables":["Production server in the practice's account, encrypted vault, administrative access only via VPN with hardware-backed keys","Hourly backups, monthly restore check, timed restore drill with outbox re-push, weekly practice archive, full open-format export","Step-up authentication, FIDO2 keys for owners, deputy emergency access, time-limited support access","Security verification (header check, ZAP baseline, ASVS L2 subset), second technician's access, runbooks","Legal drafts for the DPO, training T-1 to T-4 with Kurzanleitungen, pilot cutover support"],"demo":"Week of 2027-09-20 on staging: owner step-up for the archive download, deputy activation with notification, support access granted for 24 hours and visible in the log, the restore report. Pilot week of 2027-10-04 on production: import of the pilot Kunde's HR list and deadline list, 20 Probanden checked against the Karteikarten.","exit":["RD: all legal items signed and filed, DPO's written statement dated before the first import","RD: full restore onto a fresh server under four hours with identical counts; an owner has opened the archive with 7-Zip on another computer","RD: second technician named, § 203 undertaking signed, has unlocked staging once","RD: load test with 10 users at p95 under 500 ms on a server that will never hold real data","GL1: the go-live checklist of 07 §10.1 is complete and signed by the developer and an owner"],"dependsOn":["M3","Legal track L-01 to L-19 (practice)","D-29 to D-41"]},{"id":"M5","title":"Sprechtag and Bescheinigungen (V1.0b)","goal":"The assistant plans Sprechtage from the due list and invites; after each Vorsorge the physician issues both AMR 6.3 certificates, and employer copies go out as each Kunde's setting says.","weeks":"4.6 dev-weeks, to 2028-01-07","deliverables":["Sprechtag and slot planning with proposal list (overdue first), participant and HR lists grouped by Station","Letter invitations; day view with attendance; capture of the Vorsorge","Both Vorsorgebescheinigungen with letterhead and signature, numbering, archive, monthly Sammelversand per Kunde","Eignungsbeurteilung with consent gate; Kartei export of current employments; Kartei-Auszug at Austritt"],"demo":"Two sessions (weeks of 2027-11-15 and 2028-01-10): the assistant plans a Sprechtag from the proposal list, assigns slots by keyboard, prints invitations and the HR list; the physician marks attendance, records a Vorsorge, prints both copies; the assistant closes the monthly batch and prints a Kartei-Auszug.","exit":["08:00–12:00 with 10-minute slots and a 30-minute break yields 21 slots; no-shows reappear on the next candidate list","Employer and employee PDFs carry the same fields and no sentinel string; reprints are byte-identical","A batch of 37 certificates gives one PDF with cover letter; 300 render in under 60 s","Without a consent scan the Eignung employer copy is disabled","The pilot Kunde's first Sprechtag after the release is planned, invited and certified in production"],"dependsOn":["M4","D-42 to D-49","P-3, P-4, P-8 templates, signatures, letter wording"]},{"id":"M6","title":"Befunddokumentation (V1.1a, online)","goal":"A standard Vorsorge is documented in the software in 1–3 minutes with structured templates preset to the normal finding, online first.","weeks":"3.6 dev-weeks, 2028-01-10 to 2028-03-10","deliverables":["Template model and editor; templates for the four main Anlass groups after the practice's paper forms","Vorsorge screen with keyboard flow (key N for Normalbefund), amendments with history, Zusatzbefund ausstehend with Wiedervorlage","Ergebnismitteilung for the Proband; dictation paste with section markers","AMR 3.4 telemedicine check and Textform notice; Leistungsnachweis export for the e-invoicing tool"],"demo":"Week of 2028-03-13: the physician documents three Vorsorgen against the clock (normal, skin finding, pending lab), pastes a dictated text, records a telemedicine check; the assistant exports the Leistungsnachweis and imports it into the chosen e-invoicing tool.","exit":["A Folgevorsorge for two Anlässe without deviations: at most 6 user actions and a median of 60 s over ten timed runs","Amending a finalised Befund shows original and amendment with author and time","Sentinel suite covers every F field of the templates; the assistant sees only Befunde: nur für Ärztinnen und Ärzte","Video or Telefon cannot be saved without a completed AMR 3.4 check; a first Pflicht- or Angebotsvorsorge at a Kunde is blocked by default"],"dependsOn":["M5","D-50 to D-54","P-5 empty Anamnese forms","e-invoicing tool chosen (L-17)"]},{"id":"M7","title":"Offline Sprechtag (V1.1, GL2)","goal":"A whole Sprechtag runs on the physician's laptop without network, walk-ins and new Probanden included, both certificates printed on site, and everything arrives on the server without loss or duplication.","weeks":"5.3 dev-weeks, 2028-03-13 to 2028-06-16; GL2 from 2028-06-19","deliverables":["Device enrolment by an owner, device keys and per-package authoring key","Encrypted package per Sprechtag, offline unlock with passphrase, lock after 60 minutes, remote wipe","Offline capture and printing, sync with conflicts as tasks and restore watermark","Offline end-to-end suite in CI and a field test on the practice's laptop and printer"],"demo":"Week of 2028-05-22 on staging with the practice's laptop: prepare a Sprechtag, Wi-Fi off, six participants including a walk-in and a new Proband, both copies printed, browser closed and unlocked again, reconnect and watch the sync complete while the assistant sees the attendance in the office.","exit":["Offline suite passes: 21 Vorsorgen, two walk-ins, one new Proband, reload offline, sync; two laptops on one Termin produce a visible conflict and no loss","A raw browser storage dump contains no sentinel name; packages are gone 14 days after the Sprechtag; a revoked device is wiped at next contact","Field test: one real Sprechtag of the pilot Kunde offline with paper backup, a second without","Readiness check refuses offline bereit without persistent storage on the practice's laptop model"],"dependsOn":["M6","D-55 to D-58","Practice laptops with full-disk encryption (L-16)"]},{"id":"M8","title":"Labor and Immunstatus (V1.2)","goal":"Lab results arrive digitally, are filed to the open Vorsorge and the Immunstatus, and close the loop to the next date and a result letter.","weeks":"3.6 dev-weeks, 2028-06-19 to 2028-09-01 (August break inside)","deliverables":["Physician-only lab inbox with automatic linking to an open Zusatzbefund ausstehend; Posteingang for scanned paper lab mail","Key values (titers), sign-off, result letter","Immunstatus per disease with evidence, booster and titer deadlines, Masern-Nachweis","LDT 3 import if the lab delivers it, otherwise PDF upload with manual key values"],"demo":"Week of 2028-09-04: the physician drops three synthetic lab PDFs into the inbox, assigns them, enters titers, signs off and prints a result letter; Erika Beispiel's Immunstatus shows Masern-Nachweis present and a Hepatitis B control date.","exit":["A lab PDF on a Proband with one open Zusatzbefund ausstehend links without further input; sign-off closes the Wiedervorlage","Anti-HBs below the configured threshold shows kein ausreichender Schutz; a Td dose creates the 10-year booster deadline","Neither appears in an HR export or in the assistant's view except as Impfstatus-Termin","A result arriving while its Vorsorge is still in a laptop outbox is linked when the Vorsorge syncs"],"dependsOn":["M6","M7 (order per D-58)","D-59 to D-62","Lab delivers digitally (P-6)"]},{"id":"M9","title":"Kommunikation and Jahresbericht (V1.3)","goal":"Fewer no-shows through e-mail invitations, reminders and confirmation links; the annual report per Kunde at the push of a button; the remaining V1 documents.","weeks":"3.9 dev-weeks, 2028-09-04 to 2028-11-03","deliverables":["E-mail invitations and reminders from the practice domain with confirmation links; list of Probanden without e-mail","Calendar view and a read-only ICS feed without Proband names","Annual report per Kunde with statistics and text sections as editable .docx","Nachtarbeit and Strahlenschutz certificates (if in scope), deletion proposal UI, iPad offline if decided"],"demo":"Week of 2028-11-06: the assistant sends e-mail invitations for the next Sprechtag and shows the keine E-Mail list; the physician generates the 2027 report for a synthetic Kunde as .docx and edits it in Word; an owner reviews deletion proposals.","exit":["Reminder e-mails contain no Anlass name (template linter); confirm sets bestätigt, a second click shows bereits bestätigt","The ICS feed shows Sprechtage with Kunde and Standort and no Proband name","Report counts equal a direct database count; cells under five show \u003c 5; the .docx opens in Word","Deletion proposals list an expired record and never one with a carcinogen flag"],"dependsOn":["M5","D-28, D-63, D-64","Practice domain and mailbox (L-14)","P-7, P-9"]}],"decisions":[{"id":"D-01","title":"Go-live sequence","question":"Does Version 1 go live as a back-office system first (Kartei, Fristen, Import, then Sprechtag and certificates, documentation on paper plus Nachtrag) and add offline documentation later, or does offline come with the first go-live?","owner":"both","context":"H1 puts offline into Version 1 and nearly all Vorsorgen happen on site with partly bad internet (onsiteShare B11, internet I3). The pains named first are deadlines, appointments and certificates (painNow B15, top3 M1), while paper documentation on site is fast. V1 is about 40.6 dev-weeks, two calendar years at 20 h/week, and offline sync is the riskiest component.","options":[{"key":"a","label":"Back office first, offline second (GL1 Kartei und Fristen, then certificates, then findings and offline at GL2)","pros":"Value after about 20 dev-weeks on the named pains; offline is built on a settled model and a capture path already in daily use.","cons":"Paper plus Nachtrag on site until GL2 (June 2028 at 20 h/week); H1 read literally wants offline in the first release."},{"key":"b","label":"Offline Sprechtag and findings first","pros":"Addresses the on-site workflow at once.","cons":"Without Kartei, Fristen and import the module has nothing to work on; hardest part first, longest time to first use."},{"key":"c","label":"One release with everything","pros":"One cut-over.","cons":"No benefit for about two years; late feedback; all risks at once."}],"recommended":"a","why":"Delivers what costs the practice most time first and keeps the riskiest component off the critical path to the first go-live; D-30, D-50 and D-58 refine the cut.","blocks":"M0 (order of all milestones)"},{"id":"D-02","title":"Application stack","question":"Which application stack does the project build on?","owner":"developer","context":"The deadline engine and the certificate renderer must run on the laptop without network, so they have to exist in the browser. Three proposals were evaluated (SvelteKit, React with Fastify, Django). The choice also settles an own outbox instead of PowerSync or ElectricSQL (ADR-08) and an own auth module instead of Better Auth after the 2026 two-factor bypass advisory (ADR-12).","options":[{"key":"a","label":"TypeScript: React 19 SPA (Vite 8, TanStack), Fastify 5, PostgreSQL 18, own offline and auth modules","pros":"One language for server, engine, documents and offline; one rendering model; best known to Claude Code and any successor; every major at least eight weeks old.","cons":"More code per CRUD screen (endpoint plus client)."},{"key":"b","label":"TypeScript: SvelteKit 3 monolith","pros":"Less boilerplate through load functions and form actions; small bundles.","cons":"SvelteKit 3.0 released 2026-10-01; server rendering plus offline client routes means two rendering modes; smaller developer pool."},{"key":"c","label":"Django 6.1/6.2 LTS with htmx plus a separate TypeScript Sprechtag app","pros":"Admin, auth, forms and migrations built in; long LTS.","cons":"Two languages and UI paradigms; engine duplicated or missing on the laptop; second template technology."}],"recommended":"a","why":"One code base avoids writing the engine and the renderer twice, and its parts are the most mature and best known to Claude Code.","blocks":"M0 scaffolding and everything after it"},{"id":"D-03","title":"Hosting provider","question":"Which German provider hosts production and staging, and where do backups go?","owner":"both","context":"Data in Germany (hosting J1), at most 50 EUR a month (runCost L3), with an AVV. Hetzner Cloud showed every plan as unavailable on 2026-11-07 and has restricted new customers since 2026-06-26. The developer recommends; the practice contracts and signs the AVVs.","options":[{"key":"a","label":"netcup VPS 1000 G12.5 (production, 14.50 EUR net) and VPS 500 (staging, 8.26 EUR net) in Nuremberg, Hetzner Storage Box BX11 for backups (3.20 EUR net), netcup Webhosting 1000 for domain and mail (2.26 EUR net)","pros":"Orderable today; 8 GB RAM; ISO/IEC 27001; AVV in the customer panel; backups at a second provider; about 33 EUR gross, 39–40 EUR with the restore drill.","cons":"No BSI C5 attestation listed; ISO scope for Nuremberg unverified; 12-month term; net and gross prices on the page do not reconcile."},{"key":"b","label":"Hetzner Cloud CX33 and CX23 plus Storage Box","pros":"Cheapest; BSI C5; one provider.","cons":"Not orderable on 2026-11-07; two price rises in 2026; backups at the same provider."},{"key":"c","label":"IONOS VPS L+ plus Storage Box","pros":"Large German provider.","cons":"About 22 EUR a month after the introductory period plus setup; German location not explicit (unverified)."}],"recommended":"a","why":"The only option orderable today that meets Germany, budget and AVV; the provider-neutral setup makes a later move a restore drill.","blocks":"M0 staging, RD"},{"id":"D-04","title":"Staging server before RD","question":"Must staging, which holds only synthetic data, live in the practice's own provider account from the start?","owner":"both","context":"SEC-01 makes the practice the account holder for hosting; staging never holds real data (SEC-50).","options":[{"key":"a","label":"The practice opens the netcup account in M0; staging lives there","pros":"One account from day one.","cons":"M0 waits for the practice's paperwork; the practice pays from November 2026."},{"key":"b","label":"Staging in the developer's account until RD, then rebuilt in the practice's account","pros":"M0 starts at once; the rebuild doubles as the bootstrap test (REQ-BTR-07).","cons":"One extra rebuild; the developer carries about 13 EUR gross a month until RD."}],"recommended":"b","why":"Synthetic data only, so SEC-01 is untouched, and production is in the practice's account from its first day.","blocks":"M0 staging"},{"id":"D-05","title":"PDF engine","question":"Which engine renders every document, given that certificates must also render offline in the browser?","owner":"developer","context":"pdfmake 0.3 runs the same document definitions in the browser and in Node; PDF/A-2b through its subset option is documented but untested here. With one engine, walk-ins get a certificate offline without pre-rendered forms.","options":[{"key":"a","label":"pdfmake 0.3 in browser and Node, pdf-lib to merge batches","pros":"Offline-identical documents; MIT licence; repeated table headers; one code path.","cons":"Declarative layouts less flexible than HTML/CSS; PDF/A output still to be proven."},{"key":"b","label":"Server-side HTML to PDF (Gotenberg/Chromium)","pros":"HTML/CSS templates, pixel-precise.","cons":"Fails offline; Chromium needs RAM on a small server."},{"key":"c","label":"Typst compiled to WASM","pros":"Excellent typography; runs in the browser.","cons":"Little-trodden in web apps; integration risk sits with one developer."}],"recommended":"a","why":"Confirmed by the M0 spike (veraPDF PDF/A-2b, 300-certificate batch under 60 s, one certificate under 2 s on a 2020 laptop) and repeated with the practice's templates in M5; fallback is letterhead stamping with pdf-lib.","blocks":"M0 spike, M2 list PDFs, M5, M7"},{"id":"D-06","title":"Naming in code where 02 and 03 differ","question":"03 makes English identifiers canonical, 02 §6 names roles and some sys tables in German (app_arzt, sys.benutzer). Which applies?","owner":"developer","context":"Every migration from 0001 onwards depends on the answer; the 03 reconciliation table already maps the German names.","options":[{"key":"a","label":"English everywhere in code and database (app_physician, app_assistant, sys.user_account); German only in UI labels and documents","pros":"One language in code; easiest for Claude Code and a successor.","cons":"02's text needs a note."},{"key":"b","label":"02's German names for roles and sys, 03's English names for domain tables","pros":"No change to 02.","cons":"Two languages in the same queries."},{"key":"c","label":"German throughout","pros":"The practice's vocabulary.","cons":"Contradicts 03; umlauts need transliteration."}],"recommended":"a","why":"Recorded as an amendment to ADR-05 in story 0.3.2.","blocks":"M0 migration 0001"},{"id":"D-07","title":"Backlog tracking","question":"Where does the status of stories live?","owner":"developer","context":"08-backlog.md is the plan of record; the practice sees progress through the review page and release notes.","options":[{"key":"a","label":"08-backlog.md as plan of record, GitHub Issues per milestone for status","pros":"Plan in one place; issues link to pull requests.","cons":"Two places to keep in step at milestone boundaries."},{"key":"b","label":"Only 08-backlog.md with checkboxes","pros":"One place.","cons":"No link between stories and pull requests."},{"key":"c","label":"Only GitHub Issues or Projects","pros":"Rich tooling.","cons":"The plan leaves the repository documents and the review page."}],"recommended":"a","why":"Keeps the plan reviewable in the repository while status and pull requests stay linked.","blocks":"M0 working routine"},{"id":"D-08","title":"E-invoicing path","question":"How is the urgent e-invoicing need (painNow B15, note_H H5) met while billing is Später in H1?","owner":"both","context":"Under § 27 Abs. 38 UStG paper or other formats stay allowed for services until 2026-12-31, and for services in 2027 only if the issuer's 2026 Gesamtumsatz (§ 19 Abs. 2 UStG) did not exceed 800,000 EUR (https://www.gesetze-im-internet.de/ustg_1980/__27.html, checked 2026-11-07); from 2028 the duty applies to every issuer. It covers taxable domestic B2B supplies; Vorsorge is largely exempt under § 4 Nr. 14 UStG while Eignungsuntersuchungen are taxable; which services are taxable is for the Steuerberater [unverified].","options":[{"key":"a","label":"External e-invoicing tool from the duty date, fed by the Leistungsnachweis export (M6, before 2028-01-01)","pros":"Compliant invoices on time without delaying V1; small build effort.","cons":"Two systems; manual transfer until M6; a possible monthly fee outside the 50 EUR."},{"key":"b","label":"In-app E-Rechnung module (ZUGFeRD EN 16931 / XRechnung) before the duty date","pros":"One system; billing from the Kartei.","cons":"Numbering, storno, KoSIT validation and GoBD archiving are a project of their own; the 2027 date may come before any V1 software exists."},{"key":"c","label":"Defer until 2028-01-01","pros":"Focus on V1.","cons":"Ignores dringend; unlawful for 2027 if the 2026 turnover exceeds the threshold."}],"recommended":"a","why":"Ask the Steuerberater by 2026-12-15 which services are taxable and whether the 2026 Gesamtumsatz exceeds 800,000 EUR; those two facts set the real deadline. The in-app module stays designed for the later billing module.","blocks":"Steuerberater by 2026-12-15 (L-15), M6 Leistungsnachweis"},{"id":"D-09","title":"Ruhen reason and visibility","question":"What reason is recorded with Proband ruht, and who sees it? The questionnaire's wording included Langzeiterkrankung, which is health data (Art. 4 Nr. 15 GDPR).","owner":"practice","context":"The assistant records what HR reports; assistRights (J2) excludes findings from the assistant's view.","options":[{"key":"a","label":"Neutral categories (Elternzeit, längere Abwesenheit, sonstige), visible to everyone who may see the person; per Beschäftigung with alle Beschäftigungen as default","pros":"The assistant records HR information without handling health data.","cons":"Physicians cannot filter long illnesses (they note them in the medical record)."},{"key":"b","label":"The questionnaire's categories including Langzeiterkrankung, visible to the assistant","pros":"Precise.","cons":"Health data in a field the assistant sees, against J2."},{"key":"c","label":"Dates only","pros":"Minimal.","cons":"Planning and statistics lose the difference between parental leave and absence."}],"recommended":"a","why":"Keeps health data out of administrative fields at no cost to planning.","blocks":"M1 events and Ruhen"},{"id":"D-10","title":"Who may merge duplicate Probanden","question":"Who may merge two Proband records, given that the assistant cannot see the medical content being joined?","owner":"practice","context":"A wrong merge shows one person's findings in another's record, a reportable breach; duplicates also spoil import matching.","options":[{"key":"a","label":"The assistant merges when at most one record holds medical data, otherwise a physician; every merge can be undone for 30 days","pros":"Administrative duplicates fixed at once; joining two histories needs medical judgement.","cons":"Some duplicates need two steps."},{"key":"b","label":"Assistant and physicians alike","pros":"Simplest.","cons":"A wrong merge of two histories by someone who cannot see them."},{"key":"c","label":"Physicians only","pros":"Safest.","cons":"Clerical work for physicians; duplicates linger."}],"recommended":"a","why":"Splits the work by what each role can actually check.","blocks":"M1 duplicate handling, M3 import review"},{"id":"D-11","title":"Consent scans: who may file and see them","question":"01 treats scanned Einwilligungen as administrative, 06 §2 classes them as findings. Which applies?","owner":"practice","context":"The Eignung employer copy needs a consent scan (eignungConsent F9), which the assistant files today; free-form releases can name diagnoses.","options":[{"key":"a","label":"By consent type: standard forms the software prints are administrative; free-form Schweigepflichtentbindungen and § 6 Abs. 4 consents are medical","pros":"The assistant keeps the paper workflow for the common case.","cons":"A rule per type to maintain."},{"key":"b","label":"All scans medical; the assistant records metadata only","pros":"Strict.","cons":"Physicians scan; the Eignung employer copy waits for them."},{"key":"c","label":"All scans administrative","pros":"Simplest.","cons":"Free-form releases can name diagnoses."}],"recommended":"a","why":"Standard forms carry no findings, free-form ones may.","blocks":"M1 consents, M5 Eignung employer copy"},{"id":"D-12","title":"Documentation records per purpose","question":"When one appointment covers several legal tracks (ArbMedVV, ArbZG Nachtarbeit, Eignung, StrlSchV, JArbSchG, Beratung), which share one encounter and which get their own?","owner":"both","context":"Eignung must stay separate from Vorsorge (§ 3 Abs. 3 ArbMedVV, AMR 6.3 Nr. 1); the standard Vorsorge must take 1–3 minutes (speed K3). The physician decides the grouping, the developer implements it.","options":[{"key":"a","label":"Two purposes: care (Pflicht, Angebot, Wunsch, Nachtarbeit, Mutterschutz-, BEM- and Impfberatung) and fitness (Eignung, FSÜ, StrlSchV, JArbSchG)","pros":"Legal separation of Eignung; a night-shift nurse with Biostoffe and Feuchtarbeit is documented once; consent logic only on fitness.","cons":"Nachtarbeit findings sit in the Vorsorge record."},{"key":"b","label":"One encounter per legal basis","pros":"Cleanest separation.","cons":"Two documentation passes for the typical nurse; breaks the click budget."},{"key":"c","label":"One encounter per appointment, separated only on documents","pros":"Fastest.","cons":"Eignung and Vorsorge findings mixed; contradicts REQ-DOK-08."}],"recommended":"a","why":"Meets the legal separation with one documentation pass for the common case.","blocks":"M2 encounter model, screen S08"},{"id":"D-13","title":"Tätigkeitsprofile per Beschäftigung","question":"Can a Beschäftigung carry one Tätigkeitsprofil or several combinable ones (e.g. Pflege Normalstation plus Nachtdienst)?","owner":"practice","context":"Profiles map HR Tätigkeiten to Anlässe at import (REQ-IMP-08); the tables support both variants.","options":[{"key":"a","label":"One profile plus individual Anlässe","pros":"Simple mapping.","cons":"Every combination needs its own profile; individual extras orphan when the profile changes."},{"key":"b","label":"Several profiles per Beschäftigung; a Tätigkeit maps to one or more","pros":"Small catalogue of building blocks.","cons":"One more join; overlapping blocks merge to one assignment per Anlass."}],"recommended":"b","why":"Saves catalogue maintenance at no visible cost.","blocks":"M2 catalogue seed, M3 import mapping"},{"id":"D-14","title":"Stored or computed deadlines","question":"Are Fristen stored as rows that the engine recomputes on triggers, or computed on every read?","owner":"developer","context":"Lists, offline packages and physician overrides need deadlines as data; design size is up to about 110,000 assignments.","options":[{"key":"a","label":"Stored deadline rows recomputed by one function on every trigger, plus a nightly full recomputation that compares and alerts","pros":"Fast lists; overrides with history; offline packages copy rows; auditable.","cons":"A missed trigger shows until the nightly comparison catches it."},{"key":"b","label":"Computed on every read","pros":"Never stale.","cons":"Every list runs the engine over all assignments; overrides outside an encounter have no home."},{"key":"c","label":"Nightly cache, live computation for one person","pros":"Simple writes.","cons":"A Vorsorge documented today still shows as due on today's list."}],"recommended":"a","why":"Fast and auditable; the nightly comparison bounds the drift risk.","blocks":"M2 engine and Fälligkeitsliste"},{"id":"D-15","title":"When a month-precise date is überfällig","question":"Due dates are shown as MM/YYYY (dateDisplay D7). Does an item become überfällig after the end of the due month, after the exact computed day, or is the due month shifted one month earlier?","owner":"both","context":"AMR 2.1 sets maximum intervals; the Vorsorgebescheinigung states the next date as month and year (AMR 6.3). The physician signs off the interpretation on the case files in M2.","options":[{"key":"a","label":"After the end of the due month","pros":"Matches Monat/Jahr on the certificate and the month view.","cons":"Can exceed the exact AMR 2.1 maximum by up to about 30 days."},{"key":"b","label":"After the exact computed day","pros":"Strictly within AMR 2.1.","cons":"Status flips mid-month in a list that shows 03/2027."},{"key":"c","label":"Due month one month earlier","pros":"Strict and month-consistent.","cons":"Every cycle loses up to a month; more Vorsorgen over time."}],"recommended":"a","why":"The practice chose month precision as on the certificate, and the overshoot is bounded.","blocks":"M2 engine status, dashboard, Fälligkeitsliste"},{"id":"D-16","title":"Position after a declined Erstangebot","question":"When the first offer of an Angebotsvorsorge is declined, is the next offer the zweite Vorsorge (Beginn plus 6/12/24 months) or 36 months after the declined offer?","owner":"practice","context":"A declined Angebot must be offered again (AMR 2.1 Nr. 3 Abs. 9); the practice wants it back after the regular interval (declinedOffer C12). A late offer is an Ordnungswidrigkeit for the employer (§ 10 Abs. 1 Nr. 4 ArbMedVV).","options":[{"key":"a","label":"The declined offer keeps its position (next is the zweite)","pros":"Conservative; never late.","cons":"One more invitation."},{"key":"b","label":"36 months after the declined offer","pros":"Fewer invitations.","cons":"May skip the 12-month offer; risk of a late offer."},{"key":"c","label":"Physician decides each time","pros":"Flexible.","cons":"Manual work; inconsistent lists."}],"recommended":"a","why":"Never places an offer late.","blocks":"M2 engine, invitations"},{"id":"D-17","title":"Bundle scope","question":"Automatic bundling to the earliest date (bundle D8): only ArbMedVV Pflicht and Angebot, or also Nachtarbeit, JArbSchG, Strahlenschutz and Impf recalls?","owner":"practice","context":"AMR 2.1 Nr. 3 Abs. 8 asks for one common date for several Anlässe; the other tracks have their own legal bases and intervals.","options":[{"key":"a","label":"ArbMedVV only; other tracks shown as kann am selben Termin erledigt werden inside the bald-fällig window","pros":"Legal footing in AMR 2.1; Nachtarbeit after 50 does not pull every Vorsorge to yearly.","cons":"Two due dates can remain for one person."},{"key":"b","label":"Bundle all tracks","pros":"One date per person.","cons":"Many more appointments."},{"key":"c","label":"Proposal only","pros":"Full control.","cons":"Contradicts automatisch; more clicks."}],"recommended":"a","why":"Bundles where the rules allow it and only hints elsewhere.","blocks":"M2 engine, Sprechtag planning"},{"id":"D-18","title":"Unknown start date and legacy history","question":"How does the engine treat assignments without Tätigkeitsbeginn, and imported Probanden with one known past Vorsorge whose position (Erst or later) is unknown?","owner":"practice","context":"Start dates arrive only sometimes (startDate D9). The current AMR 2.1 puts the zweite Vorsorge 12 months after Beginn for many Anlässe, so a wrong default either floods the first lists or places Vorsorgen late.","options":[{"key":"a","label":"Unknown Beginn means due now; one legacy Vorsorge counts as a weitere (36 months) flagged Position geschätzt","pros":"Practical; no flood at go-live.","cons":"Late if the legacy Vorsorge was in fact an Erstvorsorge."},{"key":"b","label":"One legacy Vorsorge counts as the Erstvorsorge (second at plus 12 months)","pros":"Conservative.","cons":"Many overdue items at go-live."},{"key":"c","label":"Ask per import batch (Waren das Erstvorsorgen?)","pros":"Uses the practice's knowledge.","cons":"One more wizard step."}],"recommended":"a","why":"a as the default, with c offered as a checkbox in the import wizard.","blocks":"M2 engine, M3 import and migration"},{"id":"D-19","title":"Ruhen and return","question":"What happens to due dates during Ruhen (Elternzeit, long absence) and at the return?","owner":"practice","context":"A Pflichtvorsorge must take place before the activity is taken up (§ 4 Abs. 2 ArbMedVV); no rule addresses Ruhen directly, so this is an interpretation the physician confirms in M2.","options":[{"key":"a","label":"Keep dates, hide while ruhend; on return a Pflicht is due the month before return, an Angebot in the return month","pros":"Keeps the AMR maxima; respects § 4 Abs. 2 ArbMedVV.","cons":"Needs a return date to plan ahead."},{"key":"b","label":"Restart intervals at return like an Erstvorsorge","pros":"Simple.","cons":"No legal basis; may delay the zweite Vorsorge."},{"key":"c","label":"Ignore Ruhen for dates, only hide","pros":"Simplest.","cons":"Items surface as long overdue at return."}],"recommended":"a","why":"Stays within the maxima and puts the Pflichtvorsorge before work resumes.","blocks":"M2 engine and events"},{"id":"D-20","title":"Hard limit for longer intervals; n. n. on recurring Vorsorge","question":"May the physician enter a later next month than the AMR 2.1 maximum for Pflicht- or Angebotsvorsorge, and when is n. n. (no further date) allowed on a recurring Pflicht or Angebot?","owner":"both","context":"AMR 2.1 Nr. 3 Abs. 4 says the maximum intervals must not be exceeded, and a Pflichtvorsorge continues while the activity continues (§ 4 Abs. 1, § 10 Abs. 1 Nr. 1 ArbMedVV). The refusal of later months is already written into REQ-FRI-01; open is the n. n. handling.","options":[{"key":"a","label":"Refuse later months; n. n. only with an activity end on or before the maximum, or as a fallback n. n. that keeps the due date at the maximum and goes on the physicians' review list","pros":"Lawful; covers the legitimate case.","cons":"Less flexible."},{"key":"b","label":"Warn and log a later month","pros":"Flexible.","cons":"Permits non-compliant certificates."},{"key":"c","label":"n. n. with a reason alone, no date","pros":"Simple.","cons":"Lets a Pflichtvorsorge lapse while the activity continues."}],"recommended":"a","why":"The only option that cannot produce a late Pflichtvorsorge; the practice confirms the n. n. handling.","blocks":"M2 engine and certificate form"},{"id":"D-21","title":"FSÜ default intervals","question":"Which default intervals does the Eignung row for Fahr-, Steuer- und Überwachungstätigkeiten carry, given that the current DGUV Empfehlung could not be verified?","owner":"practice","context":"The DGUV Grundsätze were replaced in 2022 by the DGUV Empfehlungen; the withdrawn G 25 listed 36–60, 24–36 and 12–24 months by age band. FSÜ is Eignung, so the legal basis is contractual or sector law per Kunde.","options":[{"key":"a","label":"No default; the physician sets each interval","pros":"No unverified values.","cons":"Manual entry."},{"key":"b","label":"Withdrawn G 25 age bands as a flagged proposal","pros":"Familiar.","cons":"Source withdrawn; may be outdated."},{"key":"c","label":"Obtain the current DGUV Empfehlung FSÜ and seed from it","pros":"Correct and current.","cons":"The publication must be bought or borrowed."}],"recommended":"c","why":"Correct values from the current source; a applies until they are entered.","blocks":"M2 seed row FSUE, M5 Eignung"},{"id":"D-22","title":"Kürzel scheme","question":"Which short codes are used for Anlässe (naming D3: Kürzel und Klartext)?","owner":"practice","context":"G-numbers were formally replaced in 2022 and one G-number covers several legal cases; codes are data and can be renamed later.","options":[{"key":"a","label":"Own codes (FEU-P, BIO-PAT, BILD …) with the former G-number as search alias","pros":"Distinguish Pflicht/Angebot and Biostoff sub-cases.","cons":"New codes to learn."},{"key":"b","label":"G-numbers as codes","pros":"Familiar.","cons":"Formally replaced; ambiguous."},{"key":"c","label":"The practice supplies its own list","pros":"Fits habits.","cons":"Delays seeding."}],"recommended":"a","why":"Unambiguous codes while the old numbers still find the entry; renaming is possible in a test session.","blocks":"M2 seed, lists; M5 certificate layout"},{"id":"D-23","title":"Fälligkeitsliste row granularity and status values","question":"dueListCols (G7) fixes the columns (Name, Vorname, Geburtsdatum, Abteilung/Station, Pflicht/Angebot, Status; no Anlass or due-date column). One row per Proband or per Anlass, and which status values?","owner":"both","context":"The list goes to HR; an Anlass column could reveal sensitive Anlässe (06 Q6).","options":[{"key":"a","label":"One row per Proband and Beschäftigung, bundled to the earliest month; Pflicht, Angebot or Pflicht + Angebot; status überfällig / fällig / bald fällig; no due-month column","pros":"Follows G7 and bundling; short lists.","cons":"HR cannot see which Anlass is due (as G7 chose)."},{"key":"b","label":"One row per Anlass","pros":"More detail.","cons":"Without an Anlass column rows look identical; contradicts bundling."},{"key":"c","label":"As a, with optional Anlass and Fällig am columns per Kunde","pros":"Serves Kunden that want detail.","cons":"More to test; re-opens G7; may reveal sensitive Anlässe."}],"recommended":"a","why":"Implements the practice's own column choice with the least disclosure.","blocks":"M2 Fälligkeitsliste export"},{"id":"D-24","title":"Import matching when lists lack birth date and Personalnummer","question":"How are list rows matched to existing Probanden when typical lists carry only name, Station and Tätigkeit (importCols G2), while the practice wants matching on Personalnummer and name plus birth date (matchKey G5)?","owner":"both","context":"Kunden do not accept a template (template G6). A wrong match moves one person's employment to another and, with the automatic ausgeschieden, can end the wrong person's Beschäftigung.","options":[{"key":"a","label":"Tiered matching (Personalnummer + Kunde; name + birth date; name + Kunde + Station as unsicher, confirmed by a person), and the practice asks larger Kunden for a birth-date column","pros":"Safe with today's lists; improves as Kunden comply.","cons":"The assistant confirms uncertain rows at every import."},{"key":"b","label":"Require Kunden to add a birth-date or Personalnummer column","pros":"Reliable.","cons":"Depends on the Kunden, who accept no template."},{"key":"c","label":"Fuzzy auto-match on name + Kunde + Station","pros":"No extra work.","cons":"Namesakes in large clinics; deadlines and ausgeschieden hit the wrong person."}],"recommended":"a","why":"Safe today and better over time; bulk confirmation only for unique exact names.","blocks":"M3 matching"},{"id":"D-25","title":"Safeguard for automatic ausgeschieden","question":"How is the automatic ausgeschieden marking (missingInList G4) protected against partial lists and weak matching?","owner":"practice","context":"Lists arrive sometimes full, sometimes as changes (importMode G3), and HR information is not reliable so far (hrInfo C4).","options":[{"key":"a","label":"Automatic only for imports declared as Gesamtliste for an explicit scope, with import report and one-click undo for 30 days; extra warning below 80 % safe matches; off on a Kunde's first import","pros":"Honours the answer; partial lists cannot trigger it; reversible.","cons":"Relies on the declared mode."},{"key":"b","label":"Propose and confirm","pros":"No wrong exits.","cons":"Contradicts the answer; extra clicks."},{"key":"c","label":"Automatic only above 80 % safe matches, otherwise propose","pros":"Self-protecting.","cons":"Arbitrary threshold; harder to explain."}],"recommended":"a","why":"Keeps the automatic behaviour the practice asked for, bounded by scope, warning and undo.","blocks":"M3, first import per Kunde in M4"},{"id":"D-26","title":"Source of the initial deadlines","question":"Next dates are on the Karteikarten and also in Excel/Numbers lists (toolsNow B12). Which source is complete enough to migrate?","owner":"practice","context":"Probanden without a known date are treated as due now, so an incomplete source floods the first Fälligkeitslisten. Grid entry takes about 30 seconds per card.","options":[{"key":"a","label":"Excel lists only","pros":"No manual entry.","cons":"Probanden without a row show Beginn unbekannt (due now); the first lists flood."},{"key":"b","label":"Excel lists, completed from Karteikarten per Kunde before its cutover","pros":"Correct lists from day one.","cons":"60–200 hours of the assistant's time over the rollout."},{"key":"c","label":"Karteikarten only when the Proband comes back","pros":"No upfront effort.","cons":"Lists wrong for up to three years."}],"recommended":"b","why":"b for Kunden whose Excel list is incomplete, a where the physician confirms the list is complete.","blocks":"M3 migration tool, cutover effort per Kunde"},{"id":"D-27","title":"Retention of imported persons never seen","question":"How long are master data of persons imported from HR lists kept if they never had a Vorsorge with the practice?","owner":"practice","context":"No retention duty applies; data minimisation does (Art. 5(1)(c), (e) GDPR). To be confirmed with the DPO.","options":[{"key":"a","label":"Deletion proposal 12 months after ausgeschieden if no Vorsorge, document or certificate exists; confirmed by an owner","pros":"Minimisation through the existing Löschvorschläge.","cons":"A returning employee is re-imported."},{"key":"b","label":"Kept while the Kunde contract runs","pros":"No re-imports.","cons":"Thousands of records of people never seen."},{"key":"c","label":"Deleted at once on ausgeschieden","pros":"Minimal.","cons":"A wrong missing-from-list deletes data before anyone notices."}],"recommended":"a","why":"Minimises data while leaving a year to catch import errors.","blocks":"M3 import design, deletion proposals"},{"id":"D-28","title":"Reminder channel and sender domain","question":"Through which channel and from which sender do invitations and reminders go out, given that the practice has no own domain (website I9) and the lists carry few e-mail addresses (G2)?","owner":"both","context":"The sender is a processor under Art. 28 GDPR and messages must name no Anlass (SEC-74). System mail (status, emergency access, second-factor resets) is needed from GL1. mailbox.org Business adds a service package of at least 25 EUR net a month, which would break the budget.","options":[{"key":"a","label":"Letters and Hauspost from V1.0b; e-mail from M9 via a new .de practice domain with a netcup Webhosting 1000 mailbox (2.69 EUR gross); SMS later if turnout stays poor","pros":"Reliable, cheap, own sender identity with SPF, DKIM and DMARC.","cons":"Domain and DNS setup; addresses must be collected; SMTP, DKIM and AVV coverage to confirm at order (unverified)."},{"key":"b","label":"An existing Google, IONOS or Proton mailbox via SMTP","pros":"No new account.","cons":"Sending limits; US provider or no fitting AVV."},{"key":"c","label":"E-mail plus SMS","pros":"Reaches people without e-mail.","cons":"Per-message cost; mobile numbers rarely in HR lists."}],"recommended":"a","why":"Cheapest compliant path; mailbox.org only if the practice already holds a Business account.","blocks":"Domain by 2027-06-30 (L-14), M5 letters, M9 e-mail"},{"id":"D-29","title":"Rollout with a pilot Kunde","question":"How is the first release introduced (rollout L4: Weiß nicht)?","owner":"practice","context":"Migration effort and the first go-live depend on whether one Kunde pilots first; the team is two people.","options":[{"key":"a","label":"One pilot Kunde, then the others in waves; paper in parallel per Kunde","pros":"Limits the blast radius; real feedback; migration spread out.","cons":"Two ways of working during the pilot."},{"key":"b","label":"All Kunden at once after migrating all lists","pros":"One cut-over.","cons":"All risks at once; large migration before any value."},{"key":"c","label":"Parallel run for all Kunden, then switch","pros":"Safe.","cons":"Double work for a two-person team."}],"recommended":"a","why":"Pilot: a mid-sized clinic Kunde that sends xlsx, has 200–800 Probanden, keeps its own Kartei and has a Sprechtag in November 2027.","blocks":"M4 pilot and cutover plan"},{"id":"D-30","title":"First go-live scope","question":"What must exist before the first Kunde's real data go into the system?","owner":"both","context":"The answer sets GL1 and the dates of the practice's legal track. Dates assume 20 focused hours a week.","options":[{"key":"a","label":"Kartei, Fristen, Import, Fälligkeitslisten and Nachtrag (GL1 end of M4: first real import week of 2027-10-04, pilot's first Sprechtag on the system in November 2027)","pros":"Earliest relief of fristen einhalten; real feedback on name-only lists with one Kunde.","cons":"Certificates and participant lists stay in Word and Excel until January 2028; operation starts earlier (4 h/week during cutover waves)."},{"key":"b","label":"Wait for Sprechtag and Bescheinigungen (first import about 2028-01-03)","pros":"One go-live with all back-office functions.","cons":"About three months later; pilot's first Sprechtag in February 2028."},{"key":"c","label":"01 §7's V1.0 as written, including online findings (first import about 2028-03)","pros":"Matches 01 literally.","cons":"About five months later; findings used only where the network holds."}],"recommended":"a","why":"Shortest path to daily value, and the riskiest data step happens with one Kunde before certificates depend on it.","blocks":"M4 content of GL1, legal track dates"},{"id":"D-31","title":"Parallel run per Kunde","question":"How long do paper Karteikarten stay in use next to the system for each Kunde?","owner":"practice","context":"Paper is the safety net against engine or migration errors, but double entry costs the assistant time.","options":[{"key":"a","label":"Until two consecutive Sprechtage of that Kunde ran on the system with no unexplained differences; cap six months, then the physician decides","pros":"Ends on evidence.","cons":"Kunden with rare Sprechtage keep paper for months."},{"key":"b","label":"A fixed three months after each cutover","pros":"Simple.","cons":"Says nothing about correctness."},{"key":"c","label":"No parallel run","pros":"No double work.","cons":"No safety net."}],"recommended":"a","why":"Paper ends when the data show the system is right, with a cap.","blocks":"M4 cutover procedure"},{"id":"D-32","title":"Production release cadence","question":"How often do changes go to production after GL1?","owner":"both","context":"The practice tests on staging every second week (involvement K6); releases must avoid Sprechtag days.","options":[{"key":"a","label":"Every two weeks after the practice's test session, in an agreed evening window outside Sprechtage, plus hotfixes","pros":"Small tested steps; feedback in production within two weeks.","cons":"Release notes twice a month."},{"key":"b","label":"Once per milestone","pros":"Fewer changes.","cons":"Large releases; slower feedback."},{"key":"c","label":"Every green merge","pros":"Fastest.","cons":"Untested by the practice; risky on Sprechtag days."}],"recommended":"a","why":"Matches the test rhythm and keeps each change small.","blocks":"Release planning from GL1"},{"id":"D-33","title":"Second-factor method and recovery","question":"Which second factor is used at every login (twoFactor J3), and how are lost factors recovered?","owner":"both","context":"The system builds TOTP and WebAuthn either way; the choice sets what users enrol and what owners buy.","options":[{"key":"a","label":"TOTP app for everyone","pros":"Free, works on every device, small code.","cons":"Not phishing-resistant; a code at every login."},{"key":"b","label":"FIDO2 hardware keys, TOTP as backup","pros":"Phishing-resistant, fastest login, independent of private Apple or Google accounts.","cons":"Two keys per person to buy; the iPad needs a USB-C or NFC key."},{"key":"c","label":"Synced passkeys","pros":"No hardware.","cons":"Recovery depends on private platform accounts outside the practice's control."}],"recommended":"a","why":"TOTP for everyone before real data, then FIDO2 keys (b) for owner accounts before go-live; ten printed recovery codes plus owner reset with call-back; no SMS codes.","blocks":"RD (SEC-17 to SEC-19), WebAuthn in M4"},{"id":"D-34","title":"Encryption at rest and the hoster's § 203 position","question":"How are database and documents encrypted at rest on the rented server, given that the provider's standard AVV may not address § 203 StGB?","owner":"both","context":"Hosting staff are sonstige mitwirkende Personen; the physician is liable if they are not obliged to secrecy (§ 203 Abs. 4 StGB). Whether the netcup or Hetzner AVV covers § 203 is unverified. To be settled with the DPO.","options":[{"key":"a","label":"Provider controls only, plus application-level encryption of document files","pros":"No manual step after a reboot.","cons":"Database files in plaintext on provider storage; § 203 rests on contract alone."},{"key":"b","label":"Encrypted vault for database and documents, unlocked by the operator after each reboot, plus document encryption","pros":"Provider staff and snapshots see only ciphertext.","cons":"After an unplanned reboot the system stays locked until the operator or second technician unlocks it, usually within one working day."},{"key":"c","label":"Application-level encryption of all findings fields","pros":"Protects findings even in dumps.","cons":"Much more code, no SQL search on findings, keys on the same server."}],"recommended":"b","why":"Plus a written question to the provider about § 203; a only if the practice prefers availability and the DPO agrees.","blocks":"RD (SEC-33)"},{"id":"D-35","title":"Developer access and who holds the hosting contract","question":"Who contracts hosting and backup storage, and does the developer have standing or per-request access to production?","owner":"both","context":"The practice wants no vendor lock-in (never M2) and support within 1–2 days (supportSpeed J11), and has no IT service (itService I10).","options":[{"key":"a","label":"The practice holds all contracts; the developer has standing access with a personal hardware-backed key, every session logged, quarterly review","pros":"No lock-in; fixes within 1–2 days.","cons":"Standing access relies on the § 203 undertaking and logging."},{"key":"b","label":"The practice holds contracts; access enabled per maintenance window by an owner","pros":"Least privilege.","cons":"Owners operate a provider console; slow incident response."},{"key":"c","label":"The developer holds contracts and provides hosting as a service","pros":"Simplest billing.","cons":"Lock-in; sub-processor chain; against whyBuild B16."}],"recommended":"a","why":"Ownership stays with the practice while support stays fast; revisit b if the team grows or another operator takes over.","blocks":"RD (SEC-01, SEC-02, SEC-24)"},{"id":"D-36","title":"Deputy emergency access mechanism","question":"How is the deputy physician's access (deputy J9) activated, including when no practice owner can act?","owner":"practice","context":"REQ-BEN-05 as first written let the operator activate on a written request; 02 and 06 build owner activation plus a sealed envelope. REQ-BEN-05 follows the choice.","options":[{"key":"a","label":"Pre-created inactive deputy account with own second factor; an owner activates it for a period (default 14 days)","pros":"Simple, fully logged.","cons":"Fails when no owner can act."},{"key":"b","label":"a plus a sealed emergency envelope with a one-time activation code; using it notifies all owners and the operator","pros":"Works when no owner can act.","cons":"Envelope management; the holder can trigger access (deterred by notification and logging)."},{"key":"c","label":"The operator activates on a written request","pros":"No envelope.","cons":"Puts a medical-access decision on the developer."}],"recommended":"b","why":"Covers the case the deputy exists for; the practice names deputy and envelope holder in writing.","blocks":"GL1 (REQ-BEN-05, SEC-13)"},{"id":"D-37","title":"Practice backup copy","question":"Where does the practice's own backup copy go (localBackup J8, note_J J12, am liebsten cloud und owncloud in A8)?","owner":"both","context":"The system builds one weekly archive: 7z with AES-256 and encrypted file names, holding the open-format export, database dump, documents, runbooks and source code, openable with 7-Zip or Keka. What owncloud means is still open.","options":[{"key":"a","label":"Weekly in-app download by an owner onto two rotating encrypted USB disks, one kept off-site; red dashboard flag after 10 days","pros":"No extra service or hardware; restorable without the developer.","cons":"Depends on discipline."},{"key":"b","label":"Automatic push to the practice's own ownCloud/Nextcloud","pros":"Automatic; matches A8.","cons":"Only if such an instance exists in Germany under an AVV; another credential on the server."},{"key":"c","label":"A NAS in the practice pulls nightly","pros":"Automatic, versioned.","cons":"Hardware, network and patching without an IT service."}],"recommended":"a","why":"a at go-live; add b if the practice confirms an ownCloud/Nextcloud in Germany; c later if the weekly routine slips.","blocks":"GL1 (REQ-BTR-02)"},{"id":"D-38","title":"Audit log retention","question":"How long are read, export and login events kept?","owner":"both","context":"Access logs answer who saw my file but are also staff behaviour data; to be confirmed with the DPO.","options":[{"key":"a","label":"Access events 3 years; change history of medical records as long as the record (§ 630f BGB)","pros":"Covers the regular limitation period (§ 195 BGB); bounded growth.","cons":"Older access questions unanswerable."},{"key":"b","label":"As long as the Proband record exists","pros":"Complete.","cons":"Large log; long retention of staff data."},{"key":"c","label":"1 year","pros":"Minimal.","cons":"Too short for late complaints."}],"recommended":"a","why":"Matches the limitation period, confirmed by the DPO.","blocks":"GL1 (SEC-23, SEC-26)"},{"id":"D-39","title":"DPIA scope and owner","question":"Does the practice carry out a full data protection impact assessment, or document that none is required?","owner":"both","context":"Art. 35(1) GDPR requires the DPIA before the processing and Art. 35(2) the advice of the DPO; health data of 5,000–15,000 Probanden with offline devices. The developer supplies system description and risk table.","options":[{"key":"a","label":"Full DPIA by practice and DPO with the system description and risk table from 02 and 06, including dictation","pros":"Legally safe; mostly existing material.","cons":"DPO time and cost."},{"key":"b","label":"Documented threshold assessment concluding no DPIA","pros":"Least effort.","cons":"Weak at this scale; an omission found later is itself a violation."}],"recommended":"a","why":"Required at this scale and mostly built from existing plan material; done before real data.","blocks":"RD (SEC-05)"},{"id":"D-40","title":"Transport of lists to Kunden","question":"How are Fälligkeitslisten, participant lists and Kartei exports sent to HR departments by e-mail (listChannel C7)?","owner":"practice","context":"The Fälligkeitsliste carries birth dates; a mistyped address among 16–40 Kunden discloses a list. To be agreed with the DPO.","options":[{"key":"a","label":"Plain e-mail attachment over TLS","pros":"No friction for HR.","cons":"Unencrypted in mailboxes; no protection against misdirection."},{"key":"b","label":"Encrypted attachment: AES-256 password PDF, Excel inside an AES-256 ZIP, password agreed once per Kunde by phone","pros":"Protects at rest and on misdirection.","cons":"Password management; HR may need 7-Zip for the ZIP (unverified)."},{"key":"c","label":"Expiring download link from the software","pros":"Nothing in mailboxes.","cons":"An external download path, close to the later employer portal."}],"recommended":"b","why":"b for everything with birth dates or Anlässe; a only for a Kunde that declines encryption in writing with the DPO's agreement; c later with the portal.","blocks":"GL1 (SEC-75)"},{"id":"D-41","title":"Source code ownership and licence","question":"Who owns the source code, and what rights does the practice get so that another developer can take over?","owner":"both","context":"kein Vendor-Lock-in (never M2); the operator agreement of SEC-02 is signed before RD anyway.","options":[{"key":"a","label":"The developer keeps the copyright; the practice gets a written, perpetual, irrevocable, royalty-free licence to use, modify and have modified, plus the source in every weekly archive","pros":"Exit guaranteed by contract and archive; little effort.","cons":"The practice does not control the repository."},{"key":"b","label":"The practice owns repository and copyright","pros":"Strongest control.","cons":"A GitHub account with second factor to keep without IT service; a transfer contract anyway."},{"key":"c","label":"Open-source licence such as EUPL-1.2","pros":"No lock-in at all.","cons":"Publishes the practice's processes; other practices are not a goal (B17)."}],"recommended":"a","why":"Guarantees the exit with little overhead; fits into the SEC-02 agreement.","blocks":"GL1 (SEC-02)"},{"id":"D-42","title":"Employer copy: issuing default and delivery","question":"Today certificates go to the employer only on request (caseStory C1). Should the software create the employer copy after every Vorsorge, and how is it delivered (certDelivery F3)?","owner":"practice","context":"§ 6 Abs. 3 Nr. 3 ArbMedVV obliges the physician to issue a Vorsorgebescheinigung to the employee and to the employer stating that, when and for which Anlass the Vorsorge took place and when a further one is indicated (https://www.gesetze-im-internet.de/arbmedvv/__6.html, checked 2026-11-07).","options":[{"key":"a","label":"Create both copies at every release; hand them over on site where a printer is available; a monthly Sammelversand per Kunde picks up every employer copy not yet delivered; each delivery logged","pros":"Meets the duty; matches F3; the Kunde's Kartei stays complete.","cons":"More paper and postage."},{"key":"b","label":"Create both, send the employer copy only on request","pros":"Close to today.","cons":"Legally weaker; incomplete employer Kartei."},{"key":"c","label":"Employer copy only on request, as today","pros":"No change.","cons":"Does not meet § 6 Abs. 3 Nr. 3."}],"recommended":"a","why":"The only option that meets the legal duty; monthly batch as the default per Kunde.","blocks":"M5 release step, Sammelversand"},{"id":"D-43","title":"Certificates for Probanden with several employers","question":"When one Vorsorge covers Anlässe from two employers (multiEmployer E3: gelegentlich), what goes on each employer copy?","owner":"practice","context":"No employer may learn about the other employment or its hazards; bundling (D8) wants one Vorsorge.","options":[{"key":"a","label":"One Vorsorge record, one employer copy per Kunde listing only that Kunde's Anlässe","pros":"No disclosure; each Kartei correct; keeps bundling.","cons":"Two employer documents for one visit."},{"key":"b","label":"One certificate listing all Anlässe","pros":"Simple.","cons":"Discloses the other employment."},{"key":"c","label":"Separate Vorsorge records per employer","pros":"Clean separation.","cons":"Duplicate documentation; conflicts with bundling."}],"recommended":"a","why":"One visit, correct Kartei for each employer, nothing disclosed.","blocks":"M5 certificates"},{"id":"D-44","title":"Certificate while lab is pending","question":"When lab results are pending, is the certificate issued at the visit or only after the lab is assessed?","owner":"practice","context":"Today the date field is left open when further results are expected (C1).","options":[{"key":"a","label":"Defer both certificates until the Vorsorge is closed; a Wiedervorlage tracks it; the physician can override and issue at once","pros":"Matches today; one correct certificate.","cons":"The employee leaves without a certificate."},{"key":"b","label":"Issue at the visit with the maximum next date, reissue if the lab shortens it","pros":"Immediate.","cons":"Two versions in circulation; corrections to the employer."},{"key":"c","label":"Physician chooses per case","pros":"Flexible.","cons":"One more decision in every such Vorsorge."}],"recommended":"a","why":"Keeps one correct certificate in circulation, as the practice works today.","blocks":"M5 release step"},{"id":"D-45","title":"Signature mode for certificates","question":"Is the scanned signature (signature F4) used for all certificates?","owner":"practice","context":"AMR 6.3 asks for an Unterschrift without defining its form; a non-binding NRW KomNet answer says handwritten; whether a facsimile is accepted is unverified. The software supports scan, handwritten and none per document type, so the answer is a setting.","options":[{"key":"a","label":"Scanned signature everywhere","pros":"Fastest; batches need no manual signing.","cons":"Acceptance unverified; risky where third parties check authenticity."},{"key":"b","label":"Scanned by default; handwritten for Masern-Zeugnis and Strahlenschutz certificate; written enquiry to the Land authority or Ärztekammer about the Vorsorgebescheinigung","pros":"Speed for the bulk; limits exposure where authenticity matters most.","cons":"Two printing paths; one enquiry by the practice."},{"key":"c","label":"Handwritten on all printed certificates","pros":"Legally safest.","cons":"Slow; every batch sheet signed by hand."},{"key":"d","label":"Qualified electronic signature (eHBA)","pros":"Strong for electronic delivery.","cons":"No TI or eHBA (ti I11); not in V1."}],"recommended":"b","why":"Speed where it is safe, handwriting where authenticity is checked, and a written answer for the rest.","blocks":"M5 templates, M9 Strahlenschutz"},{"id":"D-46","title":"Consent form for Eignung","question":"Consent to pass an Eignungsbeurteilung to the employer is signed on paper and scanned (eignungConsent F9). Does the software print the form, or does the practice use its own?","owner":"practice","context":"Without a consent the Eignung employer copy stays disabled; the scan must link to the right consent row.","options":[{"key":"a","label":"The software prints a prefilled form (Proband, Kunde, Anlass, scope, date, revocation note) with the document number as QR code","pros":"Consistent wording; reliable consent gate; fast on site.","cons":"One more template; wording reviewed by the DPO."},{"key":"b","label":"The practice's own paper form; the scan is attached by hand","pros":"No development.","cons":"Linking errors; scope and expiry typed by hand."}],"recommended":"a","why":"Removes linking errors in the step that gates disclosure to the employer.","blocks":"M5 Eignung employer copy"},{"id":"D-47","title":"Kartei responsibility per Kunde","question":"For which Kunden does the practice keep the Vorsorgekartei on the employer's behalf (karteiRole J5: unterschiedlich), and on which contractual basis?","owner":"both","context":"The employer keeps the Vorsorgekartei, ends it with the employment and hands the employee a copy (§ 3 Abs. 4 ArbMedVV). Where the practice keeps it, it likely processes on the employer's behalf under an Art. 28 GDPR agreement [unverified; DPO].","options":[{"key":"a","label":"Per-Kunde flag; by default the Kunde keeps its own Kartei from the employer certificates and the regular Kartei export; Praxis führt only where a Kunde insists, with an Art. 28 agreement and the Austritt flow","pros":"Legally clean; fewest contracts.","cons":"Kunden that rely on the practice today change habits."},{"key":"b","label":"The practice keeps it for every Kunde","pros":"Uniform.","cons":"Processor duties and a contract with every Kunde."},{"key":"c","label":"The practice never keeps it","pros":"Simplest position.","cons":"Contradicts J5 and G9."}],"recommended":"a","why":"Follows the legal default and limits contracts; the DPO confirms the classification before go-live.","blocks":"M5 Kartei export and Kartei-Auszug, migration order"},{"id":"D-48","title":"Medical letters and lab intake: the assistant's contact with medical content","question":"Who prints and envelopes documents with medical content (Ergebnismitteilung, lab and Immunstatus letters), and who receives paper lab mail, given that the assistant sees no findings in the software (J2) but mails results in sealed envelopes today (C1)?","owner":"practice","context":"Both certificate copies carry the same AMR 6.3 fields, so the assistant handles them; medical details go only into the Ergebnismitteilung. The assistant is a berufsmäßige Gehilfin under § 203 Abs. 3 StGB, so J2 is the practice's own need-to-know rule. Also open: an Ergebnismitteilung after every Vorsorge or only when the physician has something to say.","options":[{"key":"a","label":"Strict: physicians print and seal medical letters; lab results arrive digitally into a physician-only inbox; the assistant handles envelopes and Hauspost only","pros":"Fully consistent with J2.","cons":"More clerical work for physicians; paper lab mail still has to be opened by someone."},{"key":"b","label":"As a, plus a Posteingang: the assistant scans paper lab mail into an inbox that holds only date, page count and uploader, with no Proband link and no way to reopen it; a physician files it","pros":"Keeps the assistant's mailing and scanning work; J2 holds for everything stored.","cons":"The assistant briefly sees paper results while scanning."},{"key":"c","label":"The assistant prints medical letters from a queue without viewing them, or sees them fully","pros":"Today's division of labour.","cons":"The paper is still visible; contradicts J2."}],"recommended":"b","why":"Keeps the division of labour; the lab's switch to digital delivery makes paper intake the exception; the Ergebnismitteilung is issued when the physician decides it is needed.","blocks":"M5 permissions, M6 Ergebnismitteilung, M8 lab intake"},{"id":"D-49","title":"Retention of operational documents","question":"Einladungen, reminders and Fälligkeitslisten have no statutory retention period. How long are the PDFs kept?","owner":"practice","context":"Proof of an invitation or offer can matter in a dispute; data minimisation argues against long storage. To be confirmed with the DPO.","options":[{"key":"a","label":"Sending metadata as long as the record; PDFs deleted after 3 years (§ 195 BGB)","pros":"Proof for a reasonable time; minimisation.","cons":"An older list cannot be reproduced exactly."},{"key":"b","label":"Metadata only","pros":"Least data.","cons":"Cannot show what was sent."},{"key":"c","label":"Everything as long as the medical record","pros":"Simplest rule.","cons":"Up to 40 years of data without purpose."}],"recommended":"a","why":"Matches the regular limitation period, confirmed by the DPO.","blocks":"Retention engine from M5"},{"id":"D-50","title":"Findings documentation timing","question":"01 §7 puts structured findings into V1.0. Should they instead become the daily tool together with the offline module?","owner":"both","context":"Nearly all Vorsorgen happen on site with poor internet; until findings are digital the physician documents on paper and records the facts as Nachtrag.","options":[{"key":"a","label":"Findings released for online use in M6, daily on site with offline in M7 (GL2)","pros":"Documentation moves on site once, in a form that works there.","cons":"Vorsorge facts recorded twice (paper, then Nachtrag) for about seven months."},{"key":"b","label":"Findings online before GL1 (01 as written)","pros":"Digital from day one.","cons":"About 3 dev-weeks (6 calendar weeks) more before GL1; used only where the network holds."}],"recommended":"a","why":"Findings documentation is useful on site only when it works offline.","blocks":"M6 scope"},{"id":"D-51","title":"Storage format of the structured findings","question":"How are the template-based findings with Normalbefund defaults (medDocV1 E5) stored?","owner":"developer","context":"The paper forms that define the templates have not arrived yet, and § 630f BGB requires a recognisable history of corrections.","options":[{"key":"a","label":"One JSON document per finding version, validated against the versioned template, item keys stable across versions","pros":"Templates change without migrations; one row per version gives the history.","cons":"Cross-item reports need JSON queries."},{"key":"b","label":"One row per item (entity-attribute-value)","pros":"Queryable per item.","cons":"Many rows; versioning per item."},{"key":"c","label":"One table per template","pros":"Typed columns.","cons":"A migration for every template change."}],"recommended":"a","why":"Templates can change without migrations and versions are whole documents.","blocks":"M6 Befunddokumentation"},{"id":"D-52","title":"Blood pressure fields in V1","question":"Does the documentation template get optional RR and pulse fields although measured values are Später (modules.vitals H1)?","owner":"practice","context":"The only device in use is a blood pressure monitor (medDevices I4); the target is 1–3 minutes per standard Vorsorge.","options":[{"key":"a","label":"Optional RR/Puls fields in the Befund section","pros":"Matches the device in use; comparable over time.","cons":"Slightly beyond H1."},{"key":"b","label":"Free text only","pros":"Exactly H1.","cons":"Not comparable."},{"key":"c","label":"Full vitals (Größe, Gewicht, BMI, Seh-/Hörtest)","pros":"Complete.","cons":"Slows the 1–3 minute target."}],"recommended":"a","why":"Two optional fields cost nothing in the click budget.","blocks":"M6 templates"},{"id":"D-53","title":"Telemedicine handling in V1","question":"How are telemedizinische Vorsorgen (places B10) handled while the video module is Später?","owner":"practice","context":"Under AMR 3.4 Nr. 4 the physician checks before each telemedical Vorsorge whether it is vertretbar, the first Pflicht- or Angebotsvorsorge im Betrieb is held in person, and the employer is told the result of the check in Textform (https://vorschriften.bgn-branchenwissen.de/daten/tr/amr3_4/4.htm). These rules are already in REQ-DOK-12; open is how the call itself is handled.","options":[{"key":"a","label":"Record Durchführung (Präsenz, Video, Telefon) with the AMR 3.4 check and employer notice; the call runs in an external tool","pros":"Compliant documentation; nothing to build for video.","cons":"A separate tool for the call."},{"key":"b","label":"Integrate a video service in V1","pros":"One tool.","cons":"H1 says later; another processor to review."},{"key":"c","label":"Do not record the mode","pros":"Nothing to build.","cons":"The AMR 3.4 check and its documentation are lost."}],"recommended":"a","why":"Compliant without building video; until M6 telemedical Vorsorgen are documented on paper as today.","blocks":"M6 (REQ-DOK-12)"},{"id":"D-54","title":"Timing of the digital Vorab-Anamnese","question":"When do Probanden fill the Anamnese questionnaire themselves (link or tablet), given wichtig in the A6 correction but Später in H1?","owner":"practice","context":"A Proband-facing form needs a public entry point with health data, its own security review and consent text.","options":[{"key":"a","label":"After V1.3 as its own slice; in M6 the questionnaire is structured so the Proband can later fill it without remodelling","pros":"Keeps a public entry point with health data out of V1.","cons":"The physician keeps entering answers in V1."},{"key":"b","label":"In V1.3 as a tablet kiosk on site","pros":"No internet-facing form.","cons":"Needs a tablet with offline support; contradicts Tablet später."},{"key":"c","label":"Early, by e-mail link","pros":"Earliest benefit.","cons":"Few e-mail addresses; large security work up front."}],"recommended":"a","why":"Prepares the data structure now without opening a public health-data entry point in V1.","blocks":"M6 template structure"},{"id":"D-55","title":"Offline data scope","question":"What may a physician's laptop hold for an offline Sprechtag?","owner":"both","context":"Walk-ins and replacements for no-shows are common (C1); a lost laptop triggers an Art. 33 GDPR assessment. Each package part has its own switch, so the answer is configuration.","options":[{"key":"a","label":"Participants only, with their history","pros":"Smallest exposure.","cons":"Walk-ins cannot be found offline."},{"key":"b","label":"Participants with full history, plus a master-data-only directory of the active Beschäftigte at the Kunde-Standort; no scans; one package per Sprechtag, wiped after sync","pros":"Covers walk-ins; about 2 MB for 4,000 people; mirrors today's paper preparation.","cons":"
